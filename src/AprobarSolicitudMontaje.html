<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      .spinner {
        display: inline-block; width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid var(--color-borde); border-top-color: var(--color-primario);
        animation: girar 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
      }
      @keyframes girar { to { transform: rotate(360deg); } }
      .fila-solicitud {
        padding: 8px 0; border-bottom: 1px solid var(--color-borde); font-size: 12px;
      }
      .fila-solicitud .nombre { font-weight: bold; }
      .fila-solicitud .modulos { color: var(--color-texto-secundario); }
      .resultado-ok {
        margin-top: 10px; padding: 8px 10px; background: var(--color-fondo-suave);
        border-radius: var(--radio-borde); font-size: 12px;
      }
    </style>
  </head>
  <body>
    <?!= include('IndicadorCargaGlobal') ?>
    <h3>Aprobar solicitud de montaje</h3>
    <p style="color:var(--color-texto-secundario); font-size:12px; margin-top:0;">
      Crea el Spreadsheet y el proyecto de Apps Script de verdad -- no hay vuelta atrás. Tarda unos
      segundos: se ve el progreso aquí, no hace falta escribir nada a mano en SOLICITUDES_MONTAJE.
    </p>

    <label for="selectSolicitud">Solicitud pendiente</label>
    <select id="selectSolicitud"><option>Cargando...</option></select>
    <div class="ayuda-campo" id="detalleSolicitud"></div>

    <div id="mensaje"></div>
    <div class="resultado-ok" id="resultadoOk" style="display:none;"></div>

    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="boton boton-primario" id="btnAprobar" onclick="aprobar()">Aprobar y crear</button>
    </div>

    <script>
      var SOLICITUDES_ = [];

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return '';
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function mostrarError(error) {
        document.getElementById('btnAprobar').disabled = false;
        document.getElementById('mensaje').style.color = 'var(--color-peligro)';
        document.getElementById('mensaje').innerHTML = 'Error: ' + escapeHtml(error && error.message ? error.message : error);
      }

      function pintarSelect_() {
        var select = document.getElementById('selectSolicitud');
        if (SOLICITUDES_.length === 0) {
          select.innerHTML = '<option value="">No hay solicitudes pendientes</option>';
          document.getElementById('btnAprobar').disabled = true;
          return;
        }
        select.innerHTML = SOLICITUDES_.map(function (s) {
          return '<option value="' + escapeHtml(s.idTemporal) + '">' + escapeHtml(s.idTemporal) + ' -- ' + escapeHtml(s.nombre) + '</option>';
        }).join('');
        mostrarDetalle_();
      }

      function mostrarDetalle_() {
        var idTemporal = document.getElementById('selectSolicitud').value;
        var s = SOLICITUDES_.filter(function (x) { return x.idTemporal === idTemporal; })[0];
        document.getElementById('detalleSolicitud').textContent = s ? 'Módulos: ' + s.modulos : '';
      }

      document.getElementById('selectSolicitud').addEventListener('change', mostrarDetalle_);

      function aprobar() {
        var idTemporal = document.getElementById('selectSolicitud').value;
        if (!idTemporal) { mostrarError({ message: 'No hay ninguna solicitud seleccionada.' }); return; }

        document.getElementById('btnAprobar').disabled = true;
        document.getElementById('resultadoOk').style.display = 'none';
        document.getElementById('mensaje').style.color = 'var(--color-texto-secundario)';
        document.getElementById('mensaje').innerHTML = '<span class="spinner"></span>Creando el sheet y el proyecto de Apps Script... esto puede tardar hasta medio minuto.';

        google.script.run
          .withFailureHandler(mostrarError)
          .withSuccessHandler(function (resultado) {
            document.getElementById('mensaje').textContent = '';
            var caja = document.getElementById('resultadoOk');
            caja.style.display = 'block';
            caja.innerHTML = '<strong>Montado correctamente.</strong><br><a href="' + escapeHtml(resultado.spreadsheetUrl) + '" target="_blank">Abrir el sheet nuevo</a>' +
              '<br><br><strong>Paso obligatorio, una sola vez:</strong> en el sheet nuevo, Extensiones → Apps Script → elige <code>onOpen</code> → ▶ Ejecutar → acepta los permisos. ' +
              'Google exige esa autorización manual la primera vez que un proyecto creado por API se ejecuta -- hasta entonces el menú no aparece. Después, el menú aparece solo al abrir el sheet.';
            SOLICITUDES_ = SOLICITUDES_.filter(function (s) { return s.idTemporal !== idTemporal; });
            pintarSelect_();
            document.getElementById('btnAprobar').disabled = SOLICITUDES_.length === 0;
          })
          .aprobarSolicitudMontaje(idTemporal);
      }

      google.script.run
        .withFailureHandler(mostrarError)
        .withSuccessHandler(function (solicitudes) {
          SOLICITUDES_ = solicitudes;
          pintarSelect_();
        })
        .obtenerSolicitudesPendientesMontaje();
    </script>
  </body>
</html>
