<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      /*
       * Ver conversación -- "los botones crean confusión y se escapan
       * de la visión normal de la hoja": showSidebar() ignora
       * setWidth() (mismo caso ya documentado en PanelCampana.html), así
       * que ensanchar el panel no es una opción -- el arreglo es que el
       * contenido quepa en un ancho estrecho sin truncarse. "Hoy" es el
       * modo por defecto y el más usado, así que va solo en su propia
       * fila a ancho completo; los otros dos comparten fila pero con
       * texto corto y wrap permitido en vez de recortarse (antes el
       * botón "Cargar" del rango libre se veía como una "C" suelta).
       * El rango personalizado queda oculto tras un enlace hasta que se
       * pide explícitamente, para no competir visualmente con los 3
       * accesos directos que cubren el 90% de los usos.
       */
      .accesos-directos { margin-bottom: 6px; }
      .acceso-principal { width: 100%; font-size: 13px; padding: 8px 6px; margin-bottom: 6px; }
      .accesos-secundarios { display: flex; gap: 6px; }
      .accesos-secundarios button { flex: 1 1 0; min-width: 0; font-size: 12px; padding: 8px 4px; white-space: normal; line-height: 1.2; }
      .accesos-directos button.activo { background: var(--color-primario); border-color: var(--color-primario); color: #fff; }
      .rango-toggle { font-size: 12px; color: var(--color-primario); cursor: pointer; margin: 6px 0; text-decoration: underline; }
      .rango-libre { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .rango-libre input[type="date"] { flex: 1 1 100px; min-width: 0; font-size: 12px; padding: 6px; }
      .rango-libre button { flex: 1 1 100%; }
      .rango-mostrado { color: var(--color-texto-secundario); font-size: 13px; margin-bottom: 6px; }
      .resumen-numerico { font-size: 13px; margin-bottom: 10px; color: var(--color-texto); }
      .acciones-export { display: flex; gap: 6px; margin-bottom: 12px; }
      .acciones-export button { flex: 1; font-size: 13px; padding: 7px; }
      .alertas-panel { background: var(--color-peligro-fondo); color: var(--color-peligro); padding: 8px 10px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; }
      .bloqueos-panel { margin-bottom: 12px; }
      .bloqueos-panel h4 { font-size: 13px; margin: 0 0 4px; color: var(--color-peligro); }
      .bloqueo-item { padding: 4px 0 4px 12px; cursor: pointer; font-size: 13px; border-left: 2px solid var(--color-peligro); margin-bottom: 2px; }
      .bloqueo-item:hover { background: var(--color-fondo-suave); }
      .bloqueo-item .bloqueo-tarea { font-weight: bold; }
      .bloqueo-item .bloqueo-detalle { color: var(--color-texto-secundario); font-size: 12px; }
      .bloque-entidad { margin-bottom: 10px; }
      .bloque-entidad summary { cursor: pointer; padding: 6px 4px; font-size: 14px; font-weight: bold; }
      .bloque-entidad summary::-webkit-details-marker { color: var(--color-texto-secundario); }
      .bloque-entidad > div { margin-left: 8px; }
      .seccion-titulo { font-weight: bold; font-size: 13px; margin: 6px 0 2px; color: var(--color-texto-secundario); }
      .seccion-titulo-alerta { color: var(--color-peligro); }
      .grupo-responsable { margin-bottom: 6px; }
      .nombre-responsable { font-weight: bold; font-size: 13px; }
      .fila-item { padding: 4px 0 4px 12px; display: flex; justify-content: space-between; gap: 6px; cursor: pointer; }
      .fila-item:hover { background: var(--color-fondo-suave); }
      .fila-item .fecha-item { color: var(--color-texto-secundario); font-size: 12px; white-space: nowrap; }
      .badge-atraso { color: var(--color-peligro); font-weight: bold; }
      .vacio-seccion { color: var(--color-texto-secundario); font-style: italic; font-size: 12px; margin: 2px 0 8px 12px; }
      .vacio-global { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; text-align: center; padding: 20px 0 4px; }
      .diagnostico-vacio { color: var(--color-texto-secundario); font-size: 11px; text-align: center; padding: 0 12px 16px; line-height: 1.6; }
      .filtro-campana-proyecto { margin-bottom: 10px; }
      .filtro-campana-proyecto select { width: 100%; font-size: 13px; padding: 6px; }
    </style>
  </head>
  <body>
    <?!= include('IndicadorCargaGlobal') ?>
    <div class="accesos-directos">
      <button id="btnHoy" class="acceso-principal" onclick="cargarPreset_('HOY')">Hoy</button>
      <div class="accesos-secundarios">
        <button id="btnEstaSemana" onclick="cargarPreset_('ESTA_SEMANA')">Esta semana</button>
        <button id="btnSemanaSiguiente" onclick="cargarPreset_('SEMANA_SIGUIENTE')">Semana que viene</button>
      </div>
    </div>
    <div class="rango-toggle" onclick="toggleRangoLibre_()">Rango personalizado ▾</div>
    <div class="rango-libre" id="rangoLibreContenedor" style="display:none;">
      <input type="date" id="fechaInicioRango">
      <input type="date" id="fechaFinRango">
      <button onclick="cargarRangoLibre_()">Cargar</button>
    </div>

    <div class="rango-toggle" onclick="toggleFiltroCampanaProyecto_()">Filtrar por campaña o proyecto ▾</div>
    <div class="filtro-campana-proyecto" id="filtroCampanaProyectoContenedor" style="display:none;">
      <select id="selectFiltroCampanaProyecto" onchange="cambiarFiltroCampanaProyecto_()">
        <option value="">Todas las campañas y proyectos</option>
        <optgroup label="Campañas" id="optgroupCampanas"></optgroup>
        <optgroup label="Proyectos" id="optgroupProyectos"></optgroup>
      </select>
    </div>

    <div id="estadoCarga">Cargando...</div>
    <div class="rango-mostrado" id="rangoMostrado"></div>
    <div class="resumen-numerico" id="resumenNumerico"></div>
    <div id="alertasPanel"></div>
    <div id="bloqueosPanel"></div>
    <div id="resultado"></div>

    <div class="acciones-export">
      <button onclick="exportarCSV_()">Exportar CSV</button>
      <button onclick="exportarPDF_()">Exportar PDF</button>
    </div>

    <script>
      var MODO_ACTUAL = 'HOY';
      var FECHA_INICIO_ACTUAL = '';
      var FECHA_FIN_ACTUAL = '';
      var FILTRO_CAMPANA_ACTUAL = '';
      var FILTRO_PROYECTO_ACTUAL = '';
      var TEXTO_BOTON_ = { HOY: 'Hoy', ESTA_SEMANA: 'Esta semana', SEMANA_SIGUIENTE: 'Semana que viene' };

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return '';
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatearFecha_(fecha) {
        if (!fecha) return '';
        var d = new Date(fecha);
        if (isNaN(d.getTime())) return '';
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm + '/' + d.getFullYear();
      }

      function mostrarError(error) {
        var el = document.getElementById('estadoCarga');
        el.textContent = 'Error: ' + (error && error.message ? error.message : error);
        el.style.display = 'block';
      }

      function marcarBotonActivo_(modo) {
        ['btnHoy', 'btnEstaSemana', 'btnSemanaSiguiente'].forEach(function (id) {
          document.getElementById(id).classList.remove('activo');
        });
        var mapa = { HOY: 'btnHoy', ESTA_SEMANA: 'btnEstaSemana', SEMANA_SIGUIENTE: 'btnSemanaSiguiente' };
        if (mapa[modo]) document.getElementById(mapa[modo]).classList.add('activo');
      }

      function toggleRangoLibre_() {
        var el = document.getElementById('rangoLibreContenedor');
        el.style.display = (el.style.display === 'none') ? 'flex' : 'none';
      }

      function toggleFiltroCampanaProyecto_() {
        var el = document.getElementById('filtroCampanaProyectoContenedor');
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
      }

      function cambiarFiltroCampanaProyecto_() {
        var valor = document.getElementById('selectFiltroCampanaProyecto').value;
        FILTRO_CAMPANA_ACTUAL = '';
        FILTRO_PROYECTO_ACTUAL = '';
        if (valor.indexOf('CAMPANA:') === 0) FILTRO_CAMPANA_ACTUAL = valor.slice('CAMPANA:'.length);
        else if (valor.indexOf('PROYECTO:') === 0) FILTRO_PROYECTO_ACTUAL = valor.slice('PROYECTO:'.length);
        cargar_();
      }

      function cargarOpcionesFiltroCampanaProyecto_() {
        google.script.run
          .withFailureHandler(function () {})
          .withSuccessHandler(function (opciones) {
            var elCampanas = document.getElementById('optgroupCampanas');
            var elProyectos = document.getElementById('optgroupProyectos');
            (opciones.campanas || []).forEach(function (c) {
              var opt = document.createElement('option');
              opt.value = 'CAMPANA:' + c.id;
              opt.textContent = c.etiqueta;
              elCampanas.appendChild(opt);
            });
            (opciones.proyectos || []).forEach(function (p) {
              var opt = document.createElement('option');
              opt.value = 'PROYECTO:' + p.id;
              opt.textContent = p.etiqueta;
              elProyectos.appendChild(opt);
            });
          })
          .obtenerOpcionesFiltroPanelTemporal();
      }

      function cargarPreset_(modo) {
        MODO_ACTUAL = modo;
        FECHA_INICIO_ACTUAL = '';
        FECHA_FIN_ACTUAL = '';
        marcarBotonActivo_(modo);
        cargar_();
      }

      function cargarRangoLibre_() {
        var inicio = document.getElementById('fechaInicioRango').value;
        var fin = document.getElementById('fechaFinRango').value;
        if (!inicio || !fin) { mostrarError('Elige fecha de inicio y de fin.'); return; }
        MODO_ACTUAL = 'RANGO';
        FECHA_INICIO_ACTUAL = inicio;
        FECHA_FIN_ACTUAL = fin;
        marcarBotonActivo_('RANGO');
        cargar_();
      }

      function cargar_() {
        document.getElementById('estadoCarga').style.display = 'block';
        document.getElementById('estadoCarga').textContent = 'Cargando...';
        google.script.run
          .withSuccessHandler(renderizarPanel_)
          .withFailureHandler(mostrarError)
          .obtenerPanelTemporal(MODO_ACTUAL, FECHA_INICIO_ACTUAL, FECHA_FIN_ACTUAL, FILTRO_CAMPANA_ACTUAL, FILTRO_PROYECTO_ACTUAL);
      }

      function cargarResumenBotones_() {
        google.script.run
          .withFailureHandler(function () {})
          .withSuccessHandler(function (resumen) {
            Object.keys(TEXTO_BOTON_).forEach(function (modo) {
              var mapa = { HOY: 'btnHoy', ESTA_SEMANA: 'btnEstaSemana', SEMANA_SIGUIENTE: 'btnSemanaSiguiente' };
              var n = resumen[modo] || 0;
              document.getElementById(mapa[modo]).textContent = TEXTO_BOTON_[modo] + (n > 0 ? ' (' + n + ')' : '');
            });
          })
          .obtenerResumenPanelTemporal();
      }

      function renderizarPanel_(datos) {
        document.getElementById('estadoCarga').style.display = 'none';
        document.getElementById('rangoMostrado').textContent =
          formatearFecha_(datos.rangoInicio) + ' — ' + formatearFecha_(datos.rangoFin);

        var alertas = datos.alertas || { sobreasignaciones: [], recursosSinCompetenciaDisponible: [], totalSinFechaPlanificada: 0 };
        var elAlertas = document.getElementById('alertasPanel');
        var lineasAlerta = [];
        if (alertas.sobreasignaciones.length > 0) lineasAlerta.push(alertas.sobreasignaciones.length + ' persona(s) sobreasignada(s)');
        if (alertas.recursosSinCompetenciaDisponible.length > 0) lineasAlerta.push(alertas.recursosSinCompetenciaDisponible.length + ' recurso(s) sin técnico disponible');
        if (alertas.totalSinFechaPlanificada > 0) lineasAlerta.push(alertas.totalSinFechaPlanificada + ' registro(s) abierto(s) sin fecha planificada');
        elAlertas.innerHTML = lineasAlerta.length ? '<div class="alertas-panel">⚠ ' + lineasAlerta.join(' · ') + '.</div>' : '';

        var bloqueos = datos.bloqueos || [];
        document.getElementById('bloqueosPanel').innerHTML = bloqueos.length ? renderBloqueos_(bloqueos) : '';

        var bloques = (datos.bloques || []).filter(function (b) {
          return contarItems_(b.pendientes) > 0 || contarItems_(b.hechos) > 0 || contarItems_(b.sinFecha) > 0;
        });

        var resumen = bloques.map(function (b) {
          return contarItems_(b.pendientes) + ' ' + b.etiqueta.toLowerCase();
        }).join(' · ');
        document.getElementById('resumenNumerico').textContent = resumen ? resumen + ' pendiente(s)' : '';

        document.getElementById('resultado').innerHTML = bloques.length
          ? bloques.map(renderBloque_).join('')
          : renderVacioConDiagnostico_(datos.bloques);
      }

      /*
       * Ver conversación -- "siguen sin aparecer datos": distingue "no
       * hay ninguna tarea activa" de "hay activas pero sin fecha
       * utilizable" en vez de dejar un "nada que reportar" mudo que no
       * dice si el problema es de datos o de formato de fecha.
       */
      function renderVacioConDiagnostico_(bloquesSinFiltrar) {
        var lineas = (bloquesSinFiltrar || []).map(function (b) {
          var d = b.diagnostico || { totalActivos: 0, abiertos: 0, conFechaUsable: 0 };
          return escapeHtml(b.etiqueta) + ': ' + d.totalActivos + ' activa(s), ' + d.abiertos + ' sin cerrar, ' + d.conFechaUsable + ' con fecha utilizable';
        });
        return '<div class="vacio-global">Nada que reportar en este rango.</div>' +
          (lineas.length ? '<div class="diagnostico-vacio">' + lineas.join('<br>') + '</div>' : '');
      }

      function contarItems_(grupos) {
        return (grupos || []).reduce(function (acc, g) { return acc + g.items.length; }, 0);
      }

      function renderBloque_(bloque) {
        var totalPendientes = contarItems_(bloque.pendientes);
        var totalHechos = contarItems_(bloque.hechos);
        var totalSinFecha = contarItems_(bloque.sinFecha);
        var resumenTitulo = totalPendientes + ' pendiente' + (totalPendientes === 1 ? '' : 's') + ', ' + totalHechos + ' hecho' + (totalHechos === 1 ? '' : 's') +
          (totalSinFecha > 0 ? ', ' + totalSinFecha + ' sin fecha' : '');
        return '<details class="bloque-entidad" open>' +
          '<summary>' + escapeHtml(bloque.etiqueta) + ' (' + resumenTitulo + ')</summary>' +
          '<div>' +
          (totalPendientes > 0 ? '<div class="seccion-titulo">Pendiente</div>' + renderGrupos_(bloque, bloque.pendientes, false) : '') +
          (totalHechos > 0 ? '<div class="seccion-titulo">Hecho</div>' + renderGrupos_(bloque, bloque.hechos, true) : '') +
          (totalSinFecha > 0 ? '<div class="seccion-titulo seccion-titulo-alerta">Sin fecha planificada</div>' + renderGrupos_(bloque, bloque.sinFecha, false) : '') +
          '</div></details>';
      }

      function renderGrupos_(bloque, grupos, esHecho) {
        return grupos.map(function (grupo) {
          var filas = grupo.items.map(function (item) {
            return renderItem_(bloque, item, esHecho);
          }).join('');
          return '<div class="grupo-responsable"><div class="nombre-responsable">' +
            escapeHtml(grupo.responsable) + '</div>' + filas + '</div>';
        }).join('');
      }

      function renderItem_(bloque, item, esHecho) {
        var nombre = item[bloque.campoNombre] || item.ID;
        var fecha = formatearFecha_(item.FECHA_FIN_PLAN || item.FECHA_LIMITE || item.FECHA_FIN_REAL || item.FECHA_RESOLUCION);
        var atraso = (!esHecho && item.DIAS_ATRASO !== null && item.DIAS_ATRASO !== undefined && item.DIAS_ATRASO > 0)
          ? ' <span class="badge-atraso">+' + item.DIAS_ATRASO + 'd</span>' : '';
        return '<div class="fila-item" onclick="abrirEdicion_(\'' + bloque.entidad + '\',\'' + item.ID + '\')">' +
          '<span>' + escapeHtml(nombre) + '</span>' +
          '<span class="fecha-item">' + escapeHtml(item.ESTADO) + (fecha ? ' · ' + fecha : '') + atraso + '</span>' +
          '</div>';
      }

      function abrirEdicion_(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion(entidad, id);
      }

      function renderBloqueos_(bloqueos) {
        var filas = bloqueos.map(function (b) {
          return '<div class="bloqueo-item" onclick="abrirEdicion_(\'' + b.entidad + '\',\'' + b.entidadId + '\')">' +
            '<div class="bloqueo-tarea">' + escapeHtml(b.entidadNombre || b.entidadId) + '</div>' +
            '<div class="bloqueo-detalle">' + escapeHtml(b.detalle) + '</div>' +
            '</div>';
        }).join('');
        return '<div class="bloqueos-panel"><h4>⛔ Bloqueos (' + bloqueos.length + ')</h4>' + filas + '</div>';
      }

      function exportarCSV_() {
        google.script.run.withFailureHandler(mostrarError)
          .abrirDialogoExportarPanelTemporalCSV(MODO_ACTUAL, FECHA_INICIO_ACTUAL, FECHA_FIN_ACTUAL, FILTRO_CAMPANA_ACTUAL, FILTRO_PROYECTO_ACTUAL);
      }

      function exportarPDF_() {
        google.script.run.withFailureHandler(mostrarError)
          .abrirDialogoExportarPanelTemporalPDF(MODO_ACTUAL, FECHA_INICIO_ACTUAL, FECHA_FIN_ACTUAL, FILTRO_CAMPANA_ACTUAL, FILTRO_PROYECTO_ACTUAL);
      }

      /* Recuerda el último modo usado (por usuario) -- ver conversación "recordar el último modo usado entre aperturas". */
      google.script.run
        .withFailureHandler(function () { marcarBotonActivo_('HOY'); cargar_(); })
        .withSuccessHandler(function (ultimo) {
          if (ultimo.modo === 'RANGO' && ultimo.fechaInicioISO && ultimo.fechaFinISO) {
            document.getElementById('fechaInicioRango').value = ultimo.fechaInicioISO;
            document.getElementById('fechaFinRango').value = ultimo.fechaFinISO;
            document.getElementById('rangoLibreContenedor').style.display = 'flex';
            MODO_ACTUAL = 'RANGO';
            FECHA_INICIO_ACTUAL = ultimo.fechaInicioISO;
            FECHA_FIN_ACTUAL = ultimo.fechaFinISO;
            marcarBotonActivo_('RANGO');
          } else {
            MODO_ACTUAL = ultimo.modo || 'HOY';
            marcarBotonActivo_(MODO_ACTUAL);
          }
          cargar_();
        })
        .obtenerUltimoModoPanelTemporal();

      cargarResumenBotones_();
      cargarOpcionesFiltroCampanaProyecto_();
    </script>
  </body>
</html>
