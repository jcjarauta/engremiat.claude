<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Ficha de material</title>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .badge-aviso { background: #fff8e1; color: #8a6d00; }
      .badge-preferente { background: #fff8e1; color: #8a6d00; }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      .resumen-avance { display: flex; gap: 14px; flex-wrap: wrap; background: var(--color-fondo-suave); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
      .resumen-avance .dato { display: flex; flex-direction: column; }
      .resumen-avance .dato .valor { font-size: 16px; font-weight: bold; }
      .resumen-avance .dato .etiqueta { color: var(--color-texto-secundario); font-size: 11px; }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="nombreMaterial"></h2>
        <div class="detalle" id="detalleMaterial"></div>
        <div class="acciones">
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
          <button id="btnNuevoMovimiento" class="boton btn-mini">+ Movimiento</button>
        </div>
      </div>

      <div class="resumen-avance" id="resumenMaterial"></div>

      <section class="bloque">
        <h3>Productos que lo usan <button id="btnNuevoProducto" class="boton btn-mini">+ Producto</button></h3>
        <div class="lista" id="listaProductos"></div>
      </section>
      <section class="bloque">
        <h3>Proveedores <button id="btnNuevoProveedor" class="boton btn-mini">+ Proveedor</button></h3>
        <div class="lista" id="listaProveedores"></div>
      </section>
      <section class="bloque"><h3>Movimientos recientes</h3><div class="lista" id="listaMovimientos"></div></section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("inactiv") !== -1 || texto.indexOf("agotado") !== -1 || texto.indexOf("no utiliz") !== -1 || texto.indexOf("cancel") !== -1) return "badge-bloqueado";
        if (texto.indexOf("disponible") !== -1 || texto.indexOf("activ") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      var ETIQUETA_ESTADO_STOCK_ = {
        agotado: { texto: 'Agotado', clase: 'badge-bloqueado' },
        reservas_superan_stock: { texto: 'Reservas superan stock', clase: 'badge-bloqueado' },
        stock_bajo: { texto: 'Stock bajo', clase: 'badge-aviso' },
        sano: { texto: 'Stock sano', clase: 'badge-completado' }
      };

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'MATERIAL', ID_REGISTRO);
      }

      function verFichaProveedor(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaProveedor(id);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      /* Ver ficha del proveedor ademas de editar la relacion (ver conversacion: navegacion cruzada Material<->Proveedor). */
      function filaProveedorHtml_(infoHtml, relacionId, proveedorId) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<span class="celda-acciones" style="display:flex;gap:6px;">' +
          '<button class="boton btn-mini" onclick="verFichaProveedor(\'' + proveedorId + '\')">Ver ficha</button>' +
          '<button class="boton btn-mini" onclick="editar(\'PROVEEDOR_MATERIAL\',\'' + relacionId + '\')">Editar</button>' +
          '</span></div>';
      }

      function fechaCorta_(v) {
        return v ? new Date(v).toLocaleDateString() : '?';
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var m = datos.material;
        var estadoStock = ETIQUETA_ESTADO_STOCK_[datos.estadoStock];
        document.getElementById("nombreMaterial").innerHTML = escapeHtml(m.NOMBRE) + renderBadge_(m.ESTADO);
        document.getElementById("detalleMaterial").textContent =
          m.ID + (m.CODIGO ? " · " + m.CODIGO : "") + (m.CATEGORIA ? " · " + m.CATEGORIA : "");

        document.getElementById("resumenMaterial").innerHTML =
          '<div class="dato"><span class="valor">' + (m.STOCK_ACTUAL || 0) + '</span><span class="etiqueta">stock actual</span></div>' +
          '<div class="dato"><span class="valor">' + (m.STOCK_MINIMO || 0) + '</span><span class="etiqueta">stock mínimo</span></div>' +
          '<div class="dato"><span class="valor">' + (m.CANTIDAD_RESERVADA || 0) + '</span><span class="etiqueta">reservado</span></div>' +
          '<div class="dato"><span class="badge ' + estadoStock.clase + '">' + estadoStock.texto + '</span></div>';

        document.getElementById("listaProductos").innerHTML = datos.productos.length
          ? datos.productos.map(function (p) {
              return filaHtml_(escapeHtml(p.productoNombre) + (p.cantidadPrevista ? ' <span class="detalle-secundario">— ' + escapeHtml(p.cantidadPrevista) + (p.unidad ? ' ' + escapeHtml(p.unidad) : '') + '</span>' : '') + renderBadge_(p.estado), 'PRODUCTO_MATERIAL', p.relacionId);
            }).join("")
          : '<div class="vacio-bloque">Ningún producto lo usa todavía.</div>';

        document.getElementById("listaProveedores").innerHTML = datos.proveedores.length
          ? datos.proveedores.map(function (pr) {
              var preferente = pr.esPreferente ? ' <span class="badge badge-preferente">preferente</span>' : '';
              var precio = pr.precioUnitario ? ' <span class="detalle-secundario">— ' + escapeHtml(pr.precioUnitario) + ' €/ud</span>' : '';
              var plazo = pr.plazoEntregaDias ? ' <span class="detalle-secundario">(' + escapeHtml(pr.plazoEntregaDias) + ' días)</span>' : '';
              return filaProveedorHtml_(escapeHtml(pr.proveedorNombre) + precio + plazo + preferente + renderBadge_(pr.estado), pr.relacionId, pr.proveedorId);
            }).join("")
          : '<div class="vacio-bloque">Sin proveedores registrados.</div>';

        document.getElementById("listaMovimientos").innerHTML = datos.movimientos.length
          ? datos.movimientos.slice(0, 15).map(function (mv) {
              return filaHtml_(
                escapeHtml(mv.tipo) + ' <span class="detalle-secundario">' + escapeHtml(mv.cantidad) + (mv.unidad ? ' ' + escapeHtml(mv.unidad) : '') + ' · ' + fechaCorta_(mv.fecha) + (mv.responsableNombre ? ' · ' + escapeHtml(mv.responsableNombre) : '') + '</span>',
                'MOVIMIENTO_MATERIAL', mv.id
              );
            }).join("")
          : '<div class="vacio-bloque">Sin movimientos registrados.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("MATERIAL", m.ID); });
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaMaterialCSV(m.ID);
        });
        document.getElementById("btnNuevoMovimiento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearMovimientoMaterialParaMaterial(m.ID);
        });
        document.getElementById("btnNuevoProducto").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProductoMaterialParaMaterial(m.ID);
        });
        document.getElementById("btnNuevoProveedor").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProveedorMaterialParaMaterial(m.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaMaterial(ID_REGISTRO);
    </script>
  </body>
</html>
