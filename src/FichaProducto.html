<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      .resumen-avance { display: flex; gap: 14px; flex-wrap: wrap; background: var(--color-fondo-suave); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
      .resumen-avance .dato { display: flex; flex-direction: column; }
      .resumen-avance .dato .valor { font-size: 16px; font-weight: bold; }
      .resumen-avance .dato .etiqueta { color: var(--color-texto-secundario); font-size: 11px; }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="nombreProducto"></h2>
        <div class="detalle" id="detalleProducto"></div>
        <div class="acciones">
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnVerGantt" class="boton btn-mini">Ver Gantt</button>
          <span id="avisoSinGantt" class="detalle-secundario" style="display:none;">Añade fechas de plan a un proceso para ver el Gantt</span>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
        </div>
      </div>

      <div class="resumen-avance" id="resumenAvance"></div>

      <section class="bloque">
        <h3>Proyectos vinculados <button id="btnNuevoProyecto" class="boton btn-mini">+ Proyecto</button></h3>
        <div class="lista" id="listaProyectos"></div>
      </section>
      <section class="bloque">
        <h3>Procesos <button id="btnNuevoProceso" class="boton btn-mini">+ Proceso</button></h3>
        <div class="lista" id="listaProcesos"></div>
      </section>
      <section class="bloque">
        <h3>Materiales <button id="btnNuevoMaterial" class="boton btn-mini">+ Material</button></h3>
        <div class="lista" id="listaMateriales"></div>
      </section>
      <section class="bloque">
        <h3>Documentos <button id="btnNuevoDocumento" class="boton btn-mini">+ Documento</button></h3>
        <div class="lista" id="listaDocumentos"></div>
      </section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("inactiv") !== -1 || texto.indexOf("no dispon") !== -1 || texto.indexOf("bloque") !== -1 || texto.indexOf("cancel") !== -1) return "badge-bloqueado";
        if (texto.indexOf("activ") !== -1) return "badge-completado";
        if (texto.indexOf("complet") !== -1 || texto.indexOf("aprob") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'PRODUCTO', ID_REGISTRO);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      function fechaCorta_(v) {
        return v ? new Date(v).toLocaleDateString() : '?';
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var p = datos.producto;
        document.getElementById("nombreProducto").innerHTML = escapeHtml(p.NOMBRE) + renderBadge_(p.ESTADO);
        document.getElementById("detalleProducto").textContent =
          p.ID + (p.CODIGO ? " · " + p.CODIGO : "") +
          (p.UNIDAD ? " · " + p.UNIDAD : "") +
          (p.CANTIDAD_PREVISTA ? " · " + p.CANTIDAD_PREVISTA + " previsto" : "") +
          (p.CANTIDAD_PRODUCIDA ? " · " + p.CANTIDAD_PRODUCIDA + " producido" : "") +
          (datos.responsableNombre ? " · " + datos.responsableNombre : "") +
          (p.PRIORIDAD ? " · Prioridad " + p.PRIORIDAD : "") +
          (p.FECHA_REQUERIDA ? " · requerido " + fechaCorta_(p.FECHA_REQUERIDA) : "");

        /*
         * Ver Gantt solo tiene sentido si hay al menos un proceso con
         * fechas de plan (ver conversacion) -- mismo criterio que usa
         * el propio Gantt para incluir una fila (obtenerFilasGanttDetalladas_).
         * Sin eso, el boton abre un dialogo entero para no mostrar nada.
         */
        var hayProcesoConPlan = datos.procesos.some(function (pr) { return pr.fechaInicioPlan && pr.fechaFinPlan; });
        document.getElementById("btnVerGantt").style.display = hayProcesoConPlan ? "" : "none";
        document.getElementById("avisoSinGantt").style.display = hayProcesoConPlan ? "none" : "";

        var r = datos.resumenAvance;
        document.getElementById("resumenAvance").innerHTML =
          '<div class="dato"><span class="valor">' + r.procesosTotal + '</span><span class="etiqueta">procesos</span></div>' +
          '<div class="dato"><span class="valor">' + r.procesosMedidos + '</span><span class="etiqueta">medidos (con fin real)</span></div>' +
          '<div class="dato"><span class="valor">' + (r.diasDesviacionMedia === null ? '—' : r.diasDesviacionMedia) + '</span><span class="etiqueta">desviación media (días)</span></div>' +
          '<div class="dato"><span class="valor">' + r.procesosEnRiesgo + '</span><span class="etiqueta">en riesgo (plazo vencido, sin terminar)</span></div>';

        document.getElementById("listaProyectos").innerHTML = datos.proyectos.length
          ? datos.proyectos.map(function (pp) {
              return filaHtml_(
                escapeHtml(pp.proyectoNombre) + (pp.campanaNombre ? ' <span class="detalle-secundario">— ' + escapeHtml(pp.campanaNombre) + '</span>' : '') +
                (pp.cantidadAsignada ? ' <span class="detalle-secundario">(' + escapeHtml(pp.cantidadAsignada) + ')</span>' : '') +
                renderBadge_(pp.estado),
                'PROYECTO', pp.proyectoId
              );
            }).join("")
          : '<div class="vacio-bloque">No está vinculado a ningún proyecto todavía.</div>';

        document.getElementById("listaProcesos").innerHTML = datos.procesos.length
          ? datos.procesos.map(function (pr) {
              var fechas = (pr.fechaInicioPlan || pr.fechaFinPlan)
                ? ' <span class="detalle-secundario">' + fechaCorta_(pr.fechaInicioPlan) + '–' + fechaCorta_(pr.fechaFinPlan) + '</span>'
                : '';
              var fase = pr.fase ? ' <span class="detalle-secundario">· ' + escapeHtml(pr.fase) + '</span>' : '';
              var responsable = pr.responsableNombre ? ' <span class="detalle-secundario">· ' + escapeHtml(pr.responsableNombre) + '</span>' : '';
              var tareas = ' <span class="detalle-secundario">(' + pr.tareasAbiertas + ' de ' + pr.tareasTotal + ' tareas abiertas)</span>';
              var riesgo = pr.diasRiesgo ? ' <span class="badge badge-bloqueado">' + pr.diasRiesgo + ' días de retraso</span>' : '';
              return filaHtml_(escapeHtml(pr.nombre) + fase + fechas + responsable + tareas + renderBadge_(pr.estado) + riesgo, 'PROCESO', pr.id);
            }).join("")
          : '<div class="vacio-bloque">Sin procesos dados de alta.</div>';

        document.getElementById("listaMateriales").innerHTML = datos.materiales.length
          ? datos.materiales.map(function (m) {
              return filaHtml_(
                escapeHtml(m.materialNombre) +
                (m.cantidadPrevista ? ' <span class="detalle-secundario">— ' + escapeHtml(m.cantidadPrevista) + (m.unidad ? ' ' + escapeHtml(m.unidad) : '') + '</span>' : '') +
                renderBadge_(m.estado),
                'PRODUCTO_MATERIAL', m.relacionId
              );
            }).join("")
          : '<div class="vacio-bloque">Sin materiales asociados.</div>';

        document.getElementById("listaDocumentos").innerHTML = datos.documentos.length
          ? datos.documentos.map(function (d) {
              return filaHtml_(escapeHtml(d.titulo) + (d.tipo ? ' <span class="detalle-secundario">— ' + escapeHtml(d.tipo) + '</span>' : '') + renderBadge_(d.estado), 'DOCUMENTO', d.id);
            }).join("")
          : '<div class="vacio-bloque">Sin documentos adjuntos.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("PRODUCTO", p.ID); });
        document.getElementById("btnVerGantt").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirGanttFiltradoProducto(p.ID);
        });
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaProductoCSV(p.ID);
        });
        document.getElementById("btnNuevoProceso").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProcesoParaProducto(p.ID);
        });
        document.getElementById("btnNuevoProyecto").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProyectoProductoParaProducto(p.ID);
        });
        document.getElementById("btnNuevoMaterial").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProductoMaterialParaProducto(p.ID);
        });
        document.getElementById("btnNuevoDocumento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDocumentoParaProducto(p.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaProducto(ID_REGISTRO);
    </script>
  </body>
</html>
