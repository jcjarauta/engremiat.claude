<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .cabecera select { flex: 1; font-size: 14px; padding: 8px; }
      .cabecera button { flex-shrink: 0; }
      .resumen-campana { color: var(--color-texto-secundario); font-size: 13px; margin-bottom: 12px; }
      details { margin-bottom: 8px; }
      details > div { margin-left: 18px; border-left: 2px solid var(--color-borde); padding-left: 12px; }
      summary { cursor: pointer; padding: 8px 4px; }
      summary::-webkit-details-marker { color: var(--color-texto-secundario); }
      .fila-superior { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .nombre-nodo { font-weight: bold; font-size: 14px; }
      .detalle-nodo { font-weight: normal; color: var(--color-texto-secundario); font-size: 13px; }
      /*
       * Botones en su propia fila, debajo del nombre (ver conversacion --
       * "los botones del panel...son muy pequeños, crean confusion"):
       * antes compartian la misma linea que nombre+badge+detalle, muy
       * apretado en el ancho fijo del sidebar (no ajustable por codigo,
       * showSidebar ignora setWidth). Separarlos en su propia fila deja
       * sitio para un padding mas comodo sin que nada se solape.
       */
      .fila-hoja { padding: 6px 4px 6px 20px; }
      .acciones-nodo { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
      .btn-mini { font-size: 13px; padding: 7px 12px; }
      .btn-anadir { font-size: 13px; padding: 8px 12px; margin: 6px 0 10px 18px; }
      .vacio-nivel { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; margin: 4px 0 10px 20px; }
      .badge { font-size: 13px; padding: 2px 10px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .alerta-desviacion { color: var(--color-peligro); font-weight: bold; }
      /*
       * Fase 1 (ver conversacion -- relaciones que cuelgan de Tarea/
       * Proyecto/etc, sin panel propio, embebidas en el nodo dueño):
       * una linea compacta por relacion, no una lista expandida --
       * mismo criterio de "no amontonar botones" que ya se aplico a
       * Editar/Ficha/+Hijo.
       */
      .sub-lista { font-size: 12px; color: var(--color-texto-secundario); margin: 3px 0 0 2px; }
      .sub-etiqueta { font-weight: 600; }
      .anadir-mini { color: var(--color-primario); cursor: pointer; margin-left: 4px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="cabecera">
      <select id="selectCampana"><option value="">-- elige una campaña --</option></select>
      <button id="btnNuevaCampana" class="btn-mini boton-primario" title="Nueva campaña">+</button>
      <button id="btnActualizar" class="btn-mini" title="Volver a cargar (por si has creado/editado algo)">🔄</button>
      <button id="btnExportar" class="btn-mini" title="Exportar CSV">⬇️</button>
      <button id="btnVerGantt" class="btn-mini" title="Ver Gantt de esta campaña">📊</button>
      <label style="display:flex;align-items:center;gap:4px;font-weight:normal;font-size:12px;">
        <input type="checkbox" id="incluirPruebas"> Piloto/auditoría
      </label>
    </div>
    <div id="resumenCampana" class="resumen-campana"></div>

    <div id="estadoCarga" class="vacio">Elige una campaña para ver su estructura.</div>
    <div id="arbol"></div>

    <script>
      var PRESELECCION_CAMPANA_ID = <?!= preseleccionCampanaId ?>;
      // Campaña actualmente cargada -- la necesitan las incidencias de
      // cualquier nivel (CAMPANA_ID es el primer eslabón de su cadena de
      // fk_dependiente). Se fija en renderArbol().
      var CAMPANA_ACTUAL_ID = "";

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function escapeAttr(texto) {
        return escapeHtml(texto).replace(/"/g, "&quot;");
      }
      function formatearFecha_(fecha) {
        if (!fecha) return "";
        var d = new Date(fecha);
        var dd = String(d.getDate()).padStart(2, "0");
        var mm = String(d.getMonth() + 1).padStart(2, "0");
        return dd + "/" + mm + "/" + d.getFullYear();
      }

      /*
       * Clasificacion de estado por palabras clave -- los estados
       * varian por entidad (Completado/Terminada/Confirmada,
       * Bloqueado/Cancelada/Rechazada...) asi que no hay un mapa 1:1,
       * pero las palabras clave se repiten en todo el sistema.
       */
      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("bloque") !== -1 || texto.indexOf("cancel") !== -1 || texto.indexOf("rechaz") !== -1) return "badge-bloqueado";
        if (texto.indexOf("complet") !== -1 || texto.indexOf("termin") !== -1 || texto.indexOf("confirm") !== -1 || texto.indexOf("aprob") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        return '<span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function renderDetalle_(nodo) {
        var partes = [];
        if (nodo.responsable) partes.push(escapeHtml(nodo.responsable));
        if (nodo.diasDesviacion !== null && nodo.diasDesviacion !== undefined && nodo.diasDesviacion > 0) {
          partes.push('<span class="alerta-desviacion">⚠ +' + nodo.diasDesviacion + 'd</span>');
        }
        if (nodo.sobreasignado) {
          partes.push('<span class="alerta-desviacion" title="El responsable tiene otro proceso/tarea con fechas solapadas en esta campaña">🔁 solapado</span>');
        }
        return partes.length ? ' <span class="detalle-nodo">— ' + partes.join(' · ') + '</span>' : '';
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
      }

      /*
       * Fase 1 (ver conversacion -- relaciones que cuelgan de un nodo:
       * Responsable/Recurso/Material/Ejecucion en Tarea, Decision en
       * Proyecto, Incidencia en cualquier nivel). Despacho literal por
       * switch, no dinamico -- mismo motivo que crearHijo mas abajo: el
       * generador de envoltorios solo detecta "google.script.run....
       * nombre(...)" como cadena completa en el fuente.
       */
      function pedirRelacionTarea_(tipo, tareaId) {
        switch (tipo) {
          case "RESPONSABLE":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaResponsableParaTarea(tareaId);
            return;
          case "RECURSO":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaRecursoParaTarea(tareaId);
            return;
          case "MATERIAL":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaMaterialParaTarea(tareaId);
            return;
          case "EJECUCION":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearEjecucionTareaParaTarea(tareaId);
            return;
        }
        mostrarError({ message: "Relación de tarea desconocida: " + tipo });
      }

      function pedirIncidencia_(nivel, campanaId, proyectoId, productoId, procesoId, tareaId) {
        switch (nivel) {
          case "CAMPANA":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaCampana(campanaId);
            return;
          case "PROYECTO":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaProyecto(campanaId, proyectoId);
            return;
          case "PRODUCTO":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaProducto(campanaId, proyectoId, productoId);
            return;
          case "PROCESO":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaProceso(campanaId, proyectoId, productoId, procesoId);
            return;
          case "TAREA":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaTarea(campanaId, proyectoId, productoId, procesoId, tareaId);
            return;
        }
        mostrarError({ message: "Nivel de incidencia desconocido: " + nivel });
      }

      function renderSubListaTarea_(icono, etiqueta, items, textoItem, tipo, tareaId, textoAnadir) {
        var texto = (items && items.length) ? items.map(textoItem).join(", ") : "ninguno";
        return '<div class="sub-lista"><span class="sub-etiqueta">' + icono + " " + etiqueta + ':</span> ' + texto +
          ' <span class="anadir-mini" onclick="pedirRelacionTarea_(\'' + tipo + "','" + escapeAttr(tareaId) + '\')">' + (textoAnadir || "+ añadir") + '</span></div>';
      }

      function renderDecisionesProyecto_(proyecto) {
        var decisiones = proyecto.decisiones || [];
        var texto = decisiones.length
          ? decisiones.map(function (d) { return escapeHtml(d.titulo) + " " + renderBadge_(d.estado); }).join(", ")
          : "ninguna";
        return '<div class="sub-lista"><span class="sub-etiqueta">🧭 Decisiones:</span> ' + texto +
          ' <span class="anadir-mini" onclick="pedirDecision_(\'' + escapeAttr(proyecto.id) + '\')">+ añadir</span></div>';
      }

      /*
       * Envoltorio JS propio (no la llamada literal directamente en el
       * HTML) -- ver conversacion: incrustar "google.script.run....
       * nombre(\\'" + variable + "\\')" dentro de la cadena que
       * construye el atributo onclick confunde al generador de
       * envoltorios: su rastreo de parentesis interpreta \' + ' como
       * cierre/apertura de una cadena vacia y pierde el cierre real del
       * parentesis de la llamada. Con la llamada dentro de una funcion
       * JS normal (mismo patron que editar()/verFichaProducto()) el
       * texto fuente es una sentencia limpia, sin ese escaneo problematico.
       */
      function pedirDecision_(proyectoId) {
        google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDecisionParaProyecto(proyectoId);
      }

      function renderIncidencias_(nodo, nivel, campanaId, proyectoId, productoId, procesoId, tareaId) {
        var incidencias = nodo.incidencias || [];
        var texto = incidencias.length
          ? incidencias.map(function (i) { return escapeHtml(i.titulo) + " " + renderBadge_(i.estado); }).join(", ")
          : "ninguna";
        var args = [nivel, campanaId, proyectoId, productoId, procesoId, tareaId].map(function (v) {
          return "'" + escapeAttr(v || "") + "'";
        }).join(",");
        return '<div class="sub-lista"><span class="sub-etiqueta">⚠️ Incidencias:</span> ' + texto +
          ' <span class="anadir-mini" onclick="pedirIncidencia_(' + args + ')">+ añadir</span></div>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion(entidad, id);
      }

      /* Ver la ficha de registro de un producto directamente desde el árbol (ver conversacion). */
      function verFichaProducto(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaProducto(id);
      }

      /* Idem para Proyecto (ver conversacion -- "Panel = navegación, Ficha = detalle"). */
      function verFichaProyecto(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaProyecto(id);
      }

      /* Idem para Campaña -- cierra la cobertura de Ficha en el nivel más alto. */
      function verFichaCampana(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaCampana(id);
      }

      /* Idem para Proceso y Tarea, completando la cobertura de Ficha en toda la jerarquía. */
      function verFichaProceso(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaProceso(id);
      }
      function verFichaTarea(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaTarea(id);
      }

      /*
       * Despacho literal, no dinamico (ver conversacion -- hallazgo en
       * TEST-Combo-CORE): google.script.run solo expone las funciones que
       * el generador de envoltorios detecta como llamada LITERAL
       * "google.script.run....nombre(...)" en el fuente. [funcion](idPadre)
       * es invisible a ese escaneo estatico, asi que el cliente se
       * quedaba sin envoltorio para esa funcion en cuanto solo se llamaba
       * asi (funcionaba aqui de rebote porque FormularioGenerico.html
       * tambien la llama de forma literal, pero no hay que depender de
       * eso).
       */
      function crearHijo(funcion, idPadre) {
        switch (funcion) {
          case "abrirFormularioCrearProyectoConCampana":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProyectoConCampana(idPadre);
            return;
          case "abrirFormularioCrearProductoConProyecto":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProductoConProyecto(idPadre);
            return;
          case "abrirFormularioCrearProcesoConProducto":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProcesoConProducto(idPadre);
            return;
          case "abrirFormularioCrearTareaConProceso":
            google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaConProceso(idPadre);
            return;
        }
        mostrarError({ message: "Función de creación desconocida: " + funcion });
      }

      function renderTarea(tarea) {
        var subListas =
          renderSubListaTarea_("👤", "Responsables", tarea.responsables, function (r) { return escapeHtml(r.nombre); }, "RESPONSABLE", tarea.id) +
          renderSubListaTarea_("🛠️", "Recursos", tarea.recursos, function (r) { return escapeHtml(r.nombre); }, "RECURSO", tarea.id) +
          renderSubListaTarea_("📦", "Materiales", tarea.materiales, function (m) { return escapeHtml(m.nombre); }, "MATERIAL", tarea.id) +
          renderSubListaTarea_("▶️", "Ejecución", tarea.ejecuciones, function (e) { return escapeHtml(e.responsableNombre || e.estado); }, "EJECUCION", tarea.id, "+ registrar") +
          renderIncidencias_(tarea, "TAREA", CAMPANA_ACTUAL_ID, tarea.proyectoId, tarea.productoId, tarea.procesoId, tarea.id);
        return '<div class="fila-hoja">' +
          '<div class="fila-superior"><span>' + escapeHtml(tarea.nombre) + ' ' + renderBadge_(tarea.estado) + renderDetalle_(tarea) + '</span></div>' +
          '<div class="acciones-nodo">' +
            '<button class="boton btn-mini" onclick="verFichaTarea(\'' + escapeAttr(tarea.id) + '\')">Ficha</button>' +
            '<button class="boton btn-mini" onclick="editar(\'TAREA\',\'' + escapeAttr(tarea.id) + '\')">Editar</button>' +
          '</div>' +
          subListas +
        '</div>';
      }

      function renderProceso(proceso) {
        var tareas = proceso.tareas.length
          ? proceso.tareas.map(renderTarea).join("")
          : '<div class="vacio-nivel">Sin tareas todavía.</div>';
        return '<details>' +
          '<summary>' +
            '<div class="fila-superior"><span class="nombre-nodo">' + escapeHtml(proceso.nombre) + ' ' + renderBadge_(proceso.estado) + renderDetalle_(proceso) + '</span></div>' +
            '<div class="acciones-nodo">' +
              '<button class="boton btn-mini" onclick="verFichaProceso(\'' + escapeAttr(proceso.id) + '\')">Ficha</button>' +
              '<button class="boton btn-mini" onclick="editar(\'PROCESO\',\'' + escapeAttr(proceso.id) + '\')">Editar</button>' +
              '<button class="boton btn-mini boton-primario" onclick="crearHijo(\'abrirFormularioCrearTareaConProceso\',\'' + escapeAttr(proceso.id) + '\')">+ Tarea</button>' +
            '</div>' +
            renderIncidencias_(proceso, "PROCESO", CAMPANA_ACTUAL_ID, proceso.proyectoId, proceso.productoId, proceso.id, "") +
          '</summary>' +
          '<div>' + tareas + '</div>' +
        '</details>';
      }

      function renderProducto(producto) {
        var procesos = producto.procesos.length
          ? producto.procesos.map(renderProceso).join("")
          : '<div class="vacio-nivel">Sin procesos todavía.</div>';
        return '<details open>' +
          '<summary>' +
            '<div class="fila-superior"><span class="nombre-nodo">' + escapeHtml(producto.nombre) + ' ' + renderBadge_(producto.estado) + renderDetalle_(producto) + '</span></div>' +
            '<div class="acciones-nodo">' +
              '<button class="boton btn-mini" onclick="verFichaProducto(\'' + escapeAttr(producto.id) + '\')">Ficha</button>' +
              '<button class="boton btn-mini" onclick="editar(\'PRODUCTO\',\'' + escapeAttr(producto.id) + '\')">Editar</button>' +
              '<button class="boton btn-mini boton-primario" onclick="crearHijo(\'abrirFormularioCrearProcesoConProducto\',\'' + escapeAttr(producto.id) + '\')">+ Proceso</button>' +
            '</div>' +
            renderIncidencias_(producto, "PRODUCTO", CAMPANA_ACTUAL_ID, producto.proyectoId, producto.id, "", "") +
          '</summary>' +
          '<div>' + procesos + '</div>' +
        '</details>';
      }

      function renderProyecto(proyecto) {
        var productos = proyecto.productos.length
          ? proyecto.productos.map(renderProducto).join("")
          : '<div class="vacio-nivel">Sin productos todavía.</div>';
        return '<details open>' +
          '<summary>' +
            '<div class="fila-superior"><span class="nombre-nodo">' + escapeHtml(proyecto.nombre) + ' ' + renderBadge_(proyecto.estado) + renderDetalle_(proyecto) + '</span></div>' +
            '<div class="acciones-nodo">' +
              '<button class="boton btn-mini" onclick="verFichaProyecto(\'' + escapeAttr(proyecto.id) + '\')">Ficha</button>' +
              '<button class="boton btn-mini" onclick="editar(\'PROYECTO\',\'' + escapeAttr(proyecto.id) + '\')">Editar</button>' +
              '<button class="boton btn-mini boton-primario" onclick="crearHijo(\'abrirFormularioCrearProductoConProyecto\',\'' + escapeAttr(proyecto.id) + '\')">+ Producto</button>' +
            '</div>' +
            renderDecisionesProyecto_(proyecto) +
            renderIncidencias_(proyecto, "PROYECTO", CAMPANA_ACTUAL_ID, proyecto.id, "", "", "") +
          '</summary>' +
          '<div>' + productos + '</div>' +
        '</details>';
      }

      function renderArbol(datos) {
        CAMPANA_ACTUAL_ID = datos.campana.id;
        document.getElementById("estadoCarga").style.display = "none";
        var contenedorProyectos = datos.proyectos.length
          ? datos.proyectos.map(renderProyecto).join("")
          : '<div class="vacio-nivel">Esta campaña todavía no tiene proyectos.</div>';

        document.getElementById("resumenCampana").textContent =
          formatearFecha_(datos.campana.fechaInicioPlan) + " – " + formatearFecha_(datos.campana.fechaFinPlan) +
          "  ·  " + datos.contadores.proyectos + " proyectos, " +
          datos.contadores.productos + " productos, " +
          datos.contadores.procesos + " procesos, " +
          datos.contadores.tareas + " tareas";

        document.getElementById("arbol").innerHTML =
          '<div class="fila-hoja" style="padding-left:2px;">' +
            '<div class="fila-superior"><span class="nombre-nodo">' + escapeHtml(datos.campana.nombre) + ' ' + renderBadge_(datos.campana.estado) + '</span></div>' +
            '<div class="acciones-nodo">' +
              '<button class="boton btn-mini" onclick="verFichaCampana(\'' + escapeAttr(datos.campana.id) + '\')">Ficha</button>' +
              '<button class="boton btn-mini" onclick="editar(\'CAMPANA\',\'' + escapeAttr(datos.campana.id) + '\')">Editar</button>' +
            '</div>' +
            renderIncidencias_(datos.campana, "CAMPANA", datos.campana.id, "", "", "", "") +
          '</div>' +
          contenedorProyectos +
          '<button class="boton btn-anadir boton-primario" onclick="crearHijo(\'abrirFormularioCrearProyectoConCampana\',\'' + escapeAttr(datos.campana.id) + '\')">+ Nuevo proyecto</button>';
      }

      function campanaSeleccionada_() {
        return document.getElementById("selectCampana").value;
      }

      function cargarArbol() {
        var campanaId = campanaSeleccionada_();
        google.script.run.withFailureHandler(function () {}).guardarUltimaCampanaPanel(campanaId);
        document.getElementById("resumenCampana").textContent = "";
        if (!campanaId) {
          document.getElementById("arbol").innerHTML = "";
          document.getElementById("estadoCarga").textContent = "Elige una campaña para ver su estructura.";
          document.getElementById("estadoCarga").style.display = "block";
          return;
        }
        document.getElementById("estadoCarga").textContent = "Cargando...";
        document.getElementById("estadoCarga").style.display = "block";
        google.script.run
          .withSuccessHandler(renderArbol)
          .withFailureHandler(mostrarError)
          .obtenerArbolCampana(campanaId);
      }

      function cargarOpcionesCampana(seleccionDeseada) {
        var seleccionAnterior = seleccionDeseada || campanaSeleccionada_();
        google.script.run
          .withSuccessHandler(function (opciones) {
            var select = document.getElementById("selectCampana");
            select.innerHTML = '<option value="">-- elige una campaña --</option>';
            opciones.forEach(function (campana) {
              select.innerHTML += '<option value="' + escapeAttr(campana.id) + '">' + escapeHtml(campana.etiqueta) + '</option>';
            });
            if (seleccionAnterior) select.value = seleccionAnterior;
            cargarArbol();
          })
          .withFailureHandler(mostrarError)
          .obtenerOpcionesCampanasActivas(document.getElementById("incluirPruebas").checked);
      }

      document.getElementById("selectCampana").addEventListener("change", cargarArbol);
      document.getElementById("btnActualizar").addEventListener("click", function () { cargarOpcionesCampana(); });

      /*
       * Auto-actualizar al volver el foco a este panel (ver conversacion --
       * "los botones del panel...", seguido de "deberia salir ya el
       * proyecto en uso precargado"): no existe forma de que el dialogo de
       * creacion (otra ventana/iframe) avise directamente a este sidebar
       * cuando se guarda algo -- son contextos separados sin canal de
       * mensajeria entre si en Apps Script. Lo mas simple y fiable es
       * refrescar el arbol cada vez que el usuario vuelve a hacer click
       * aqui (evento focus), que es justo el momento en que quiere ver el
       * resultado de lo que acaba de guardar en el dialogo.
       */
      window.addEventListener("focus", function () {
        if (campanaSeleccionada_()) cargarArbol();
      });
      document.getElementById("incluirPruebas").addEventListener("change", function () { cargarOpcionesCampana(); });
      document.getElementById("btnNuevaCampana").addEventListener("click", function () {
        google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearCampana();
      });
      document.getElementById("btnExportar").addEventListener("click", function () {
        var campanaId = campanaSeleccionada_();
        if (!campanaId) { mostrarError({ message: "Elige una campaña antes de exportar." }); return; }
        google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarArbolCampanaCSV(campanaId);
      });
      document.getElementById("btnVerGantt").addEventListener("click", function () {
        var campanaId = campanaSeleccionada_();
        if (!campanaId) { mostrarError({ message: "Elige una campaña antes de ver el Gantt." }); return; }
        google.script.run.withFailureHandler(mostrarError).abrirGanttParaCampana(campanaId);
      });

      /*
       * PRESELECCION_CAMPANA_ID (ver conversacion -- "al dar clic en abrir
       * panel se abre vacio"): cuando se llega aqui con una campaña
       * concreta ya elegida (p.ej. desde el enlace "Ver panel de
       * campaña" del dialogo de creacion), usarla DIRECTO -- no hacer el
       * round-trip async a obtenerUltimaCampanaPanel(), que ademas de
       * una llamada de mas era la causa real del panel abriendose vacio
       * de forma intermitente (una condicion de carrera entre el
       * guardado de "ultima campaña" hecho por abrirPanelCampanaEnCampana
       * justo antes de renderizar, y esta lectura async posterior desde
       * el cliente recien cargado). Sin preseleccion directa (abrir el
       * panel desde el menu, sin contexto), se mantiene el
       * comportamiento de siempre: recordar la ultima campaña elegida.
       */
      if (PRESELECCION_CAMPANA_ID) {
        cargarOpcionesCampana(PRESELECCION_CAMPANA_ID);
      } else {
        google.script.run
          .withSuccessHandler(function (ultimaCampanaId) { cargarOpcionesCampana(ultimaCampanaId); })
          .withFailureHandler(function () { cargarOpcionesCampana(); })
          .obtenerUltimaCampanaPanel();
      }
    </script>
  </body>
</html>
