<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .badge-aviso { background: #fff4e0; color: #a35a00; }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <?!= include('IndicadorCargaGlobal') ?>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="tituloConvocatoria"></h2>
        <div class="detalle" id="detalleConvocatoria"></div>
        <div class="acciones">
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
        </div>
      </div>

      <section class="bloque">
        <h3>Fuentes de financiación vinculadas <button id="btnNuevaFuente" class="boton btn-mini">+ Fuente de financiación</button></h3>
        <div class="lista" id="listaFuentes"></div>
      </section>
      <section class="bloque">
        <h3>Documentos vinculados <button id="btnNuevoDocumento" class="boton btn-mini">+ Documento</button></h3>
        <div class="lista" id="listaDocumentos"></div>
      </section>
      <section class="bloque">
        <h3>Proyectos que encajan</h3>
        <div class="lista" id="listaProyectos"></div>
      </section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("descartada") !== -1 || texto.indexOf("cerrada") !== -1) return "badge-bloqueado";
        if (texto.indexOf("resuelta") !== -1 || texto.indexOf("presentada") !== -1) return "badge-completado";
        if (texto.indexOf("abierta") !== -1) return "badge-neutro";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'CONVOCATORIA', ID_REGISTRO);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      function formatoEuros_(valor) {
        var numero = Number(valor) || 0;
        return numero.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var c = datos.convocatoria;
        document.getElementById("tituloConvocatoria").innerHTML = escapeHtml(c.NOMBRE) + renderBadge_(c.ESTADO);
        document.getElementById("detalleConvocatoria").textContent =
          c.ID + " · " + c.ENTIDAD_CONVOCANTE + (c.TIPO ? " · " + c.TIPO : "") +
          (c.IMPORTE_DISPONIBLE ? " · Disponible: " + formatoEuros_(c.IMPORTE_DISPONIBLE) : "") +
          (c.FECHA_LIMITE ? " · Fecha límite: " + new Date(c.FECHA_LIMITE).toLocaleDateString() : "");

        document.getElementById("listaFuentes").innerHTML = datos.fuentesVinculadas.length
          ? datos.fuentesVinculadas.map(function (f) {
              return filaHtml_(escapeHtml(f.nombre) + ' <span class="detalle-secundario">— ' + escapeHtml(f.entidadNombre) + ' · ' + formatoEuros_(f.importe) + '</span>' + renderBadge_(f.estado), 'FUENTE_FINANCIACION', f.id);
            }).join("")
          : '<div class="vacio-bloque">Sin fuentes de financiación vinculadas todavía.</div>';

        document.getElementById("listaDocumentos").innerHTML = datos.documentos.length
          ? datos.documentos.map(function (d) {
              return filaHtml_(escapeHtml(d.titulo) + (d.tipo ? ' <span class="detalle-secundario">— ' + escapeHtml(d.tipo) + '</span>' : '') + renderBadge_(d.estado), 'DOCUMENTO', d.id);
            }).join("")
          : '<div class="vacio-bloque">Sin documentos vinculados todavía.</div>';

        /*
         * Filtro de encaje determinista (ver conversacion -- Capa 1 de
         * convocatorias): por tipo de proyecto elegible + rango de
         * importe de solicitud, usando el coste ya calculado por
         * CosteService.js. Sin datos economicos suficientes, el
         * proyecto se incluye igualmente marcado en vez de excluirse en
         * silencio.
         */
        document.getElementById("listaProyectos").innerHTML = datos.proyectosQueEncajan.length
          ? datos.proyectosQueEncajan.map(function (p) {
              var aviso = p.datosEconomicosIncompletos ? ' <span class="badge badge-aviso">sin datos económicos</span>' : '';
              return filaHtml_(escapeHtml(p.proyectoNombre) + ' <span class="detalle-secundario">— ' + escapeHtml(p.tipoProyecto || '') + ' · ' + formatoEuros_(p.costeEstimado) + '</span>' + aviso, 'PROYECTO', p.proyectoId);
            }).join("")
          : '<div class="vacio-bloque">Ningún proyecto activo encaja con los criterios de esta convocatoria.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("CONVOCATORIA", c.ID); });
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaConvocatoriaCSV(c.ID);
        });
        document.getElementById("btnNuevoDocumento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDocumentoParaConvocatoria(c.ID);
        });
        document.getElementById("btnNuevaFuente").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearFuenteFinanciacionParaConvocatoria(c.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaConvocatoria(ID_REGISTRO);
    </script>
  </body>
</html>
