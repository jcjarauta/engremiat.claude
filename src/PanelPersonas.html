<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .cabecera button { flex-shrink: 0; }
      .resumen-arbol { color: var(--color-texto-secundario); font-size: 13px; margin-bottom: 12px; }
      details { margin-bottom: 6px; }
      details > div { margin-left: 18px; border-left: 2px solid var(--color-borde); padding-left: 12px; }
      summary { cursor: pointer; padding: 7px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      summary::-webkit-details-marker { color: var(--color-texto-secundario); }
      .nombre-nodo { font-weight: bold; font-size: 14px; }
      .detalle-nodo { font-weight: normal; color: var(--color-texto-secundario); font-size: 13px; }
      .fila-hoja { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px 6px 20px; }
      .acciones-nodo { display: flex; gap: 6px; flex-shrink: 0; }
      .btn-mini { font-size: 13px; padding: 6px 10px; }
      .badge { font-size: 13px; padding: 2px 10px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-nivel { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; margin: 4px 0 10px 20px; }
    </style>
  </head>
  <body>
    <div class="cabecera">
      <button id="btnNuevaPersona" class="btn-mini boton-primario" title="Nueva persona/equipo">+ Nueva persona</button>
      <button id="btnActualizar" class="btn-mini" title="Volver a cargar">🔄</button>
    </div>
    <div id="resumenArbol" class="resumen-arbol"></div>

    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="arbol"></div>

    <script>
      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function escapeAttr(texto) {
        return escapeHtml(texto).replace(/"/g, "&quot;");
      }

      /*
       * CFG_ESTADO_RECURSO (compartido por PERSONA_EQUIPO): Disponible/
       * Disponibilidad parcial/No disponible/Inactivo.
       */
      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("inactiv") !== -1 || texto.indexOf("no dispon") !== -1) return "badge-bloqueado";
        if (texto.indexOf("disponible") !== -1 && texto.indexOf("no ") === -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        return '<span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function renderDetalle_(nodo) {
        var partes = [];
        if (nodo.tipo) partes.push(escapeHtml(nodo.tipo));
        if (nodo.rol) partes.push(escapeHtml(nodo.rol));
        return partes.length ? ' <span class="detalle-nodo">— ' + partes.join(' · ') + '</span>' : '';
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
      }

      function editar(id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion("PERSONA_EQUIPO", id);
      }

      function verFicha(id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaPersonaEquipo(id);
      }

      function accionesNodo_(id) {
        return '<span class="acciones-nodo">' +
          '<button class="boton btn-mini" onclick="verFicha(\'' + escapeAttr(id) + '\')">Ficha</button>' +
          '<button class="boton btn-mini" onclick="editar(\'' + escapeAttr(id) + '\')">Editar</button>' +
        '</span>';
      }

      function renderNodo_(nodo) {
        if (nodo.hijos.length === 0) {
          return '<div class="fila-hoja">' +
            '<span>' + escapeHtml(nodo.nombre) + ' ' + renderBadge_(nodo.estado) + renderDetalle_(nodo) + '</span>' +
            accionesNodo_(nodo.id) +
          '</div>';
        }
        var hijosHtml = nodo.hijos.map(renderNodo_).join("");
        return '<details open>' +
          '<summary>' +
            '<span class="nombre-nodo">' + escapeHtml(nodo.nombre) + ' ' + renderBadge_(nodo.estado) + renderDetalle_(nodo) + '</span>' +
            accionesNodo_(nodo.id) +
          '</summary>' +
          '<div>' + hijosHtml + '</div>' +
        '</details>';
      }

      function renderArbol(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        if (!datos.raiz.length) {
          document.getElementById("arbol").innerHTML = '<div class="vacio-nivel">No hay ninguna persona/equipo sin coordinador todavía.</div>';
          document.getElementById("resumenArbol").textContent = "";
          return;
        }
        document.getElementById("resumenArbol").textContent = datos.total + " personas/equipos en total";
        document.getElementById("arbol").innerHTML = datos.raiz.map(renderNodo_).join("");
      }

      function cargarArbol() {
        document.getElementById("estadoCarga").textContent = "Cargando...";
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("arbol").innerHTML = "";
        google.script.run.withSuccessHandler(renderArbol).withFailureHandler(mostrarError).obtenerArbolPersonas();
      }

      document.getElementById("btnActualizar").addEventListener("click", cargarArbol);
      document.getElementById("btnNuevaPersona").addEventListener("click", function () {
        google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearPersonaEquipo();
      });

      cargarArbol();
    </script>
  </body>
</html>
