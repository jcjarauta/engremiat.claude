<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; margin: 8px; }
      h3 { margin-bottom: 4px; }
      .ok { color: #188038; font-weight: bold; }
      .problema { color: #c5221f; font-weight: bold; }
      table { border-collapse: collapse; width: 100%; margin-top: 6px; margin-bottom: 12px; }
      th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; font-size: 12px; }
      th { background: #f1f3f4; }
      .vacio { color: #888; font-style: italic; }
    </style>
  </head>
  <body>
    <h3>Integridad y mantenimiento</h3>
    <div id="estado-carga">Cargando datos... (puede tardar 15-30 segundos)</div>
    <div id="contenido" style="display:none;"></div>

    <script>
      function escaparHtml(texto) {
        var div = document.createElement("div");
        div.textContent = texto === null || texto === undefined ? "" : String(texto);
        return div.innerHTML;
      }

      function renderTablaDuplicados(idsDuplicados) {
        var entidades = Object.keys(idsDuplicados);
        if (entidades.length === 0) return "";
        var filas = "";
        entidades.forEach(function (entidad) {
          idsDuplicados[entidad].forEach(function (d) {
            filas += "<tr><td>" + escaparHtml(entidad) + "</td><td>" + escaparHtml(d.id) + "</td><td>" + escaparHtml(d.ocurrencias) + "</td></tr>";
          });
        });
        return "<h4>IDs duplicados</h4><table><tr><th>Entidad</th><th>ID</th><th>Ocurrencias</th></tr>" + filas + "</table>";
      }

      function renderTablaHuerfanas(referenciasHuerfanas) {
        var entidades = Object.keys(referenciasHuerfanas);
        if (entidades.length === 0) return "";
        var filas = "";
        entidades.forEach(function (entidad) {
          referenciasHuerfanas[entidad].forEach(function (h) {
            filas += "<tr><td>" + escaparHtml(entidad) + "</td><td>" + escaparHtml(h.registroId) + "</td><td>" + escaparHtml(h.campo) + "</td><td>" + escaparHtml(h.entidadDestino) + "</td><td>" + escaparHtml(h.valorReferenciado) + "</td></tr>";
          });
        });
        return "<h4>Referencias huerfanas</h4><table><tr><th>Entidad</th><th>Registro</th><th>Campo</th><th>Entidad destino</th><th>Valor</th></tr>" + filas + "</table>";
      }

      function renderTablaFuncional(titulo, claseFila, items) {
        if (!items || items.length === 0) return "";
        var filas = "";
        items.forEach(function (h) {
          filas += "<tr><td>" + escaparHtml(h.codigo) + "</td><td>" + escaparHtml(h.entidad) + "</td><td>" + escaparHtml(h.registroId) + "</td><td>" + escaparHtml(h.descripcion) + "</td><td>" + escaparHtml(h.accionSugerida) + "</td></tr>";
        });
        return "<h4 class=\"" + claseFila + "\">" + titulo + "</h4><table><tr><th>Codigo</th><th>Entidad</th><th>Registro</th><th>Descripcion</th><th>Accion sugerida</th></tr>" + filas + "</table>";
      }

      function mostrarErrorIntegridad(error) {
        var estadoCarga = document.getElementById("estado-carga");
        estadoCarga.className = "problema";
        estadoCarga.textContent = "Error al cargar el reporte de integridad: " + (error && error.message ? error.message : error);
      }

      google.script.run.withSuccessHandler(function (reporte) {
        document.getElementById("estado-carga").style.display = "none";
        var contenido = document.getElementById("contenido");
        contenido.style.display = "block";

        var funcional = reporte.funcional || { errores: [], advertencias: [], informacion: [] };
        var hayProblemas = Object.keys(reporte.idsDuplicados).length > 0 || Object.keys(reporte.referenciasHuerfanas).length > 0 || funcional.errores.length > 0 || funcional.advertencias.length > 0;
        var html = "";
        if (!hayProblemas) {
          html += "<div class=\"ok\">Sin problemas de integridad detectados.</div>";
        } else {
          html += "<div class=\"problema\">Se detectaron problemas de integridad.</div>";
          html += renderTablaDuplicados(reporte.idsDuplicados);
          html += renderTablaHuerfanas(reporte.referenciasHuerfanas);
          html += renderTablaFuncional("Errores funcionales", "problema", funcional.errores);
          html += renderTablaFuncional("Advertencias funcionales", "problema", funcional.advertencias);
          html += renderTablaFuncional("Informacion", "", funcional.informacion);
        }
        contenido.innerHTML = html;
      }).withFailureHandler(mostrarErrorIntegridad).obtenerReporteIntegridad();
    </script>
  </body>
</html>
