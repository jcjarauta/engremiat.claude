<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <style>
    #mensaje { color: var(--color-peligro); }
    #resultados { max-height: 220px; overflow-y: auto; border: 1px solid var(--color-borde); border-radius: 6px; margin-top: 4px; display: none; }
    #resultados.visible { display: block; }
    .resultado-fila { padding: 7px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--color-borde); }
    .resultado-fila:last-child { border-bottom: none; }
    .resultado-fila:hover, .resultado-fila.activa { background: var(--color-fondo-suave); }
    .resultado-vacio { padding: 7px 10px; font-size: 13px; color: var(--color-texto-secundario); font-style: italic; }
  </style>
</head>
<body>
  <h3><?= titulo ?></h3>
  <label for="buscador">Busca (ID, nombre, rol, tipo...):</label>
  <input type="text" id="buscador" autocomplete="off" placeholder="Escribe para buscar...">
  <label style="display:flex;align-items:center;gap:6px;font-weight:normal;margin-top:6px;font-size:13px;">
    <input type="checkbox" id="incluirPruebas"> Incluir campañas/proyectos de piloto y auditoría
  </label>
  <div id="resultados"></div>
  <input type="hidden" id="idSeleccionado" value="">
  <div id="mensaje"></div>
  <div class="acciones">
    <button id="btnCancelar" onclick="google.script.host.close()">Cancelar</button>
    <button id="btnAceptar" onclick="aceptar()" disabled>Aceptar</button>
  </div>
  <script>
    var ENTIDAD = <?!= JSON.stringify(entidad) ?>;
    var ACCION_FN = <?!= JSON.stringify(accionFn) ?>;
    var OPCIONES_FN = <?!= JSON.stringify(opcionesFn) ?>;
    var ABRE_OTRO_DIALOGO = <?!= JSON.stringify(!!abreOtroDialogo) ?>;
    var opciones = [];
    var elBuscador = document.getElementById("buscador");
    var elResultados = document.getElementById("resultados");
    var elIdSeleccionado = document.getElementById("idSeleccionado");
    var elBtnAceptar = document.getElementById("btnAceptar");

    function escapeHtml_(texto) {
      return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /*
     * google.script.run solo expone como propiedad las funciones que el
     * generador de envoltorios (generate-shell-wrappers.mjs) detecta de
     * forma estatica en el codigo fuente -- y ese generador busca llamadas
     * LITERALES tipo "google.script.run....nombreFuncion(...)", no
     * despachos dinamicos como el [OPCIONES_FN] que este fichero usaba
     * antes. Con despacho dinamico, el generador nunca veia el nombre real
     * y el cliente se quedaba sin envoltorio -- "no es una funcion" en
     * cuanto se intentaba usar (hallazgo en vivo sobre TEST-Combo-CORE:
     * varias funciones de obtenerOpciones/seleccionarY* faltaban del
     * Codigo.js de clientes ya desplegados). Este switch fuerza que cada
     * nombre real aparezca como llamada literal en el fuente, para que el
     * generador la detecte y genere el envoltorio.
     */
    function invocarOpciones_(nombreFuncion, entidad, incluirPruebas, onExito, onError) {
      // Cada case repite la cadena google.script.run....(...) COMPLETA (no
      // una variable reutilizada): el generador busca la cadena literal
      // entera en el fuente y no sigue una llamada hecha sobre una
      // variable intermedia, aunque esa variable venga de un literal.
      switch (nombreFuncion) {
        case "obtenerOpcionesEntidadParaSelector":
          google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).obtenerOpcionesEntidadParaSelector(entidad, incluirPruebas);
          return;
        case "obtenerOpcionesRecepcionPendiente":
          google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).obtenerOpcionesRecepcionPendiente(entidad, incluirPruebas);
          return;
        case "obtenerOpcionesCategoriaParaSelector":
          google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).obtenerOpcionesCategoriaParaSelector(entidad, incluirPruebas);
          return;
      }
      onError({ message: "Función de opciones desconocida: " + nombreFuncion });
    }

    function cargarOpciones() {
      invocarOpciones_(
        OPCIONES_FN,
        ENTIDAD,
        document.getElementById("incluirPruebas").checked,
        function (lista) {
          opciones = lista || [];
          filtrarYRenderizar_();
        },
        function (error) {
          document.getElementById("mensaje").textContent = (error && error.message) ? error.message : String(error);
        }
      );
    }

    document.getElementById("incluirPruebas").addEventListener("change", cargarOpciones);

    /*
     * Sustituye el <datalist> nativo (filtrado por prefijo, distinto
     * segun navegador) por una busqueda de subcadena en toda la
     * etiqueta -- ya incluye ID, nombre y (para Persona/Equipo) tipo/rol,
     * asi que "voluntari" o "manipulados" encuentran algo aunque no
     * empiece por ahi.
     */
    function filtrarYRenderizar_() {
      var texto = elBuscador.value.trim().toLowerCase();
      elIdSeleccionado.value = "";
      elBtnAceptar.disabled = true;
      document.getElementById("mensaje").textContent = "";

      if (!texto) {
        elResultados.classList.remove("visible");
        elResultados.innerHTML = "";
        return;
      }

      var coincidencias = opciones.filter(function (op) {
        return op.etiqueta.toLowerCase().indexOf(texto) !== -1;
      }).slice(0, 30);

      elResultados.classList.add("visible");
      elResultados.innerHTML = coincidencias.length
        ? coincidencias.map(function (op) {
            return '<div class="resultado-fila" data-id="' + escapeHtml_(op.id) + '" data-etiqueta="' + escapeHtml_(op.etiqueta) + '">' + escapeHtml_(op.etiqueta) + '</div>';
          }).join("")
        : '<div class="resultado-vacio">Sin coincidencias.</div>';
    }

    function seleccionar_(id, etiqueta) {
      elBuscador.value = etiqueta;
      elIdSeleccionado.value = id;
      elBtnAceptar.disabled = false;
      elResultados.classList.remove("visible");
      elResultados.innerHTML = "";
    }

    elBuscador.addEventListener("input", filtrarYRenderizar_);
    elResultados.addEventListener("click", function (evento) {
      var fila = evento.target.closest(".resultado-fila");
      if (!fila || !fila.dataset.id) return;
      seleccionar_(fila.dataset.id, fila.dataset.etiqueta);
    });

    /*
     * Mismo motivo que invocarOpciones_ mas arriba: despacho literal, cada
     * case con la cadena google.script.run....(...) completa en una sola
     * sentencia. Dos variantes (con/sin withSuccessHandler) porque
     * withSuccessHandler(null) no es seguro de pasar tal cual a la API real.
     */
    function invocarAccionSinExito_(nombreFuncion, entidad, id, onError) {
      switch (nombreFuncion) {
        case "seleccionarYAbrirEdicion": google.script.run.withFailureHandler(onError).seleccionarYAbrirEdicion(entidad, id); return;
        case "seleccionarYAbrirFicha": google.script.run.withFailureHandler(onError).seleccionarYAbrirFicha(entidad, id); return;
        case "seleccionarYAbrirFichaConvocatoria": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaConvocatoria(entidad, id); return;
        case "seleccionarYAbrirFichaIncidencia": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaIncidencia(entidad, id); return;
        case "seleccionarYAbrirFichaMaterial": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaMaterial(entidad, id); return;
        case "seleccionarYAbrirFichaProceso": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaProceso(entidad, id); return;
        case "seleccionarYAbrirFichaProducto": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaProducto(entidad, id); return;
        case "seleccionarYAbrirFichaProveedor": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaProveedor(entidad, id); return;
        case "seleccionarYAbrirFichaProyecto": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaProyecto(entidad, id); return;
        case "seleccionarYAbrirFichaTarea": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaTarea(entidad, id); return;
        case "seleccionarYAbrirFichaRecurso": google.script.run.withFailureHandler(onError).seleccionarYAbrirFichaRecurso(entidad, id); return;
        case "seleccionarYRecalcularAvance": google.script.run.withFailureHandler(onError).seleccionarYRecalcularAvance(entidad, id); return;
        case "seleccionarYConfirmarRecepcion": google.script.run.withFailureHandler(onError).seleccionarYConfirmarRecepcion(entidad, id); return;
        case "seleccionarYAbrirCatalogo": google.script.run.withFailureHandler(onError).seleccionarYAbrirCatalogo(entidad, id); return;
      }
      onError({ message: "Función de acción desconocida: " + nombreFuncion });
    }

    function invocarAccionConExito_(nombreFuncion, entidad, id, onExito, onError) {
      switch (nombreFuncion) {
        case "seleccionarYAbrirEdicion": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirEdicion(entidad, id); return;
        case "seleccionarYAbrirFicha": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFicha(entidad, id); return;
        case "seleccionarYAbrirFichaConvocatoria": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaConvocatoria(entidad, id); return;
        case "seleccionarYAbrirFichaIncidencia": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaIncidencia(entidad, id); return;
        case "seleccionarYAbrirFichaMaterial": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaMaterial(entidad, id); return;
        case "seleccionarYAbrirFichaProceso": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaProceso(entidad, id); return;
        case "seleccionarYAbrirFichaProducto": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaProducto(entidad, id); return;
        case "seleccionarYAbrirFichaProveedor": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaProveedor(entidad, id); return;
        case "seleccionarYAbrirFichaProyecto": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaProyecto(entidad, id); return;
        case "seleccionarYAbrirFichaTarea": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaTarea(entidad, id); return;
        case "seleccionarYAbrirFichaRecurso": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirFichaRecurso(entidad, id); return;
        case "seleccionarYRecalcularAvance": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYRecalcularAvance(entidad, id); return;
        case "seleccionarYConfirmarRecepcion": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYConfirmarRecepcion(entidad, id); return;
        case "seleccionarYAbrirCatalogo": google.script.run.withSuccessHandler(onExito).withFailureHandler(onError).seleccionarYAbrirCatalogo(entidad, id); return;
      }
      onError({ message: "Función de acción desconocida: " + nombreFuncion });
    }

    function aceptar() {
      var id = elIdSeleccionado.value;
      if (!id) return;
      elBtnAceptar.disabled = true;
      var onError = function (error) {
        document.getElementById("mensaje").textContent = (error && error.message) ? error.message : String(error);
        elBtnAceptar.disabled = false;
      };
      if (ABRE_OTRO_DIALOGO) {
        // accionFn termina abriendo otro modal (p.ej. seleccionarYAbrirFicha*,
        // seleccionarYAbrirEdicion). Lanzar la llamada ANTES de cerrar: si
        // se cierra primero, el canal de google.script.run se corta y la
        // peticion nunca llega al servidor (confirmado con un marcador de
        // diagnostico). Cerrar justo despues, sin esperar respuesta.
        invocarAccionSinExito_(ACCION_FN, ENTIDAD, id, onError);
        google.script.host.close();
      } else {
        // accionFn no abre nada mas y puede fallar con un error de negocio
        // (p.ej. confirmarRecepcion_) que hay que poder mostrar aqui mismo,
        // asi que este caso sigue cerrando solo tras el exito.
        invocarAccionConExito_(ACCION_FN, ENTIDAD, id, function () { google.script.host.close(); }, onError);
      }
    }

    cargarOpciones();
  </script>
</body>
</html>
