<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Ficha de proceso</title>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      .resumen-avance { display: flex; gap: 14px; flex-wrap: wrap; background: var(--color-fondo-suave); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
      .resumen-avance .dato { display: flex; flex-direction: column; }
      .resumen-avance .dato .valor { font-size: 16px; font-weight: bold; }
      .resumen-avance .dato .etiqueta { color: var(--color-texto-secundario); font-size: 11px; }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="nombreProceso"></h2>
        <div class="detalle" id="detalleProceso"></div>
        <div class="acciones">
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnVerFichaProducto" class="boton btn-mini">Ver ficha de producto</button>
          <button id="btnVerPanel" class="boton btn-mini" style="display:none;">Ver panel de campaña</button>
          <button id="btnVerGantt" class="boton btn-mini">Ver Gantt</button>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
        </div>
      </div>

      <div class="resumen-avance" id="resumenAvance"></div>

      <section class="bloque">
        <h3>Tareas <button id="btnNuevaTarea" class="boton btn-mini">+ Tarea</button></h3>
        <div class="lista" id="listaTareas"></div>
      </section>
      <section class="bloque">
        <h3>Incidencias <button id="btnNuevaIncidencia" class="boton btn-mini">+ Incidencia</button></h3>
        <div class="lista" id="listaIncidencias"></div>
      </section>
      <section class="bloque">
        <h3>Documentos <button id="btnNuevoDocumento" class="boton btn-mini">+ Documento</button></h3>
        <div class="lista" id="listaDocumentos"></div>
      </section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("inactiv") !== -1 || texto.indexOf("no dispon") !== -1 || texto.indexOf("bloque") !== -1 || texto.indexOf("cancel") !== -1 || texto.indexOf("rechaz") !== -1) return "badge-bloqueado";
        if (texto.indexOf("activ") !== -1) return "badge-completado";
        if (texto.indexOf("complet") !== -1 || texto.indexOf("aprob") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'PROCESO', ID_REGISTRO);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var p = datos.proceso;
        document.getElementById("nombreProceso").innerHTML = escapeHtml(p.NOMBRE) + renderBadge_(p.ESTADO);
        document.getElementById("detalleProceso").textContent =
          p.ID +
          (datos.productoNombre ? " · " + datos.productoNombre : "") +
          (datos.proyectoNombre ? " · " + datos.proyectoNombre : "") +
          (p.FASE_PRODUCCION ? " · " + p.FASE_PRODUCCION : "") +
          (datos.responsableNombre ? " · " + datos.responsableNombre : "");

        var r = datos.resumenAvance;
        document.getElementById("resumenAvance").innerHTML =
          '<div class="dato"><span class="valor">' + r.tareasTotal + '</span><span class="etiqueta">tareas</span></div>' +
          '<div class="dato"><span class="valor">' + r.tareasMedidas + '</span><span class="etiqueta">medidas (con fin real)</span></div>' +
          '<div class="dato"><span class="valor">' + (r.diasDesviacionMedia === null ? '—' : r.diasDesviacionMedia) + '</span><span class="etiqueta">desviación media (días)</span></div>' +
          '<div class="dato"><span class="valor">' + r.tareasEnRiesgo + '</span><span class="etiqueta">en riesgo (plazo vencido, sin terminar)</span></div>';

        document.getElementById("listaTareas").innerHTML = datos.tareas.length
          ? datos.tareas.map(function (t) {
              return filaHtml_(
                escapeHtml(t.nombre) +
                (t.responsableNombre ? ' <span class="detalle-secundario">— ' + escapeHtml(t.responsableNombre) + '</span>' : '') +
                renderBadge_(t.estado),
                'TAREA', t.id
              );
            }).join("")
          : '<div class="vacio-bloque">Sin tareas dadas de alta.</div>';

        document.getElementById("listaIncidencias").innerHTML = datos.incidencias.length
          ? datos.incidencias.map(function (i) {
              return filaHtml_(escapeHtml(i.titulo) + renderBadge_(i.estado), 'INCIDENCIA', i.id);
            }).join("")
          : '<div class="vacio-bloque">Sin incidencias a este nivel.</div>';

        document.getElementById("listaDocumentos").innerHTML = datos.documentos.length
          ? datos.documentos.map(function (d) {
              return filaHtml_(escapeHtml(d.titulo) + (d.tipo ? ' <span class="detalle-secundario">— ' + escapeHtml(d.tipo) + '</span>' : '') + renderBadge_(d.estado), 'DOCUMENTO', d.id);
            }).join("")
          : '<div class="vacio-bloque">Sin documentos adjuntos.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("PROCESO", p.ID); });
        document.getElementById("btnVerFichaProducto").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFichaProducto(datos.productoId);
        });
        if (datos.campanaId) {
          var btnPanel = document.getElementById("btnVerPanel");
          btnPanel.style.display = "";
          btnPanel.addEventListener("click", function () {
            google.script.run.withFailureHandler(mostrarError).abrirPanelCampanaEnCampana(datos.campanaId);
          });
        }
        document.getElementById("btnVerGantt").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirGanttFiltradoProducto(datos.productoId);
        });
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaProcesoCSV(p.ID);
        });
        document.getElementById("btnNuevaTarea").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaParaProceso(p.ID);
        });
        document.getElementById("btnNuevaIncidencia").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaProceso(datos.campanaId, datos.proyectoId, datos.productoId, p.ID);
        });
        document.getElementById("btnNuevoDocumento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDocumentoParaProceso(p.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaProceso(ID_REGISTRO);

      /* "Ver Gantt" solo tiene sentido con el módulo GANTT instalado -- ver FichaCampana.html. */
      google.script.run.withSuccessHandler(function (instalado) {
        if (!instalado) document.getElementById("btnVerGantt").style.display = "none";
      }).moduloGanttInstalado();
    </script>
  </body>
</html>
