<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
</head>
<body>
  <h3><?= titulo ?></h3>
  <div id="rutaYPanel" class="ayuda-campo campo-oculto" style="margin-bottom:10px;">
    <span id="ruta"></span>
    <span id="verPanel" class="campo-oculto" style="color:var(--color-primario);cursor:pointer;" onclick="abrirPanelDesdeAqui_()">📋 Ver panel de campaña</span>
  </div>
  <?!= include('ModalConfirmar') ?>
  <div id="campos">Cargando formulario...</div>
  <div id="mensaje"></div>
  <div id="dependenciasBloqueando" class="campo-oculto"></div>
  <div id="vinculosRelacionados" class="campo-oculto"></div>
  <div id="asignacionesRelacionadas" class="campo-oculto"></div>
  <div class="acciones">
    <button id="btnDesactivar" class="boton-peligro campo-oculto" onclick="desactivar()">Desactivar</button>
    <button id="btnCancelar" onclick="cancelar()">Cancelar</button>
    <button id="btnGuardar" onclick="guardar()" disabled>Guardar</button>
  </div>
  <script>
    var ENTIDAD = <?!= JSON.stringify(entidad) ?>;
    var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;
    var PREFILL = <?!= prefill ?>;
    var RETORNO = <?!= retorno ?>;
    var RUTA = <?!= ruta ?>;
    var CAMPANA_RAIZ = <?!= campanaRaiz ?>;
    var esquemaActual = [];

    /*
     * Migas de pan del recorrido guiado (ver conversacion -- "falta
     * tenerlo mas claro para el operador"): RUTA es la cadena de
     * antecesores ya creados en esta sesion de creacion encadenada
     * (Campaña->Proyecto->Producto->...), construida y pasada de un
     * dialogo al siguiente por invocarCadenaHijo_/abrirFormularioCrearHermano.
     * Vacia fuera de la cadena (crear suelto, editar, etc.) -- no se
     * muestra nada en ese caso.
     */
    if (RUTA && RUTA.length > 0) {
      document.getElementById("ruta").textContent = RUTA.map(function (paso) { return paso.etiqueta; }).join(" → ") + "  ·  ";
    }

    /*
     * "Ver panel de campaña" (ver conversacion -- "entrar en la ficha...
     * con opcion de volver atras, editar, ver resultados"): el Panel es
     * un sidebar (showSidebar), no un dialogo modal, asi que abrirlo NO
     * cierra este dialogo ni compite por el hueco de modal -- se puede
     * dejar abierto como mapa en vivo de toda la campaña (con Editar y
     * Ficha por nodo) mientras se sigue rellenando la cadena. Solo
     * disponible cuando venimos de la cadena de creacion (CAMPANA_RAIZ
     * conocido); fuera de ella (crear suelto, editar) no se muestra.
     */
    if (CAMPANA_RAIZ) {
      document.getElementById("verPanel").classList.remove("campo-oculto");
    }
    // Migas de pan + enlace comparten fila (ver conversacion -- ahorrar
    // altura vertical); la fila solo se muestra si hay algo que enseñar.
    if ((RUTA && RUTA.length > 0) || CAMPANA_RAIZ) {
      document.getElementById("rutaYPanel").classList.remove("campo-oculto");
    }
    function abrirPanelDesdeAqui_() {
      google.script.run.withFailureHandler(mostrarError).abrirPanelCampanaEnCampana(CAMPANA_RAIZ);
    }

    /*
     * google.script.run solo expone las funciones que el generador de
     * envoltorios (generate-shell-wrappers.mjs) detecta de forma estatica
     * en el codigo fuente -- busca llamadas LITERALES tipo
     * "google.script.run....nombreFuncion(...)", no despachos dinamicos
     * como [cadenaHijo.funcion]. Con despacho dinamico el generador nunca
     * veia el nombre real y el cliente se quedaba sin envoltorio para el
     * (hallazgo en vivo sobre TEST-Combo-CORE: "Sí, crear proyecto" no
     * abria nada porque abrirFormularioCrearProyectoConCampana no existia
     * en el Codigo.js del cliente). Este switch fuerza que cada nombre
     * real aparezca como llamada literal en el fuente.
     */
    function invocarCadenaHijo_(nombreFuncion, id, ruta, campanaRaiz) {
      // Cada case repite la cadena google.script.run....(id, ruta,
      // campanaRaiz) COMPLETA (no una variable reutilizada) porque el
      // generador de envoltorios busca la cadena literal entera
      // "google.script.run....nombre(...)" en el fuente -- si el nombre
      // final viene de una variable intermedia (aunque la variable se
      // construya a partir de un literal), no lo detecta.
      switch (nombreFuncion) {
        case "abrirFormularioCrearProyectoConCampana":
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProyectoConCampana(id, ruta, campanaRaiz);
          return;
        case "abrirFormularioCrearProductoConProyecto":
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProductoConProyecto(id, ruta, campanaRaiz);
          return;
        case "abrirFormularioCrearProcesoConProducto":
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearProcesoConProducto(id, ruta, campanaRaiz);
          return;
        case "abrirFormularioCrearTareaConProceso":
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaConProceso(id, ruta, campanaRaiz);
          return;
      }
      mostrarError({ message: "Función de cadena desconocida: " + nombreFuncion });
    }

    var CADENA_HIJO_MVP = {
      CAMPANA: {
        pregunta: "Campaña creada. ¿Quieres crear ya el primer proyecto?",
        funcion: "abrirFormularioCrearProyectoConCampana",
        textoBoton: "Sí, crear proyecto"
      },
      PROYECTO: {
        pregunta: "Proyecto creado. ¿Quieres crear ya el primer producto?",
        funcion: "abrirFormularioCrearProductoConProyecto",
        textoBoton: "Sí, crear producto"
      },
      PRODUCTO: {
        pregunta: "Producto creado. ¿Quieres crear ya el primer proceso?",
        funcion: "abrirFormularioCrearProcesoConProducto",
        textoBoton: "Sí, crear proceso"
      },
      PROCESO: {
        pregunta: "Proceso creado. ¿Quieres crear ya la primera tarea?",
        funcion: "abrirFormularioCrearTareaConProceso",
        textoBoton: "Sí, crear tarea"
      }
    };

    /*
     * Cadena "hermano" (ver conversación): crear otro registro del
     * mismo tipo para el mismo padre (otro proyecto en la misma
     * campaña, otro producto en el mismo proyecto...), para poder
     * construir varias piezas seguidas sin volver al menú a rebuscar
     * el padre. Se ofrece cuando se declina bajar al hijo (o cuando no
     * hay hijo posible, como en TAREA) -- nunca a la vez que el
     * prompt de hijo, para no encadenar dos confirmaciones de golpe.
     */
    var CADENA_HERMANO_MVP = {
      PROYECTO: { campoPadre: "CAMPANA_ID", pregunta: "¿Añadir otro proyecto a esta misma campaña?" },
      PRODUCTO: { campoPadre: "PROYECTO_VINCULAR_ID", pregunta: "¿Añadir otro producto a este mismo proyecto?" },
      PROCESO: { campoPadre: "PRODUCTO_ID", pregunta: "¿Añadir otro proceso a este mismo producto?" },
      TAREA: { campoPadre: "PROCESO_ID", pregunta: "¿Añadir otra tarea a este mismo proceso?" }
    };

    // Desactivar solo tiene sentido editando un registro que ya existe.
    document.getElementById("btnDesactivar").classList.toggle("campo-oculto", !ID_REGISTRO);

    /*
     * Deja explicito que "Cancelar" no cierra sin mas si hay retorno --
     * ver conversacion: sin esta pista, no habia forma de saber desde
     * el propio boton que cerrar aqui te devuelve a la ficha/formulario
     * de origen en vez de simplemente cerrar el dialogo.
     */
    if (RETORNO && RETORNO.entidad && RETORNO.id) {
      document.getElementById("btnCancelar").textContent =
        RETORNO.etiquetaDestino ? "Cancelar y volver a " + RETORNO.etiquetaDestino : "Cancelar y volver";
    }

    /*
     * Hallazgo "me quedo bloqueado": cerrar este formulario (cancelar,
     * guardar o desactivar) vuelve al formulario de origen si se llegó
     * aquí editando un dependiente bloqueante (ver abrirDependiente_),
     * en vez de dejar al usuario sin forma de retomar lo que estaba
     * haciendo.
     */
    function cerrarOVolver_() {
      if (RETORNO && RETORNO.entidad && RETORNO.id) {
        // Lanzar la llamada ANTES de cerrar -- ver nota junto a
        // ofrecerHermanoOFinal_ mas abajo: cerrar primero corta el canal
        // de google.script.run antes de que llegue a salir la peticion,
        // asi que el servidor nunca la recibe.
        google.script.run
          .withFailureHandler(mostrarError)
          .abrirRetorno(RETORNO);
        google.script.host.close();
        return;
      }
      google.script.host.close();
    }

    function abrirDependiente_(entidad, id) {
      google.script.run
        .withFailureHandler(mostrarError)
        .abrirDependienteConRetorno(entidad, id, ENTIDAD, ID_REGISTRO);
      google.script.host.close();
    }

    /*
     * Antes solo se sabia "PROYECTO (2)" via el mensaje de error de
     * desactivarRegistro; ahora se listan los registros concretos que
     * bloquean, con un enlace directo para editarlos (y desde ahi,
     * desactivarlos si procede) sin tener que ir a buscarlos a mano.
     * Sigue siendo deliberado nivel a nivel -- no hay cascada
     * automatica, cada bloqueante se revisa por separado.
     */
    function mostrarDependenciasBloqueando_(dependencias) {
      var contenedor = document.getElementById("dependenciasBloqueando");
      var html = "<p class=\"error\">No se puede desactivar: tiene dependientes activos.</p>";
      dependencias.forEach(function (dep) {
        html += "<p style=\"margin-bottom:4px;\"><strong>" + escaparAtributo_(dep.entidad) + "</strong> (" + dep.cantidad + ")</p>";
        html += "<ul style=\"margin:0 0 10px 0;padding-left:18px;\">";
        dep.registros.forEach(function (reg) {
          html += "<li style=\"margin-bottom:4px;\">" + escaparAtributo_(reg.etiqueta) +
            " <span class=\"boton\" style=\"padding:2px 8px;font-size:11px;\" onclick=\"abrirDependiente_('" +
            escaparAtributo_(dep.entidad) + "','" + escaparAtributo_(reg.id) + "')\">Editar</span></li>";
        });
        html += "</ul>";
      });
      contenedor.innerHTML = html;
      contenedor.classList.remove("campo-oculto");
    }

    function desactivar() {
      confirmarAccion_(
        "¿Seguro que quieres desactivar este registro? No se podrá deshacer desde aquí (haría falta reactivarlo a mano).",
        function () {
          document.getElementById("btnDesactivar").disabled = true;
          document.getElementById("dependenciasBloqueando").classList.add("campo-oculto");
          google.script.run
            .withSuccessHandler(function (dependencias) {
              if (dependencias && dependencias.length > 0) {
                mostrarDependenciasBloqueando_(dependencias);
                document.getElementById("btnDesactivar").disabled = false;
                return;
              }
              document.getElementById("btnGuardar").disabled = true;
              google.script.run
                .withSuccessHandler(function () { cerrarOVolver_(); })
                .withFailureHandler(function (error) {
                  mostrarError(error);
                  document.getElementById("btnDesactivar").disabled = false;
                  document.getElementById("btnGuardar").disabled = false;
                })
                .desactivarRegistro(ENTIDAD, ID_REGISTRO);
            })
            .withFailureHandler(function (error) {
              mostrarError(error);
              document.getElementById("btnDesactivar").disabled = false;
            })
            .obtenerDependenciasActivasDetalle(ENTIDAD, ID_REGISTRO);
        },
        null,
        "Desactivar"
      );
    }

    function escaparAtributo_(texto) {
      return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /*
     * Buscador de FK (Fase L3.5): en vez de un <select> con todas las
     * opciones, un <input> de texto con <datalist> nativo del navegador
     * (sin librerias externas) que filtra mientras se escribe, mas un
     * <input type="hidden"> que guarda el ID real. La etiqueta siempre
     * tiene el formato "ID - nombre", asi que el ID se puede extraer del
     * texto escrito sin necesidad de una llamada adicional al servidor.
     */
    function renderBuscadorFk_(id, opciones, esDependiente) {
      var datalistId = id + "_lista";
      var placeholder = esDependiente ? "-- seleccione primero --" : "Escribe para buscar...";
      var deshabilitado = esDependiente ? " disabled" : "";
      var html = "<input type=\"text\" id=\"" + id + "_texto\" list=\"" + datalistId + "\" autocomplete=\"off\" placeholder=\"" + placeholder + "\"" + deshabilitado + ">";
      html += "<datalist id=\"" + datalistId + "\">";
      (opciones || []).forEach(function (op) {
        html += "<option value=\"" + escaparAtributo_(op.etiqueta) + "\">";
      });
      html += "</datalist>";
      html += "<input type=\"hidden\" id=\"" + id + "\" value=\"\">";
      return html;
    }

    /*
     * Bloquea el input de texto de un buscador FK precargado por PREFILL
     * (ver conversacion -- campo padre de la cadena de creacion) y añade
     * un enlace "Cambiar" que lo desbloquea bajo demanda. disabled (no
     * readonly) porque el datalist nativo del navegador no reacciona a
     * readonly en algunos navegadores -- con disabled el valor sigue
     * viajando igual en el guardado porque el campo oculto real
     * (campo_X, sin "_texto") ya quedo relleno en cargarEsquema.
     */
    function bloquearCampoPrefilled_(elTexto) {
      elTexto.disabled = true;
      var enlace = document.createElement("span");
      enlace.textContent = "Cambiar";
      enlace.style.cssText = "margin-left:8px;font-size:11px;color:var(--color-primario);cursor:pointer;";
      enlace.onclick = function () {
        elTexto.disabled = false;
        elTexto.focus();
        enlace.remove();
      };
      elTexto.insertAdjacentElement("afterend", enlace);
    }

    function renderCampo(campo) {
      var id = "campo_" + campo.campo;
      var ocultoAlCrear = campo.ocultarAlCrear && !ID_REGISTRO;
      var claseOculto = (campo.visibleSi || ocultoAlCrear) ? " campo-oculto" : "";
      var html = "<div class=\"campo-contenedor" + claseOculto + "\" id=\"contenedor_" + id + "\" data-campo=\"" + campo.campo + "\">";
      html += "<label for=\"" + id + "\">" + campo.etiqueta + (campo.requerido ? " *" : "") + "</label>";
      if (campo.ayuda) {
        html += "<div class=\"ayuda-campo\">" + escaparAtributo_(campo.ayuda) + "</div>";
      }
      if (campo.tipo === "catalogo") {
        html += "<select id=\"" + id + "\"><option value=\"\">-- seleccionar --</option>";
        campo.opciones.forEach(function (op) {
          html += "<option value=\"" + escaparAtributo_(op) + "\">" + op + "</option>";
        });
        html += "</select>";
      } else if (campo.tipo === "fk") {
        html += renderBuscadorFk_(id, campo.opciones, false);
      } else if (campo.tipo === "fk_dependiente") {
        html += renderBuscadorFk_(id, [], true);
      } else if (campo.tipo === "fecha") {
        html += "<input type=\"date\" id=\"" + id + "\">";
      } else if (campo.tipo === "numero") {
        var atrMin = campo.min !== undefined ? " min=\"" + campo.min + "\"" : "";
        var atrMax = campo.max !== undefined ? " max=\"" + campo.max + "\"" : "";
        html += "<input type=\"number\" id=\"" + id + "\"" + atrMin + atrMax + ">";
      } else if (campo.tipo === "textarea") {
        html += "<textarea id=\"" + id + "\" rows=\"4\"></textarea>";
      } else {
        html += "<input type=\"text\" id=\"" + id + "\">";
      }
      html += "</div>";
      return html;
    }

    function mostrarError(error) {
      var el = document.getElementById("mensaje");
      el.className = "error";
      el.textContent = (error && error.message) ? error.message : String(error);
    }

    function escapeHtml_(texto) {
      if (texto === null || texto === undefined) return "";
      return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    /*
     * Vinculos relacionados (ver conversacion -- "relación incidencia-
     * decisión-tarea, cómo lo mejoramos"): bloque generico de solo
     * lectura, no especifico de Decision/Incidencia -- funciona para
     * cualquier entidad que aparezca en VINCULO (via
     * obtenerVinculosDeEntidad en Formularios.js), asi que tambien
     * sirve reciprocamente (editar una Decision muestra sus
     * incidencias vinculadas, sin codigo especifico por par). Solo se
     * pide en modo edicion (ID_REGISTRO presente) -- un registro nuevo
     * no puede tener vinculos todavia.
     */
    function claseBadgeVinculo_(estado) {
      var texto = String(estado || "").toLowerCase();
      if (texto.indexOf("cerrada") !== -1 || texto.indexOf("cancel") !== -1 || texto.indexOf("bloque") !== -1 || texto.indexOf("inactiv") !== -1) return "badge-bloqueado";
      if (texto.indexOf("resuelta") !== -1 || texto.indexOf("activ") !== -1) return "badge-completado";
      return "badge-neutro";
    }

    function cargarVinculosRelacionados_() {
      if (!ID_REGISTRO) return;
      google.script.run
        .withSuccessHandler(function (vinculos) {
          var el = document.getElementById("vinculosRelacionados");
          if (!vinculos || vinculos.length === 0) { el.className = "campo-oculto"; return; }
          el.className = "";
          el.innerHTML = "<h4>Vínculos relacionados</h4>" + vinculos.map(function (v) {
            var titulo = v.entidad
              ? "<span style=\"color:var(--color-primario);cursor:pointer;\" onclick=\"google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion('" + v.entidad + "','" + v.id + "')\">" + escapeHtml_(v.nombre) + "</span>"
              : escapeHtml_(v.nombre);
            return "<div class=\"resumen-linea\"><span>" + escapeHtml_(v.entidadEtiqueta) + ": " + titulo + "</span>" +
              (v.estado ? "<span class=\"badge " + claseBadgeVinculo_(v.estado) + "\">" + escapeHtml_(v.estado) + "</span>" : "") + "</div>";
          }).join("");
        })
        .withFailureHandler(function () {})
        .obtenerVinculosDeEntidad(ENTIDAD, ID_REGISTRO);
    }

    /*
     * Personas asignadas (ver F-053/F-060 en ROADMAP_BACKLOG_MEJORAS.md):
     * mismo patron generico que vinculosRelacionados, pero acotado a los
     * seis niveles que realmente usan ASIGNACION (CAMPANA/PROYECTO/
     * PRODUCTO/PROCESO/DECISION/INCIDENCIA) -- TAREA sigue gestionandose
     * por TAREA_RESPONSABLE, y el resto de entidades (DOCUMENTO, RECURSO,
     * PERSONA_EQUIPO...) no tienen sentido aqui, así que ni se pide el
     * enlace "+ Añadir asignación" para no sugerir una accion invalida.
     */
    var ENTIDADES_CON_ASIGNACION_ = ['CAMPANA', 'PROYECTO', 'PRODUCTO', 'PROCESO', 'DECISION', 'INCIDENCIA'];
    function cargarAsignacionesRelacionadas_() {
      if (!ID_REGISTRO || ENTIDADES_CON_ASIGNACION_.indexOf(ENTIDAD) === -1) return;
      google.script.run
        .withSuccessHandler(function (asignaciones) {
          var el = document.getElementById("asignacionesRelacionadas");
          var filas = (asignaciones || []).map(function (a) {
            return "<div class=\"resumen-linea\"><span>" + escapeHtml_(a.personaNombre) +
              (a.rolAsignado ? " (" + escapeHtml_(a.rolAsignado) + ")" : "") + "</span>" +
              (a.estado ? "<span class=\"badge " + claseBadgeVinculo_(a.estado) + "\">" + escapeHtml_(a.estado) + "</span>" : "") + "</div>";
          }).join("");
          el.className = "";
          el.innerHTML = "<h4>Personas asignadas</h4>" + filas +
            "<div class=\"resumen-linea\"><span style=\"color:var(--color-primario);cursor:pointer;\" onclick=\"google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearAsignacionParaEntidad('" + ENTIDAD + "','" + ID_REGISTRO + "')\">+ Añadir asignación</span></div>";
        })
        .withFailureHandler(function () {})
        .obtenerAsignacionesDeEntidad(ENTIDAD, ID_REGISTRO);
    }
    function esTransicionEquipoAPersona_(valorAnterior, valorNuevo) {
      return valorAnterior === "Equipo" && valorNuevo === "Persona";
    }

    function comprobarContratoTransicionEquipoPersona_() {
      return (
        esTransicionEquipoAPersona_("Equipo", "Persona") &&
        !esTransicionEquipoAPersona_(undefined, "Persona") &&
        !esTransicionEquipoAPersona_("Equipo", "") &&
        !esTransicionEquipoAPersona_("Persona", "Equipo") &&
        !esTransicionEquipoAPersona_("Persona", "Persona")
      );
    }

    function aplicarVisibilidad_(campo) {
      if (!campo.visibleSi) return;
      var elControl = document.getElementById("campo_" + campo.visibleSi.campo);
      var contenedor = document.getElementById("contenedor_campo_" + campo.campo);
      if (!elControl || !contenedor) return;
      // Se registra después de cargar valorActual; una renderización no es una transición.
      var valorAnterior = elControl.value;
      var actualizar = function (evento) {
        var valorNuevo = elControl.value;
        var visible = campo.visibleSi.valores.indexOf(valorNuevo) !== -1;
        contenedor.classList.toggle("campo-oculto", !visible);
        if (
          evento &&
          campo.limpiarAlOcultar &&
          esTransicionEquipoAPersona_(valorAnterior, valorNuevo)
        ) {
          var elCampo = document.getElementById("campo_" + campo.campo);
          var elTexto = document.getElementById("campo_" + campo.campo + "_texto");
          if (elCampo) elCampo.value = "";
          if (elTexto) elTexto.value = "";
          if (elCampo) elCampo.dispatchEvent(new Event("change"));
        }
        valorAnterior = valorNuevo;
      };
      elControl.addEventListener("change", actualizar);
      actualizar();
    }

    function activarVisibilidadCondicional_() {
      esquemaActual.forEach(function (campo) {
        if (campo.visibleSi) aplicarVisibilidad_(campo);
      });
    }

    function extraerIdDeEtiqueta_(texto) {
      if (!texto) return "";
      var idx = texto.indexOf(" - ");
      return idx === -1 ? texto : texto.substring(0, idx);
    }

    /*
     * Sincroniza el input oculto (ID real) cuando el usuario escribe o
     * elige una opcion del datalist en el buscador de FK, y dispara un
     * evento "change" sobre el oculto para que activarDependenciasFk_ y
     * aplicarVisibilidad_ (que escuchan sobre "campo_" + nombre) sigan
     * funcionando sin cambios.
     */
    function activarBuscadoresFk_() {
      esquemaActual.forEach(function (campo) {
        if (campo.tipo !== "fk" && campo.tipo !== "fk_dependiente") return;
        var elTexto = document.getElementById("campo_" + campo.campo + "_texto");
        var elOculto = document.getElementById("campo_" + campo.campo);
        if (!elTexto || !elOculto) return;
        elTexto.addEventListener("input", function () {
          var id = extraerIdDeEtiqueta_(elTexto.value);
          if (elOculto.value !== id) {
            elOculto.value = id;
            elOculto.dispatchEvent(new Event("change"));
          }
        });
      });
    }

    function repoblarDependiente_(campo, valorPadre) {
      var elTexto = document.getElementById("campo_" + campo.campo + "_texto");
      var elOculto = document.getElementById("campo_" + campo.campo);
      var datalist = document.getElementById("campo_" + campo.campo + "_lista");
      if (!elTexto || !elOculto || !datalist) return;
      elTexto.disabled = true;
      elTexto.value = "";
      elOculto.value = "";
      datalist.innerHTML = "";
      if (!valorPadre) {
        elTexto.placeholder = "-- seleccione primero " + campo.dependeDe + " --";
        return;
      }
      elTexto.placeholder = "Cargando...";
      google.script.run
        .withSuccessHandler(function (opciones) {
          datalist.innerHTML = "";
          opciones.forEach(function (op) {
            datalist.innerHTML += "<option value=\"" + escaparAtributo_(op.etiqueta) + "\">";
          });
          elTexto.placeholder = "Escribe para buscar...";
          elTexto.disabled = false;
          if (campo.valorActual !== undefined && campo.valorActual !== null && campo.valorActual !== "") {
            var coincidente = opciones.filter(function (op) {
              return String(op.id) === String(campo.valorActual);
            })[0];
            if (coincidente) {
              elTexto.value = coincidente.etiqueta;
              elOculto.value = coincidente.id;
            }
            campo.valorActual = undefined;
          }
          if (elOculto.value) {
            elOculto.dispatchEvent(new Event("change"));
          }
        })
        .withFailureHandler(mostrarError)
        .obtenerOpcionesDependientes(campo.mapaEntidad, valorPadre);
    }

    function activarDependenciasFk_() {
      esquemaActual.forEach(function (campo) {
        if (campo.tipo !== "fk_dependiente") return;
        var elPadre = document.getElementById("campo_" + campo.dependeDe);
        if (!elPadre) return;
        elPadre.addEventListener("change", function () {
          repoblarDependiente_(campo, elPadre.value);
        });
      });
    }

    /*
     * Fase L4: sugiere ORDEN_SECUENCIA y predecesor al crear un PROCESO
     * o TAREA nuevos, cuando el usuario elige el campo de contexto
     * (producto/proyecto-producto o proceso). Nunca pisa un valor que
     * el usuario ya haya escrito.
     */
    function activarSugerenciasSecuencia_() {
      esquemaActual.forEach(function (campo) {
        if (!campo.sugerenciaSecuencia) return;
        var elOrden = document.getElementById("campo_" + campo.campo);
        var camposContexto = campo.sugerenciaSecuencia.camposContexto;
        var campoPredecesor = campo.sugerenciaSecuencia.campoPredecesor;
        if (!elOrden) return;

        var actualizar = function () {
          if (elOrden.value) return;
          var contexto = {};
          var hayContexto = false;
          camposContexto.forEach(function (nombreCampo) {
            var el = document.getElementById("campo_" + nombreCampo);
            contexto[nombreCampo] = el ? el.value : "";
            if (contexto[nombreCampo]) hayContexto = true;
          });
          if (!hayContexto) return;

          google.script.run
            .withSuccessHandler(function (sugerencia) {
              if (!sugerencia || sugerencia.ordenSugerido === null || sugerencia.ordenSugerido === undefined) return;
              if (!elOrden.value) elOrden.value = sugerencia.ordenSugerido;
              if (campoPredecesor && sugerencia.predecesorId) {
                var elPredOculto = document.getElementById("campo_" + campoPredecesor);
                var elPredTexto = document.getElementById("campo_" + campoPredecesor + "_texto");
                if (elPredOculto && !elPredOculto.value) {
                  elPredOculto.value = sugerencia.predecesorId;
                  if (elPredTexto) elPredTexto.value = sugerencia.predecesorEtiqueta;
                }
              }
            })
            .withFailureHandler(function () { /* sugerencia opcional: fallo silencioso */ })
            .obtenerSugerenciaSecuencia(ENTIDAD, contexto);
        };

        camposContexto.forEach(function (nombreCampo) {
          var el = document.getElementById("campo_" + nombreCampo);
          if (el) el.addEventListener("change", actualizar);
        });
      });
    }

    /*
     * Hallazgo #16 (auditoria piloto): al elegir la Relacion proyecto-
     * producto en Nuevo proceso, deriva el Producto automaticamente
     * (solo si el campo Producto aun esta vacio) para evitar elegir una
     * combinacion inconsistente entre ambos campos.
     */
    function activarDerivacionDeRelacion_() {
      esquemaActual.forEach(function (campo) {
        if (!campo.derivarDeRelacion) return;
        var elDestinoOculto = document.getElementById("campo_" + campo.campo);
        var elDestinoTexto = document.getElementById("campo_" + campo.campo + "_texto");
        var elOrigen = document.getElementById("campo_" + campo.derivarDeRelacion);
        if (!elDestinoOculto || !elOrigen) return;

        elOrigen.addEventListener("change", function () {
          if (elDestinoOculto.value) return;
          var valorOrigen = elOrigen.value;
          if (!valorOrigen) return;

          google.script.run
            .withSuccessHandler(function (resultado) {
              if (!resultado || elDestinoOculto.value) return;
              elDestinoOculto.value = resultado.id;
              if (elDestinoTexto) elDestinoTexto.value = resultado.etiqueta;
            })
            .withFailureHandler(function () { /* derivacion opcional: fallo silencioso */ })
            .obtenerProductoDesdeProyectoProducto(valorOrigen);
        });
      });
    }

    /*
     * Hallazgo #21 (auditoria piloto): "Otro" en cualquier desplegable
     * de catalogo era una etiqueta muerta. Al elegirlo, revela una caja
     * de texto; al salir de ella con algo escrito, lo normaliza y lo
     * da de alta en el catalogo real (agregarValorCatalogoSiNuevo,
     * GestionCatalogos.js -- reutiliza el valor existente si ya hay
     * algo muy parecido), y deja el <select> con esa opcion elegida.
     */
    function activarAltaRapidaCatalogo_() {
      esquemaActual.forEach(function (campo) {
        if (campo.tipo !== "catalogo" || !campo.catalogo) return;

        var valorOtro = (campo.opciones || []).filter(function (op) {
          return op === "Otro" || op === "Otra";
        })[0];

        if (!valorOtro) return;

        var select = document.getElementById("campo_" + campo.campo);
        if (!select) return;

        var inputNuevo = document.createElement("input");
        inputNuevo.type = "text";
        inputNuevo.placeholder = "Escribe el valor nuevo y sal del campo";
        inputNuevo.style.display = "none";
        select.parentNode.insertBefore(inputNuevo, select.nextSibling);

        select.addEventListener("change", function () {
          if (select.value === valorOtro) {
            inputNuevo.style.display = "block";
            inputNuevo.focus();
          } else {
            inputNuevo.style.display = "none";
          }
        });

        inputNuevo.addEventListener("blur", function () {
          var texto = inputNuevo.value.trim();
          if (!texto) return;
          inputNuevo.disabled = true;

          google.script.run
            .withSuccessHandler(function (resultado) {
              inputNuevo.disabled = false;
              if (!resultado) return;

              var yaExiste = Array.prototype.some.call(select.options, function (op) {
                return op.value === resultado.valor;
              });

              if (!yaExiste) {
                var nuevaOpcion = document.createElement("option");
                nuevaOpcion.value = resultado.valor;
                nuevaOpcion.textContent = resultado.valor;
                select.insertBefore(nuevaOpcion, select.options[select.options.length - 1]);
              }

              select.value = resultado.valor;
              inputNuevo.style.display = "none";
              inputNuevo.value = "";
            })
            .withFailureHandler(function (error) {
              inputNuevo.disabled = false;
              mostrarError(error);
            })
            .agregarValorCatalogoSiNuevo(campo.catalogo, texto);
        });
      });
    }

    /*
     * Ampliacion tras F-015: sugiere el CODIGO de PRODUCTO/MATERIAL/
     * PROVEEDOR a partir de siglas de campos ya elegidos (ver
     * GeneracionCodigo.js), cuando cambian esos campos de contexto.
     * Mismo patron que activarSugerenciasSecuencia_: nunca pisa un
     * CODIGO que el usuario ya haya escrito.
     */
    function activarSugerenciasCodigo_() {
      esquemaActual.forEach(function (campo) {
        if (!campo.sugerenciaCodigo) return;
        var elCodigo = document.getElementById("campo_" + campo.campo);
        var camposContexto = campo.sugerenciaCodigo.camposContexto;
        if (!elCodigo) return;

        var actualizar = function () {
          if (elCodigo.value) return;
          var contexto = {};
          var hayContexto = false;
          camposContexto.forEach(function (nombreCampo) {
            var el = document.getElementById("campo_" + nombreCampo);
            contexto[nombreCampo] = el ? el.value : "";
            if (contexto[nombreCampo]) hayContexto = true;
          });
          if (!hayContexto) return;

          google.script.run
            .withSuccessHandler(function (sugerencia) {
              if (!sugerencia || !sugerencia.codigoSugerido) return;
              if (!elCodigo.value) elCodigo.value = sugerencia.codigoSugerido;
            })
            .withFailureHandler(function () { /* sugerencia opcional: fallo silencioso */ })
            .obtenerSugerenciaCodigo(ENTIDAD, contexto);
        };

        camposContexto.forEach(function (nombreCampo) {
          var el = document.getElementById("campo_" + nombreCampo);
          if (el) el.addEventListener("change", actualizar);
        });
      });
    }

    /*
     * Sugerencia de VERSION para PRODUCTO (ver conversacion -- "esto
     * deberia ser dinamico para evitar errores humanos": la guia de
     * datos de ejemplo sugeria escribir "v1" a mano siempre, lo que en
     * la practica dejaba revisiones reales de un mismo producto todas
     * marcadas "v1"). Mismo patron que activarSugerenciasCodigo_: solo
     * precarga si el campo esta vacio, nunca pisa lo ya escrito.
     */
    function activarSugerenciasVersion_() {
      esquemaActual.forEach(function (campo) {
        if (!campo.sugerenciaVersion) return;
        var elVersion = document.getElementById("campo_" + campo.campo);
        var camposContexto = campo.sugerenciaVersion.camposContexto;
        if (!elVersion) return;

        var actualizar = function () {
          if (elVersion.value) return;
          var contexto = {};
          var hayContexto = false;
          camposContexto.forEach(function (nombreCampo) {
            var el = document.getElementById("campo_" + nombreCampo);
            contexto[nombreCampo] = el ? el.value : "";
            if (contexto[nombreCampo]) hayContexto = true;
          });
          if (!hayContexto) return;

          google.script.run
            .withSuccessHandler(function (sugerencia) {
              if (!sugerencia || !sugerencia.versionSugerida) return;
              if (!elVersion.value) elVersion.value = sugerencia.versionSugerida;
            })
            .withFailureHandler(function () { /* sugerencia opcional: fallo silencioso */ })
            .obtenerSugerenciaVersion(ENTIDAD, contexto);
        };

        camposContexto.forEach(function (nombreCampo) {
          var el = document.getElementById("campo_" + nombreCampo);
          if (el) el.addEventListener("change", actualizar);
        });
      });
    }

    /*
     * Hallazgo #5 (repaso de UX): los catalogos siempre empezaban en
     * "-- seleccionar --" aunque hubiera un valor inicial obvio (ej.
     * Estado=Borrador). Se preselecciona (solo al crear, nunca al
     * editar, y solo si el campo no trae ya un valorActual) pero sigue
     * siendo editable como cualquier otro valor.
     */
    function aplicarValoresPorDefecto_() {
      if (ID_REGISTRO) return;
      esquemaActual.forEach(function (campo) {
        if (campo.tipo !== "catalogo" || !campo.valorPorDefecto) return;
        if (campo.valorActual !== undefined && campo.valorActual !== null && campo.valorActual !== "") return;
        var el = document.getElementById("campo_" + campo.campo);
        if (el && !el.value) el.value = campo.valorPorDefecto;
      });
    }

    /*
     * Hallazgo #2 (repaso de UX): antes, si dejabas varios campos
     * obligatorios vacios, el servidor solo avisaba de uno cada vez.
     * Ahora se valida en el cliente antes de enviar, marcando TODOS los
     * campos obligatorios visibles que falten de una vez.
     */
    function campoVisible_(campo) {
      var contenedor = document.getElementById("contenedor_campo_" + campo.campo);
      return !contenedor || !contenedor.classList.contains("campo-oculto");
    }

    function valorCampo_(campo) {
      var el = document.getElementById("campo_" + campo.campo);
      return el ? el.value : "";
    }

    function revisarCampoObligatorio_(campo) {
      var contenedor = document.getElementById("contenedor_campo_" + campo.campo);
      if (!contenedor) return true;
      var vacio = campoVisible_(campo) && !valorCampo_(campo);
      contenedor.classList.toggle("campo-invalido", vacio);
      return !vacio;
    }

    function activarValidacionEnVivo_() {
      esquemaActual.forEach(function (campo) {
        if (!campo.requerido) return;
        var el = document.getElementById("campo_" + campo.campo);
        if (!el) return;
        var revisar = function () { revisarCampoObligatorio_(campo); };
        el.addEventListener("input", revisar);
        el.addEventListener("change", revisar);
      });
    }

    function validarObligatoriosAntesDeGuardar_() {
      var faltantes = [];
      esquemaActual.forEach(function (campo) {
        if (!campo.requerido) return;
        if (!revisarCampoObligatorio_(campo)) faltantes.push(campo.etiqueta);
      });
      return faltantes;
    }

    /*
     * Hallazgo #3 (repaso de UX): cerrar el dialogo sin guardar perdia
     * los datos escritos sin avisar. Se marca "sucio" en cuanto cambia
     * algo dentro de #campos, y se limpia justo antes de un guardado
     * con exito (para no interceptar nuestro propio cierre programado).
     */
    var formularioSucio_ = false;

    /*
     * onbeforeunload queda como red de seguridad adicional, pero el
     * boton X nativo del dialogo de Apps Script lo dibuja Sheets fuera
     * de esta pagina y no siempre dispara un evento de navegador real
     * -- por eso el mecanismo fiable es este boton "Cancelar" propio,
     * con confirm() nativo (eso si es un dialogo que controlamos).
     */
    window.onbeforeunload = function (evento) {
      if (!formularioSucio_) return;
      evento.preventDefault();
      evento.returnValue = "Tienes cambios sin guardar. ¿Seguro que quieres cerrar?";
      return evento.returnValue;
    };

    function cancelar() {
      if (!formularioSucio_) {
        cerrarOVolver_();
        return;
      }
      confirmarAccion_(
        "Tienes cambios sin guardar. ¿Seguro que quieres cerrar?",
        function () { cerrarOVolver_(); },
        null,
        "Cerrar sin guardar"
      );
    }

    function cargarEsquema() {
      google.script.run
        .withSuccessHandler(function (esquema) {
          esquemaActual = esquema;
          /*
           * Encadenado Campaña->Proyecto (y futuros): valores iniciales
           * pasados por el servidor para modo creación, sin pisar nada
           * (PREFILL solo aplica cuando el campo no trae ya un
           * valorActual, que en creación normal nunca lo trae).
           */
          esquemaActual.forEach(function (campo) {
            if (PREFILL[campo.campo] !== undefined && (campo.valorActual === undefined || campo.valorActual === null || campo.valorActual === "")) {
              campo.valorActual = PREFILL[campo.campo];
              campo.prefilled = true;
            }
          });
          document.getElementById("campos").innerHTML = esquema.map(renderCampo).join("");
          esquema.forEach(function (campo) {
            if (campo.valorActual === undefined || campo.valorActual === null) return;
            if (campo.tipo === "fk") {
              var elOculto = document.getElementById("campo_" + campo.campo);
              var elTexto = document.getElementById("campo_" + campo.campo + "_texto");
              if (elOculto) elOculto.value = campo.valorActual;
              if (elTexto) {
                var coincidente = (campo.opciones || []).filter(function (op) {
                  return String(op.id) === String(campo.valorActual);
                })[0];
                elTexto.value = coincidente ? coincidente.etiqueta : campo.valorActual;
                /*
                 * Bloquear el campo padre precargado desde la cadena (ver
                 * conversacion -- "un clic accidental podria redirigir el
                 * nuevo Proyecto a la campaña equivocada"). Se deja un
                 * enlace "Cambiar" para el caso real en que si haga falta
                 * corregirlo -- no es un candado permanente, solo evita el
                 * despiste de tocar el buscador sin querer.
                 */
                if (campo.prefilled) bloquearCampoPrefilled_(elTexto);
              }
              return;
            }
            if (campo.tipo === "fk_dependiente") return; // se rellena en repoblarDependiente_
            var el = document.getElementById("campo_" + campo.campo);
            if (el) el.value = campo.valorActual;
          });
          aplicarValoresPorDefecto_();
          activarVisibilidadCondicional_();
          activarBuscadoresFk_();
          activarDependenciasFk_();
          activarSugerenciasSecuencia_();
          activarSugerenciasCodigo_();
          activarSugerenciasVersion_();
          activarDerivacionDeRelacion_();
          activarAltaRapidaCatalogo_();
          activarValidacionEnVivo_();
          esquema.forEach(function (campo) {
            if (campo.tipo === "fk_dependiente") {
              var elPadre = document.getElementById("campo_" + campo.dependeDe);
              if (elPadre && elPadre.value) repoblarDependiente_(campo, elPadre.value);
            }
          });
          document.getElementById("btnGuardar").disabled = false;
          document.getElementById("campos").addEventListener("input", function () { formularioSucio_ = true; });
          document.getElementById("campos").addEventListener("change", function () { formularioSucio_ = true; });
          cargarVinculosRelacionados_();
          cargarAsignacionesRelacionadas_();
        })
        .withFailureHandler(mostrarError)
        .obtenerEsquemaFormulario(ENTIDAD, ID_REGISTRO);
    }

    /*
     * Auditoria piloto (#13): el paso posterior "¿Vincular a un proyecto
     * ahora?" (F-015) se sustituyo por un campo normal del formulario
     * (PROYECTO_VINCULAR_ID en el esquema de PRODUCTO) que guardarFormulario
     * resuelve en el mismo guardado -- ya no hace falta un segundo paso
     * ni una segunda pantalla aqui.
     */
    function guardar() {
      var faltantes = validarObligatoriosAntesDeGuardar_();

      if (faltantes.length > 0) {
        var elError = document.getElementById("mensaje");
        elError.className = "error";
        elError.textContent = "Faltan campos obligatorios: " + faltantes.join(", ");
        return;
      }

      var datos = {};
      esquemaActual.forEach(function (campo) {
        var el = document.getElementById("campo_" + campo.campo);
        datos[campo.campo] = el.value;
      });
      document.getElementById("btnGuardar").disabled = true;
      google.script.run
        .withSuccessHandler(function (resultado) {
          formularioSucio_ = false;
          var el = document.getElementById("mensaje");
          el.className = "ok";
          el.textContent = "Guardado correctamente.";

          /*
           * Flujo encadenado (Campaña->Proyecto->Producto->Proceso->
           * Tarea, ver conversación): al crear un registro nuevo,
           * ofrece primero bajar al "hijo" natural (CADENA_HIJO_MVP);
           * si se declina (o no aplica, como en TAREA que no tiene
           * hijo), ofrece repetir al mismo nivel para el mismo padre
           * (CADENA_HERMANO_MVP), para poder construir varias piezas
           * seguidas sin volver al menú. Solo en creación, y solo si
           * el guardado devolvió un ID.
           */
          var esCreacionConId = !ID_REGISTRO && resultado && resultado.id;
          var cadenaHijo = CADENA_HIJO_MVP[ENTIDAD];
          var cadenaHermano = CADENA_HERMANO_MVP[ENTIDAD];
          var valorPadreHermano = cadenaHermano ? datos[cadenaHermano.campoPadre] : null;

          function ofrecerHermanoOFinal_() {
            if (esCreacionConId && cadenaHermano && valorPadreHermano) {
              confirmarAccion_(
                cadenaHermano.pregunta,
                function () {
                  // Lanzar la peticion ANTES de cerrar: si se cierra
                  // primero, el canal de google.script.run se corta y la
                  // llamada nunca llega al servidor (confirmado con un
                  // marcador de diagnostico -- el servidor no se enteraba).
                  // Cerrar justo despues, sin esperar respuesta, basta
                  // para que este dialogo ya no ocupe el hueco cuando el
                  // servidor intente abrir el siguiente.
                  // Un "hermano" se crea bajo el mismo padre que este
                  // registro -- la RUTA y CAMPANA_RAIZ que trajeron este
                  // dialogo (sin añadirse a si mismo) siguen siendo las
                  // correctas.
                  google.script.run
                    .withFailureHandler(mostrarError)
                    .abrirFormularioCrearHermano(ENTIDAD, cadenaHermano.campoPadre, valorPadreHermano, RUTA, CAMPANA_RAIZ);
                  google.script.host.close();
                },
                function () { setTimeout(function () { cerrarOVolver_(); }, 300); },
                "Sí, añadir otro"
              );
              return;
            }
            setTimeout(function () { cerrarOVolver_(); }, 900);
          }

          if (esCreacionConId && cadenaHijo) {
            confirmarAccion_(
              cadenaHijo.pregunta,
              function () {
                // Mismo motivo que en ofrecerHermanoOFinal_: lanzar la
                // peticion antes de cerrar, no despues.
                // El hijo hereda RUTA + este registro recien creado, para
                // que su propia miga de pan muestre todo el camino
                // recorrido hasta aqui. CAMPANA_RAIZ tambien se hereda tal
                // cual, salvo en la propia CAMPANA (aun no la tiene): en
                // ese caso resultado.id ES la raiz, para que el enlace al
                // panel funcione desde el primer Proyecto en adelante.
                var rutaHijo = RUTA.concat([{ etiqueta: datos.NOMBRE || resultado.id }]);
                var campanaRaizHijo = CAMPANA_RAIZ || resultado.id;
                invocarCadenaHijo_(cadenaHijo.funcion, resultado.id, rutaHijo, campanaRaizHijo);
                google.script.host.close();
              },
              function () { ofrecerHermanoOFinal_(); },
              cadenaHijo.textoBoton
            );
            return;
          }

          ofrecerHermanoOFinal_();
        })
        .withFailureHandler(function (error) {
          mostrarError(error);
          document.getElementById("btnGuardar").disabled = false;
        })
        .guardarFormulario(ENTIDAD, ID_REGISTRO, datos, null);
    }

    cargarEsquema();
  </script>
</body>
