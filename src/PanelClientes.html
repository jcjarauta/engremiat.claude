<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      .cabecera button { flex-shrink: 0; }
      .resumen { color: var(--color-texto-secundario); font-size: 13px; margin-bottom: 12px; }
      .fila-cliente { border: 1px solid var(--color-borde); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
      .fila-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .nombre-cliente { font-weight: bold; font-size: 14px; }
      .detalle-cliente { color: var(--color-texto-secundario); font-size: 13px; margin-top: 2px; }
      .acciones-cliente { display: flex; gap: 6px; flex-shrink: 0; margin-top: 8px; }
      .btn-mini { font-size: 13px; padding: 6px 10px; }
      .badge { font-size: 13px; padding: 2px 10px; }
      .badge-alerta { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-ok { background: #e6f4ea; color: var(--color-exito); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-nivel { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; margin: 12px 0; }
    </style>
  </head>
  <body>
    <div class="cabecera">
      <button id="btnNuevoCliente" class="btn-mini boton-primario" title="Nuevo cliente">+ Nuevo cliente</button>
      <button id="btnExportar" class="btn-mini" title="Exportar CSV">⬇ CSV</button>
      <button id="btnActualizar" class="btn-mini" title="Volver a cargar">🔄</button>
    </div>
    <div id="resumen" class="resumen"></div>

    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="lista"></div>

    <script>
      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function escapeAttr(texto) {
        return escapeHtml(texto).replace(/"/g, "&quot;");
      }

      function claseBadgeIncidencias_(cantidad) {
        if (cantidad > 0) return "badge-alerta";
        return "badge-ok";
      }

      function renderCliente_(cliente) {
        var codigo = cliente.codigo ? ' (' + escapeHtml(cliente.codigo) + ')' : '';
        var badgeEstado = '<span class="badge badge-neutro">' + escapeHtml(cliente.estado) + '</span>';
        var badgeIncidencias = cliente.incidenciasAbiertas > 0
          ? '<span class="badge ' + claseBadgeIncidencias_(cliente.incidenciasAbiertas) + '">' +
            cliente.incidenciasAbiertas + ' incidencia' + (cliente.incidenciasAbiertas === 1 ? '' : 's') + ' abierta' + (cliente.incidenciasAbiertas === 1 ? '' : 's') +
            (cliente.antiguedadDias !== null ? ' · más antigua: ' + cliente.antiguedadDias + ' días' : '') + '</span>'
          : '';

        var botonSheet = cliente.sheetUrl
          ? '<a class="boton btn-mini" href="' + escapeAttr(cliente.sheetUrl) + '" target="_blank">Ver Sheet</a>'
          : '';

        return '<div class="fila-cliente">' +
          '<div class="fila-cabecera">' +
            '<div>' +
              '<div class="nombre-cliente">' + escapeHtml(cliente.nombre) + codigo + '</div>' +
              '<div class="detalle-cliente">' + escapeHtml(cliente.tipo) + ' · ' + badgeEstado + ' ' + badgeIncidencias + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="acciones-cliente">' +
            '<button class="boton btn-mini" onclick="editar(\'' + escapeAttr(cliente.id) + '\')">Editar</button>' +
            '<button class="boton btn-mini" onclick="nuevaIncidencia(\'' + escapeAttr(cliente.id) + '\')">Nueva incidencia</button>' +
            botonSheet +
          '</div>' +
        '</div>';
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
      }

      function editar(id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion("CLIENTE", id);
      }

      function nuevaIncidencia(clienteId) {
        google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaCliente(clienteId);
      }

      function renderLista(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        if (!datos.clientes.length) {
          document.getElementById("lista").innerHTML = '<div class="vacio-nivel">No hay ningún cliente todavía — crea uno desde "+ Nuevo cliente".</div>';
          document.getElementById("resumen").textContent = "";
          return;
        }
        document.getElementById("resumen").textContent = datos.total + " clientes en total";
        document.getElementById("lista").innerHTML = datos.clientes.map(renderCliente_).join("");
      }

      function cargarLista() {
        document.getElementById("estadoCarga").textContent = "Cargando...";
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("lista").innerHTML = "";
        google.script.run.withSuccessHandler(renderLista).withFailureHandler(mostrarError).obtenerListaClientes();
      }

      document.getElementById("btnActualizar").addEventListener("click", cargarLista);
      document.getElementById("btnNuevoCliente").addEventListener("click", function () {
        google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearCliente();
      });
      document.getElementById("btnExportar").addEventListener("click", function () {
        google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarClientesCSV();
      });

      cargarLista();
    </script>
  </body>
</html>
