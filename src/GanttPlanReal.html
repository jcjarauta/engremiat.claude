<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 12px; }
      .filtros { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; }
      .filtros label { margin-bottom: 2px; font-size: 11px; }
      select, button { padding: 4px; }
      .leyenda { margin: 8px 0; color: var(--color-texto-secundario); }
      .leyenda span { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
      .rango-fechas { color: var(--color-texto-secundario); margin-bottom: 8px; }
      .contenedor-tabla { overflow-x: auto; max-height: 480px; overflow-y: auto; border: 1px solid var(--color-borde); }
      th, td { vertical-align: middle; height: 30px; white-space: nowrap; }
      th { position: sticky; top: 0; background: #fff; z-index: 2; }
      td.col-nombre, th.col-nombre { position: sticky; left: 0; background: #fff; z-index: 1; white-space: normal; }
      .col-nombre { width: 170px; min-width: 170px; }
      .col-responsable { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
      .col-track { width: 220px; min-width: 220px; }
      .col-fechas { white-space: nowrap; color: #333; }
      .col-desviacion { text-align: center; font-weight: bold; }
      .col-desviacion.retraso { color: var(--color-peligro); }
      .col-desviacion.a-tiempo { color: #2e7d32; }
      .track { position: relative; height: 26px; background: var(--color-fondo-suave); border-radius: 3px; }
      .barra { position: absolute; height: 8px; border-radius: 3px; }
      .barra-plan { top: 3px; background: #9e9e9e; }
      .barra-real-ok { top: 15px; background: #2e7d32; }
      .barra-real-tarde { top: 15px; background: var(--color-peligro); }
      .banda-fuera-horario { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(176,0,32,0.12), rgba(176,0,32,0.12) 3px, transparent 3px, transparent 6px); }
      .linea-hoy { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--color-primario); z-index: 1; }
      .btn-editar { cursor: pointer; border: 1px solid var(--color-borde); background: #fafafa; border-radius: 3px; padding: 2px 6px; }
      .btn-editar:hover { background: var(--color-fondo-suave); }
      tr:hover td { background: #f7f9fc; }
      .vacio { padding: 12px 0; }
    </style>
  </head>
  <body>
    <h3>Gantt: plan vs. real</h3>
    <div class="leyenda">
      <span style="background:#9e9e9e;"></span>Plan
      <span style="background:#2e7d32;margin-left:10px;"></span>Real (a tiempo)
      <span style="background:#b00020;margin-left:10px;"></span>Real (con retraso)
      <span style="background:#1a73e8;margin-left:10px;"></span>Hoy
      <span style="background:repeating-linear-gradient(45deg, rgba(176,0,32,0.35), rgba(176,0,32,0.35) 2px, transparent 2px, transparent 4px);margin-left:10px;"></span>Fuera del horario declarado del responsable
    </div>

    <div class="filtros">
      <div>
        <label for="filtro-campana">Campaña</label>
        <select id="filtro-campana"><option value="">(todas)</option></select>
      </div>
      <div>
        <label for="filtro-proyecto">Proyecto</label>
        <select id="filtro-proyecto"><option value="">(todos)</option></select>
      </div>
      <div>
        <label for="filtro-fase">Fase de producción</label>
        <select id="filtro-fase"><option value="">(todas)</option></select>
      </div>
      <div>
        <label for="filtro-responsable">Responsable</label>
        <select id="filtro-responsable"><option value="">(todos)</option></select>
      </div>
      <button id="btn-exportar-csv">Exportar CSV (detalle)</button>
    </div>

    <div id="rango-fechas" class="rango-fechas"></div>
    <div id="resumen-gantt" class="rango-fechas"></div>

    <div id="estado-carga">Cargando...</div>
    <div class="contenedor-tabla">
      <table id="tabla-gantt" style="display:none;">
        <thead>
          <tr>
            <th class="col-nombre">Proceso</th>
            <th>Producto</th>
            <th>Fase</th>
            <th class="col-responsable">Responsable</th>
            <th>Plan</th>
            <th>Real</th>
            <th>Desviación</th>
            <th class="col-track"><div id="eje-fechas" style="position:relative; height:16px;"></div></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="filas-gantt"></tbody>
      </table>
    </div>

    <script>
      var PRESELECCION_CAMPANA = <?!= JSON.stringify(preseleccionCampana) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return '';
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatearFecha_(fecha) {
        var d = new Date(fecha);
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm + '/' + d.getFullYear();
      }

      function formatearRangoFechas_(inicio, fin) {
        if (!inicio || !fin) return '—';
        return formatearFecha_(inicio) + '–' + formatearFecha_(fin);
      }

      function formatearFechaCorta_(fecha) {
        var d = new Date(fecha);
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm;
      }

      /*
       * Paso adaptativo segun el rango total: se busca el primer paso
       * "redondo" (de una lista de pasos habituales) que deje como
       * maximo ~7 marcas, para que quepan sin solaparse en el ancho
       * disponible de la columna del grafico, sea cual sea el rango
       * (una campana de 12 dias o el sistema entero durante meses).
       */
      function calcularTicks_(minFecha, maxFecha) {
        var dia = 24 * 60 * 60 * 1000;
        var spanDias = (maxFecha - minFecha) / dia;
        var pasosRedondos = [1, 2, 3, 5, 7, 10, 14, 21, 30, 45, 60, 90, 120, 180, 365];
        var pasoDias = pasosRedondos[pasosRedondos.length - 1];
        for (var i = 0; i < pasosRedondos.length; i++) {
          if (spanDias / pasosRedondos[i] <= 7) { pasoDias = pasosRedondos[i]; break; }
        }

        var ticks = [];
        var actual = new Date(minFecha);
        actual.setHours(0, 0, 0, 0);
        while (actual.getTime() <= maxFecha) {
          ticks.push(actual.getTime());
          actual = new Date(actual.getTime() + pasoDias * dia);
        }
        return ticks;
      }

      function formatearDesviacion_(dias, diasRiesgo) {
        if (dias === null || dias === undefined) {
          if (diasRiesgo !== null && diasRiesgo !== undefined) return { texto: 'Riesgo +' + diasRiesgo + 'd', clase: 'retraso' };
          return { texto: '—', clase: '' };
        }
        if (dias === 0) return { texto: 'A tiempo', clase: 'a-tiempo' };
        if (dias > 0) return { texto: '+' + dias + 'd', clase: 'retraso' };
        return { texto: dias + 'd', clase: 'a-tiempo' };
      }

      function mostrarError(error) {
        document.getElementById('estado-carga').textContent = 'Error: ' + (error && error.message ? error.message : error);
        document.getElementById('estado-carga').style.display = 'block';
      }

      function abrirEdicionProceso(id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion('PROCESO', id);
      }

      function cargarOpcionesFiltro() {
        google.script.run.withFailureHandler(mostrarError).withSuccessHandler(function (opciones) {
          var selectCampana = document.getElementById('filtro-campana');
          opciones.campanas.forEach(function (campana) {
            selectCampana.innerHTML += '<option value="' + escapeHtml(campana.id) + '">' + escapeHtml(campana.etiqueta) + '</option>';
          });
          var selectProyecto = document.getElementById('filtro-proyecto');
          opciones.proyectos.forEach(function (proyecto) {
            selectProyecto.innerHTML += '<option value="' + escapeHtml(proyecto.id) + '">' + escapeHtml(proyecto.etiqueta) + '</option>';
          });
          var selectFase = document.getElementById('filtro-fase');
          opciones.fases.forEach(function (fase) {
            selectFase.innerHTML += '<option value="' + escapeHtml(fase) + '">' + escapeHtml(fase) + '</option>';
          });
          var selectResponsable = document.getElementById('filtro-responsable');
          opciones.personas.forEach(function (persona) {
            selectResponsable.innerHTML += '<option value="' + escapeHtml(persona.id) + '">' + escapeHtml(persona.etiqueta) + '</option>';
          });
          // Al llegar desde "Ver Gantt" del panel de campaña, viene con la campaña ya elegida.
          if (PRESELECCION_CAMPANA) {
            selectCampana.value = PRESELECCION_CAMPANA;
            cargarGantt();
          }
        }).obtenerOpcionesFiltroGantt();
      }

      function renderGantt(datos) {
        document.getElementById('estado-carga').style.display = 'none';
        var filas = datos.filas || [];
        var tabla = document.getElementById('tabla-gantt');
        var rangoFechasEl = document.getElementById('rango-fechas');

        if (filas.length === 0) {
          tabla.style.display = 'none';
          rangoFechasEl.textContent = '';
          document.getElementById('estado-carga').textContent = 'No hay procesos con fechas de plan para este filtro.';
          document.getElementById('estado-carga').style.display = 'block';
          return;
        }

        var fechas = [];
        filas.forEach(function (fila) {
          [fila.fechaInicioPlan, fila.fechaFinPlan, fila.fechaInicioReal, fila.fechaFinReal].forEach(function (f) {
            if (f) fechas.push(new Date(f).getTime());
          });
        });
        var hoy = new Date().getTime();
        var minFecha = Math.min.apply(null, fechas.concat([hoy]));
        var maxFecha = Math.max.apply(null, fechas.concat([hoy]));
        var rango = Math.max(maxFecha - minFecha, 24 * 60 * 60 * 1000);

        rangoFechasEl.textContent = 'Mostrando: ' + formatearFecha_(minFecha) + ' – ' + formatearFecha_(maxFecha);

        var enPlazo = 0, retrasados = 0, enRiesgo = 0, sumaDesviacion = 0, conDesviacion = 0, fueraDeHorario = 0;
        filas.forEach(function (fila) {
          if (fila.diasDesviacionFin !== null && fila.diasDesviacionFin !== undefined) {
            conDesviacion++;
            sumaDesviacion += fila.diasDesviacionFin;
            if (fila.diasDesviacionFin > 0) retrasados++; else enPlazo++;
          } else if (fila.diasRiesgo !== null && fila.diasRiesgo !== undefined) {
            enRiesgo++;
          }
          if (fila.diasFueraDeHorario && fila.diasFueraDeHorario.length > 0) fueraDeHorario++;
        });
        var mediaTexto = conDesviacion > 0 ? (Math.round((sumaDesviacion / conDesviacion) * 10) / 10) + 'd' : '—';
        document.getElementById('resumen-gantt').textContent =
          filas.length + ' procesos · ' + enPlazo + ' en plazo · ' + retrasados + ' retrasados · ' +
          enRiesgo + ' en riesgo (sin terminar, plazo vencido) · desviación media: ' + mediaTexto +
          ' · ' + fueraDeHorario + ' con planificación fuera del horario declarado del responsable';

        function posicion(fecha) {
          return ((new Date(fecha).getTime() - minFecha) / rango) * 100;
        }

        var posicionHoy = posicion(hoy);
        var lineaHoy = (posicionHoy >= 0 && posicionHoy <= 100)
          ? '<div class="linea-hoy" style="left:' + posicionHoy + '%;" title="Hoy: ' + formatearFecha_(hoy) + '"></div>'
          : '';

        // Eje de fechas (cabecera) + cuadricula repetida en cada fila -- mismo
        // mecanismo de posicion() ya usado para la linea de "hoy".
        var ticks = calcularTicks_(minFecha, maxFecha);
        document.getElementById('eje-fechas').innerHTML = ticks.map(function (t) {
          return '<span style="position:absolute;left:' + posicion(t) + '%;top:0;font-size:9px;font-weight:normal;color:var(--color-texto-secundario);white-space:nowrap;transform:translateX(-50%);">' +
            escapeHtml(formatearFechaCorta_(t)) + '</span>';
        }).join('');
        var lineasCuadricula = ticks.map(function (t) {
          return '<div style="position:absolute;left:' + posicion(t) + '%;top:0;bottom:0;width:1px;background:#eee;"></div>';
        }).join('');

        var anchoDia = ((24 * 60 * 60 * 1000) / rango) * 100;

        /*
         * Bandas de "fuera de horario declarado" (N3.2 -- el puente
         * entre HORARIO y planificacion): un div rayado por cada dia
         * dentro del rango de la barra en que el responsable no tiene
         * ningun HORARIO activo que lo cubra. fila.diasFueraDeHorario
         * es null cuando el responsable no tiene ningun HORARIO cargado
         * (sin datos para evaluar, no se pinta nada -- distinto de
         * "cero dias fuera de horario").
         */
        function bandasFueraDeHorario_(fila) {
          if (!fila.diasFueraDeHorario || fila.diasFueraDeHorario.length === 0) return '';
          return fila.diasFueraDeHorario.map(function (fechaStr) {
            var izq = posicion(fechaStr + 'T00:00:00');
            if (izq < -anchoDia || izq > 100) return '';
            return '<div class="banda-fuera-horario" style="left:' + izq + '%;width:' + anchoDia + '%;" title="Fuera del horario declarado del responsable: ' + escapeHtml(fechaStr) + '"></div>';
          }).join('');
        }

        document.getElementById('filas-gantt').innerHTML = filas.map(function (fila) {
          var izqPlan = posicion(fila.fechaInicioPlan);
          var anchoPlan = Math.max(posicion(fila.fechaFinPlan) - izqPlan, 0.5);
          var tituloPlan = 'Plan: ' + formatearFecha_(fila.fechaInicioPlan) + ' – ' + formatearFecha_(fila.fechaFinPlan);
          var barraReal = '';
          if (fila.fechaInicioReal && fila.fechaFinReal) {
            var izqReal = posicion(fila.fechaInicioReal);
            var anchoReal = Math.max(posicion(fila.fechaFinReal) - izqReal, 0.5);
            var tarde = new Date(fila.fechaFinReal) > new Date(fila.fechaFinPlan);
            var tituloReal = 'Real: ' + formatearFecha_(fila.fechaInicioReal) + ' – ' + formatearFecha_(fila.fechaFinReal);
            barraReal = '<div class="barra ' + (tarde ? 'barra-real-tarde' : 'barra-real-ok') +
              '" style="left:' + izqReal + '%;width:' + anchoReal + '%;" title="' + escapeHtml(tituloReal) + '"></div>';
          }
          var desv = formatearDesviacion_(fila.diasDesviacionFin, fila.diasRiesgo);
          return '<tr>' +
            '<td class="col-nombre">' + escapeHtml(fila.nombre) + '</td>' +
            '<td>' + escapeHtml(fila.productoNombre) + '</td>' +
            '<td>' + escapeHtml(fila.fase) + '</td>' +
            '<td class="col-responsable" title="' + escapeHtml(fila.responsable) + '">' + escapeHtml(fila.responsable) + '</td>' +
            '<td class="col-fechas">' + formatearRangoFechas_(fila.fechaInicioPlan, fila.fechaFinPlan) + '</td>' +
            '<td class="col-fechas">' + formatearRangoFechas_(fila.fechaInicioReal, fila.fechaFinReal) + '</td>' +
            '<td class="col-desviacion ' + desv.clase + '">' + desv.texto + '</td>' +
            '<td class="col-track"><div class="track">' +
              bandasFueraDeHorario_(fila) +
              lineasCuadricula +
              '<div class="barra barra-plan" style="left:' + izqPlan + '%;width:' + anchoPlan + '%;" title="' + escapeHtml(tituloPlan) + '"></div>' +
              barraReal + lineaHoy +
            '</div></td>' +
            '<td><span class="btn-editar" onclick="abrirEdicionProceso(\'' + escapeHtml(fila.id) + '\')">✎ Editar</span></td>' +
          '</tr>';
        }).join('');

        tabla.style.display = 'table';
      }

      function filtroActual_() {
        return {
          campanaId: document.getElementById('filtro-campana').value || null,
          proyectoId: document.getElementById('filtro-proyecto').value || null,
          faseProduccion: document.getElementById('filtro-fase').value || null,
          responsableId: document.getElementById('filtro-responsable').value || null
        };
      }

      function cargarGantt() {
        document.getElementById('estado-carga').style.display = 'block';
        document.getElementById('estado-carga').textContent = 'Cargando...';
        document.getElementById('tabla-gantt').style.display = 'none';
        google.script.run.withFailureHandler(mostrarError).withSuccessHandler(renderGantt).obtenerDatosGanttPlanReal(filtroActual_());
      }

      ['filtro-campana', 'filtro-proyecto', 'filtro-fase', 'filtro-responsable'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', cargarGantt);
      });
      document.getElementById('btn-exportar-csv').addEventListener('click', function () {
        google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarGanttCSV(filtroActual_());
      });
      cargarOpcionesFiltro();
      if (!PRESELECCION_CAMPANA) cargarGantt();
    </script>
  </body>
</html>
