<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      h3 { font-size: 16px; margin-bottom: 2px; }
      .subtitulo { color: var(--color-texto-secundario); font-size: 12px; margin-bottom: 16px; }
      .tarjeta {
        display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 12px; margin-bottom: 10px; background: #fff; cursor: pointer;
        border: 1px solid var(--color-borde); border-radius: 8px; text-align: left;
        font-family: inherit; color: var(--color-texto);
      }
      .tarjeta:hover { background: var(--color-fondo-suave); border-color: var(--color-primario); }
      .tarjeta .icono { font-size: 22px; flex-shrink: 0; }
      .tarjeta .texto { flex: 1; }
      .tarjeta .titulo { font-weight: bold; font-size: 13px; }
      .tarjeta .detalle { color: var(--color-texto-secundario); font-size: 11px; margin-top: 2px; }
      .separador { font-size: 11px; font-weight: bold; color: var(--color-texto-secundario); text-transform: uppercase; letter-spacing: .03em; margin: 16px 0 6px 2px; }
      .separador:first-of-type { margin-top: 0; }
      .fila-busqueda { display: flex; gap: 6px; margin-bottom: 4px; }
      .fila-busqueda input { flex: 1; margin-top: 0; }
      .resultado-busqueda {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
        padding: 7px 8px; cursor: pointer; border-radius: 6px; font-size: 12px;
      }
      .resultado-busqueda:hover { background: var(--color-fondo-suave); }
      .resultado-busqueda .etiqueta-entidad { color: var(--color-texto-secundario); font-size: 10px; text-transform: uppercase; flex-shrink: 0; }
      .vacio-busqueda { color: var(--color-texto-secundario); font-style: italic; font-size: 12px; padding: 4px; }
      .fila-actividad { padding: 6px 2px; border-bottom: 1px solid var(--color-borde); font-size: 12px; cursor: pointer; }
      .fila-actividad:last-child { border-bottom: none; }
      .fila-actividad:hover { background: var(--color-fondo-suave); }
      .fila-actividad .cuando { color: var(--color-texto-secundario); font-size: 11px; }
    </style>
  </head>
  <body>
    <h3>🗺️ Mapa del sheet</h3>
    <div class="subtitulo">Un único punto de partida para navegar el taller -- elige un espacio.</div>

    <div class="fila-busqueda">
      <input type="text" id="terminoBusqueda" placeholder="Buscar por nombre o ID..." onkeydown="if(event.key==='Enter')buscar();">
      <button class="boton boton-primario" onclick="buscar()">Buscar</button>
    </div>
    <div id="resultadosBusqueda"></div>

    <div class="separador">Producción</div>
    <button class="tarjeta" onclick="abrir('abrirPanelCampana')">
      <span class="icono">🏗️</span>
      <span class="texto">
        <div class="titulo">Gestión de campaña</div>
        <div class="detalle">Campaña → Proyecto → Producto → Proceso → Tarea</div>
      </span>
    </button>
    <button class="tarjeta" id="tarjetaOperativo" onclick="abrir('abrirPanelOperativo')">
      <span class="icono">📊</span>
      <span class="texto">
        <div class="titulo">Panel operativo</div>
        <div class="detalle">Alertas y avisos del taller de un vistazo</div>
      </span>
    </button>
    <button class="tarjeta" onclick="abrir('abrirInformes')">
      <span class="icono">📄</span>
      <span class="texto">
        <div class="titulo">Informes</div>
        <div class="detalle">Campaña, proyecto, desviación entre campañas -- con exportación</div>
      </span>
    </button>

    <div class="separador">Datos</div>
    <button class="tarjeta" onclick="abrir('abrirImportacionMasivaInicio')">
      <span class="icono">📥</span>
      <span class="texto">
        <div class="titulo">Importación masiva</div>
        <div class="detalle">Cargar muchos registros de golpe (Campaña→Tarea, Recursos, Personas)</div>
      </span>
    </button>

    <div class="separador">Equipo</div>
    <button class="tarjeta" onclick="abrir('abrirPanelPersonas')">
      <span class="icono">👥</span>
      <span class="texto">
        <div class="titulo">Personas y equipos</div>
        <div class="detalle">Coordinador → equipo → miembros</div>
      </span>
    </button>
    <button class="tarjeta" onclick="abrir('abrirPanelRecursos')">
      <span class="icono">🛠️</span>
      <span class="texto">
        <div class="titulo">Espacios y recursos</div>
        <div class="detalle">Herramientas, maquinaria, espacios físicos</div>
      </span>
    </button>

    <div class="separador" id="separadorComercial" style="display:none;">Comercial</div>
    <button class="tarjeta" id="tarjetaClientes" style="display:none;" onclick="abrir('abrirPanelClientes')">
      <span class="icono">🧑‍💼</span>
      <span class="texto">
        <div class="titulo">Clientes</div>
        <div class="detalle">Fichas de cliente e incidencias asociadas</div>
      </span>
    </button>
    <button class="tarjeta" id="tarjetaVentas" style="display:none;" onclick="abrir('abrirPanelVentas')">
      <span class="icono">💰</span>
      <span class="texto">
        <div class="titulo">Ventas</div>
        <div class="detalle">Pedidos, entregas y contratos de servicio</div>
      </span>
    </button>

    <div class="separador">Ayuda</div>
    <button class="tarjeta" onclick="abrir('abrirBiblioteca')">
      <span class="icono">📚</span>
      <span class="texto">
        <div class="titulo">Biblioteca</div>
        <div class="detalle">Qué es cada cosa: Campaña, Ficha, Panel... y qué hacer si algo se atasca</div>
      </span>
    </button>

    <div class="separador">Actividad reciente</div>
    <div id="listaActividad" class="vacio-busqueda">Cargando...</div>

    <div id="mensaje"></div>

    <script>
      var MODULOS_INSTALADOS = <?!= modulosInstalados ?>;

      /*
       * null = sin información de módulos (Sheet maestro en crudo, sin
       * envoltorio) -- se asume que todo está instalado, mismo criterio
       * de compatibilidad que moduloInstalado_() en FormularioMotorUI.js.
       */
      function moduloInstalado_(nombreModulo) {
        if (!MODULOS_INSTALADOS) return true;
        return MODULOS_INSTALADOS.indexOf(nombreModulo) !== -1;
      }

      if (!moduloInstalado_('COMPRAS')) {
        document.getElementById('tarjetaOperativo').style.display = 'none';
      }
      var hayComercial = moduloInstalado_('CLIENTE') || moduloInstalado_('VENTAS');
      if (hayComercial) {
        document.getElementById('separadorComercial').style.display = '';
        if (moduloInstalado_('CLIENTE')) document.getElementById('tarjetaClientes').style.display = '';
        if (moduloInstalado_('VENTAS')) document.getElementById('tarjetaVentas').style.display = '';
      }

      function mostrarError(error) {
        document.getElementById('mensaje').className = 'error';
        document.getElementById('mensaje').textContent = 'Error: ' + (error && error.message ? error.message : error);
      }

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return '';
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function verFichaDesdeMapa(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirFichaDesdeResultadoBusqueda(entidad, id);
      }

      function buscar() {
        var termino = document.getElementById('terminoBusqueda').value;
        var contenedor = document.getElementById('resultadosBusqueda');
        if (!termino || !termino.trim()) { contenedor.innerHTML = ''; return; }
        contenedor.innerHTML = '<div class="vacio-busqueda">Buscando...</div>';
        google.script.run
          .withFailureHandler(mostrarError)
          .withSuccessHandler(function (resultados) {
            contenedor.innerHTML = resultados.length
              ? resultados.map(function (r) {
                  return '<div class="resultado-busqueda" onclick="verFichaDesdeMapa(\'' + r.entidad + '\',\'' + escapeHtml(r.id) + '\')">' +
                    '<span>' + escapeHtml(r.etiqueta) + '</span>' +
                    '<span class="etiqueta-entidad">' + escapeHtml(r.entidadEtiqueta) + '</span>' +
                  '</div>';
                }).join('')
              : '<div class="vacio-busqueda">Sin resultados para "' + escapeHtml(termino) + '".</div>';
          })
          .buscarGlobal(termino);
      }

      var ETIQUETAS_ENTIDAD_ACTIVIDAD_ = {
        CAMPANA: 'Campaña', PROYECTO: 'Proyecto', PRODUCTO: 'Producto', PROCESO: 'Proceso', TAREA: 'Tarea',
        PERSONA_EQUIPO: 'Persona/equipo', RECURSO: 'Recurso', INCIDENCIA: 'Incidencia',
        MATERIAL: 'Material', PROVEEDOR: 'Proveedor', CONVOCATORIA: 'Convocatoria'
      };
      var ACCIONES_ACTIVIDAD_ = { CREAR: 'creó', ACTUALIZAR: 'editó', DESACTIVAR: 'desactivó', REACTIVAR: 'reactivó', REVERTIR: 'revirtió' };

      function formatearFechaRelativa_(iso) {
        var fecha = new Date(iso);
        if (isNaN(fecha.getTime())) return '';
        return fecha.toLocaleDateString() + ' ' + fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      google.script.run
        .withFailureHandler(function () { document.getElementById('listaActividad').innerHTML = '<div class="vacio-busqueda">No se pudo cargar la actividad reciente.</div>'; })
        .withSuccessHandler(function (actividad) {
          document.getElementById('listaActividad').innerHTML = actividad.length
            ? actividad.map(function (a) {
                var etiquetaEntidad = ETIQUETAS_ENTIDAD_ACTIVIDAD_[a.entidad] || a.entidad;
                var accion = ACCIONES_ACTIVIDAD_[a.accion] || a.accion;
                var abrible = !!ETIQUETAS_ENTIDAD_ACTIVIDAD_[a.entidad];
                var onclick = abrible ? ' onclick="verFichaDesdeMapa(\'' + a.entidad + '\',\'' + escapeHtml(a.registroId) + '\')"' : '';
                return '<div class="fila-actividad"' + onclick + '>' +
                  escapeHtml(a.usuario) + ' ' + accion + ' ' + etiquetaEntidad.toLowerCase() + ' ' + escapeHtml(a.registroId) +
                  '<div class="cuando">' + formatearFechaRelativa_(a.timestamp) + '</div>' +
                '</div>';
              }).join('')
            : '<div class="vacio-busqueda">Sin actividad todavía.</div>';
        })
        .obtenerActividadReciente(8);

      /*
       * Despacho literal, no dinámico (ver conversación -- hallazgo
       * repetido en este sheet): google.script.run solo expone las
       * funciones que el generador de envoltorios detecta como llamada
       * LITERAL "google.script.run....nombre(...)" en el fuente.
       * [funcion]() es invisible a ese escaneo estático.
       */
      function abrir(funcion) {
        switch (funcion) {
          case 'abrirPanelCampana':
            google.script.run.withFailureHandler(mostrarError).abrirPanelCampana();
            return;
          case 'abrirPanelOperativo':
            google.script.run.withFailureHandler(mostrarError).abrirPanelOperativo();
            return;
          case 'abrirPanelPersonas':
            google.script.run.withFailureHandler(mostrarError).abrirPanelPersonas();
            return;
          case 'abrirPanelRecursos':
            google.script.run.withFailureHandler(mostrarError).abrirPanelRecursos();
            return;
          case 'abrirPanelClientes':
            google.script.run.withFailureHandler(mostrarError).abrirPanelClientes();
            return;
          case 'abrirPanelVentas':
            google.script.run.withFailureHandler(mostrarError).abrirPanelVentas();
            return;
          case 'abrirImportacionMasivaInicio':
            google.script.run.withFailureHandler(mostrarError).abrirImportacionMasivaInicio();
            return;
          case 'abrirBiblioteca':
            google.script.run.withFailureHandler(mostrarError).abrirBiblioteca();
            return;
          case 'abrirInformes':
            google.script.run.withFailureHandler(mostrarError).abrirInformes();
            return;
        }
        mostrarError({ message: 'Espacio desconocido: ' + funcion });
      }
    </script>
  </body>
</html>
