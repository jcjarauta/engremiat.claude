<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      .cadena-contexto { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; background: var(--color-fondo-suave); border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-bottom: 16px; }
      .cadena-contexto .enlace-mini { color: var(--color-primario); cursor: pointer; }
      .cadena-contexto .enlace-mini:hover { text-decoration: underline; }
      .cadena-contexto .separador { color: var(--color-texto-secundario); }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="tituloIncidencia"></h2>
        <div class="detalle" id="detalleIncidencia"></div>
        <div class="acciones">
          <select id="selectorEstadoRapido" class="btn-mini"></select>
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
        </div>
      </div>

      <div class="cadena-contexto" id="cadenaContexto"></div>

      <section class="bloque">
        <h3>Decisiones vinculadas <button id="btnNuevaDecision" class="boton btn-mini">+ Vínculo a decisión</button></h3>
        <div class="lista" id="listaDecisiones"></div>
      </section>
      <section class="bloque">
        <h3>Documentos vinculados <button id="btnNuevoDocumento" class="boton btn-mini">+ Documento</button></h3>
        <div class="lista" id="listaDocumentos"></div>
      </section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("cerrada") !== -1 || texto.indexOf("cancel") !== -1 || texto.indexOf("bloque") !== -1) return "badge-bloqueado";
        if (texto.indexOf("resuelta") !== -1 || texto.indexOf("activ") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'INCIDENCIA', ID_REGISTRO);
      }

      function editarEntidadContexto_(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).seleccionarYAbrirEdicion(entidad, id);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      /*
       * Cadena de contexto (ver conversacion -- misma idea que la miga
       * de pan del Gantt): cada nivel presente (Campaña/Proyecto/
       * Producto/Proceso/Tarea, todos opcionales/encadenados en el
       * formulario de Incidencia) se muestra como enlace clicable a su
       * edicion directa, sin abrir una ficha nueva para cada uno.
       */
      function renderCadenaContexto_(c) {
        /*
         * Etiqueta de tipo delante de cada nombre (ver conversacion --
         * con un solo nivel presente no habia forma de saber si era una
         * campaña, un proyecto, etc.; ademas NIVEL_INCIDENCIA es un
         * catalogo de texto libre aparte que puede no coincidir con lo
         * realmente enlazado aqui, asi que la etiqueta explicita evita
         * la ambigüedad en vez de depender del orden de la cadena).
         */
        var niveles = [
          { entidad: 'CAMPANA', etiqueta: 'Campaña', id: c.campanaId, nombre: c.campanaNombre },
          { entidad: 'PROYECTO', etiqueta: 'Proyecto', id: c.proyectoId, nombre: c.proyectoNombre },
          { entidad: 'PRODUCTO', etiqueta: 'Producto', id: c.productoId, nombre: c.productoNombre },
          { entidad: 'PROCESO', etiqueta: 'Proceso', id: c.procesoId, nombre: c.procesoNombre },
          { entidad: 'TAREA', etiqueta: 'Tarea', id: c.tareaId, nombre: c.tareaNombre }
        ].filter(function (n) { return n.id; });

        if (niveles.length === 0) return '<span class="detalle-secundario">Sin contexto jerárquico vinculado.</span>';

        return niveles.map(function (n, indice) {
          var enlace = '<span class="detalle-secundario">' + n.etiqueta + ':</span> <span class="enlace-mini" onclick="editarEntidadContexto_(\'' + n.entidad + '\',\'' + escapeHtml(n.id) + '\')">' + escapeHtml(n.nombre) + '</span>';
          return indice > 0 ? '<span class="separador">›</span>' + enlace : enlace;
        }).join('');
      }

      /*
       * Cambio de estado de un clic (ver conversacion -- "que cambiar el
       * estado sea un clic, ya sea por formulario o por la ficha"):
       * evita reabrir el formulario completo solo para mover el ESTADO.
       * Dispara las mismas reglas de negocio que guardarFormulario
       * (Incidencia aprobada -> Tarea) via cambiarEstadoIncidenciaRapido_
       * en el servidor, a diferencia de un cambio de celda directo.
       */
      function cambiarEstadoRapido_(nuevoEstado) {
        google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).cambiarEstadoIncidenciaDesdeFicha(ID_REGISTRO, nuevoEstado);
      }

      function renderSelectorEstadoRapido_(estadoActual, opcionesEstado) {
        var select = document.getElementById("selectorEstadoRapido");
        select.innerHTML = opcionesEstado.map(function (o) {
          return '<option value="' + escapeHtml(o) + '"' + (o === estadoActual ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
        }).join("");
        select.onchange = function () { cambiarEstadoRapido_(select.value); };
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var inc = datos.incidencia;
        document.getElementById("tituloIncidencia").innerHTML = escapeHtml(inc.TITULO) + renderBadge_(inc.ESTADO);
        renderSelectorEstadoRapido_(inc.ESTADO, datos.opcionesEstado);
        document.getElementById("detalleIncidencia").textContent =
          inc.ID + (inc.TIPO ? " · " + inc.TIPO : "") +
          (inc.PRIORIDAD ? " · Prioridad: " + inc.PRIORIDAD : "") +
          (inc.NIVEL_INCIDENCIA ? " · Nivel: " + inc.NIVEL_INCIDENCIA : "") +
          (inc.ACCION_CORRECTORA ? " · Acción correctora: " + inc.ACCION_CORRECTORA : "") +
          (inc.FECHA_RESOLUCION ? " · Resuelta: " + new Date(inc.FECHA_RESOLUCION).toLocaleDateString() : "");

        document.getElementById("cadenaContexto").innerHTML = renderCadenaContexto_(datos.contexto);

        document.getElementById("listaDocumentos").innerHTML = datos.documentos.length
          ? datos.documentos.map(function (d) {
              return filaHtml_(escapeHtml(d.titulo) + (d.tipo ? ' <span class="detalle-secundario">— ' + escapeHtml(d.tipo) + '</span>' : '') + renderBadge_(d.estado), 'DOCUMENTO', d.id);
            }).join("")
          : '<div class="vacio-bloque">Sin documentos vinculados todavía.</div>';

        /*
         * Decisiones vinculadas (ver conversacion -- relacion Incidencia-
         * Decision-Tarea): via VINCULO generico, editar() abre la
         * decision con retorno a esta ficha igual que los documentos.
         */
        document.getElementById("listaDecisiones").innerHTML = datos.decisionesVinculadas.length
          ? datos.decisionesVinculadas.map(function (v) {
              return filaHtml_(escapeHtml(v.nombre) + (v.tipoVinculo ? ' <span class="detalle-secundario">— ' + escapeHtml(v.tipoVinculo) + '</span>' : '') + renderBadge_(v.estado), 'DECISION', v.id);
            }).join("")
          : '<div class="vacio-bloque">Sin decisiones vinculadas todavía.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("INCIDENCIA", inc.ID); });
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaIncidenciaCSV(inc.ID);
        });
        document.getElementById("btnNuevoDocumento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDocumentoParaIncidencia(inc.ID);
        });
        document.getElementById("btnNuevaDecision").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearVinculoADecisionParaIncidencia(inc.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaIncidencia(ID_REGISTRO);
    </script>
  </body>
</html>
