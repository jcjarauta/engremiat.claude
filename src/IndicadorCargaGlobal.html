<div id="capaCargandoGlobal_" class="campo-oculto overlay-fondo">
  <div class="overlay-caja" style="max-width:none; width:auto; display:flex; align-items:center; gap:10px; padding:14px 20px;">
    <span class="spinner-carga-global_"></span>
    <span>Procesando…</span>
  </div>
</div>
<style>
  .spinner-carga-global_ {
    width: 16px; height: 16px; flex: none;
    border: 2px solid var(--color-borde); border-top-color: var(--color-primario);
    border-radius: 50%; animation: girarCapaCargandoGlobal_ .8s linear infinite;
  }
  @keyframes girarCapaCargandoGlobal_ { to { transform: rotate(360deg); } }
</style>
<script>
  /*
   * Indicador de "clic ejecutandose" para TODOS los dialogos (ver
   * conversacion -- "de que forma podriamos informar al operador que
   * se esta ejecutando un clic, como un modal"). Cobertura automatica:
   * en vez de anadir mostrarCargando()/ocultarCargando() a mano en cada
   * boton de cada Ficha/Formulario/Panel, se engancha AQUI una sola vez
   * sobre el propio google.script.run.
   *
   * v158 enganchaba TODAS las llamadas (incluidas las que solo hacen
   * ".withFailureHandler(fn).abrirX()" para abrir otro dialogo/sidebar
   * sin esperar datos de vuelta) forzando SIEMPRE un withSuccessHandler
   * propio sobre el runner base, aunque el sitio nunca hubiera pedido
   * uno. Eso rompio en vivo (ver conversacion -- "Personas y equipo" y
   * "Mapa del sheet" se quedaban colgados en "Procesando...") las
   * llamadas que abren un SIDEBAR (showSidebar, p.ej. abrirPanelPersonas)
   * o un dialogo (showModelessDialog): Apps Script trata de forma
   * especial esas respuestas sin webhook de exito registrado por el
   * propio sitio, y forzar uno ahi rompe ese mecanismo interno.
   *
   * v160 ya NO toca nunca esas cadenas: si el sitio no registra su
   * propio withSuccessHandler, esta capa se queda TOTALMENTE al margen
   * (ni siquiera se envuelve withFailureHandler) -- exactamente el
   * comportamiento de antes de que existiera este fichero. Solo se
   * activa para cadenas que EMPIEZAN con ".withSuccessHandler(...)"
   * (el patron real de "traer datos para pintar esta misma pantalla":
   * obtenerFicha/obtenerEsquema/guardar/buscar/etc.), que es donde el
   * indicador aporta y donde no hay swap de sidebar/dialogo de por
   * medio.
   */
  (function () {
    if (typeof window.google === "undefined" || !google.script || !google.script.run) return;
    if (window.__capaCargandoGlobalInstalada_) return;
    window.__capaCargandoGlobalInstalada_ = true;

    var banderaDentroDeClic_ = false;
    document.addEventListener("click", function () {
      banderaDentroDeClic_ = true;
      setTimeout(function () { banderaDentroDeClic_ = false; }, 0);
    }, true);

    var contadorLlamadasEnCurso_ = 0;
    function actualizarCapa_() {
      var capa = document.getElementById("capaCargandoGlobal_");
      if (!capa) return;
      if (contadorLlamadasEnCurso_ > 0) capa.classList.remove("campo-oculto");
      else capa.classList.add("campo-oculto");
    }
    function marcarInicioLlamada_() {
      contadorLlamadasEnCurso_++;
      actualizarCapa_();
    }
    function marcarFinLlamada_() {
      contadorLlamadasEnCurso_ = Math.max(0, contadorLlamadasEnCurso_ - 1);
      actualizarCapa_();
    }

    var runOriginal_ = google.script.run;

    /*
     * Envuelve el runner SOLO despues de que el propio sitio haya
     * llamado a withSuccessHandler (marcado=true a partir de ahi).
     * Antes de eso, withFailureHandler y la llamada dinamica final se
     * devuelven SIN TOCAR -- ligados directamente al runner real, sin
     * ningun Proxy de por medio.
     */
    function envolverRunner_(runner, seMarcoInicio) {
      return new Proxy(runner, {
        get: function (objetivo, propiedad) {
          var original = objetivo[propiedad];
          if (typeof original !== "function") return original;

          if (propiedad === "withSuccessHandler" || propiedad === "withFailureHandler") {
            return function (callback) {
              var combinado = function () {
                if (seMarcoInicio) marcarFinLlamada_();
                if (typeof callback === "function") callback.apply(this, arguments);
              };
              return envolverRunner_(original.call(objetivo, combinado), seMarcoInicio);
            };
          }

          return function () {
            if (seMarcoInicio && banderaDentroDeClic_) marcarInicioLlamada_();
            return original.apply(objetivo, arguments);
          };
        }
      });
    }

    Object.defineProperty(google.script, "run", {
      configurable: true,
      get: function () {
        return new Proxy(runOriginal_, {
          get: function (objetivo, propiedad) {
            var original = objetivo[propiedad];
            if (typeof original !== "function") return original;

            if (propiedad === "withSuccessHandler") {
              return function (callback) {
                var combinado = function () {
                  marcarFinLlamada_();
                  if (typeof callback === "function") callback.apply(this, arguments);
                };
                return envolverRunner_(original.call(objetivo, combinado), true);
              };
            }

            /*
             * Cualquier otra propiedad (withFailureHandler sin exito
             * previo, o el nombre de metodo dinamico directamente) se
             * devuelve atada al runner real, sin envolver -- pasa de
             * largo exactamente como si esta capa no existiera.
             */
            return original.bind(objetivo);
          }
        });
      }
    });
  })();
</script>
