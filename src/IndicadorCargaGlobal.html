<div id="capaCargandoGlobal_" class="campo-oculto overlay-fondo">
  <div class="overlay-caja" style="max-width:none; width:auto; display:flex; align-items:center; gap:10px; padding:14px 20px;">
    <span class="spinner-carga-global_"></span>
    <span>Procesando…</span>
  </div>
</div>
<style>
  .spinner-carga-global_ {
    width: 16px; height: 16px; flex: none;
    border: 2px solid var(--color-borde); border-top-color: var(--color-primario);
    border-radius: 50%; animation: girarCapaCargandoGlobal_ .8s linear infinite;
  }
  @keyframes girarCapaCargandoGlobal_ { to { transform: rotate(360deg); } }
</style>
<script>
  /*
   * Indicador de "clic ejecutandose" para TODOS los dialogos (ver
   * conversacion -- "de que forma podriamos informar al operador que
   * se esta ejecutando un clic, como un modal"). Cobertura automatica:
   * en vez de anadir mostrarCargando()/ocultarCargando() a mano en cada
   * boton de cada Ficha/Formulario/Panel (habria que tocar decenas de
   * sitios y mantenerlo en cada uno nuevo), se engancha AQUI una sola
   * vez sobre el propio google.script.run -- cualquier llamada al
   * servidor lanzada DESDE UN CLIC, la lance quien la lance, muestra la
   * capa al empezar y la oculta sola en exito o error.
   *
   * Ver conversacion -- hallazgo real al probar "Mapa del sheet": ese
   * dialogo dispara solo, al abrirse (sin ningun clic), una llamada de
   * fondo para la "Actividad reciente"; si esa llamada tarda, la
   * primera version de esto tapaba el dialogo ENTERO con la capa aunque
   * el usuario no hubiera pulsado nada -- "no consigue cargar" era en
   * realidad el propio indicador bloqueando lo que antes SI se veia
   * (el resto de tarjetas, ya pintadas, seguian ahi debajo). Se limita
   * la capa a llamadas que arrancan dentro de un manejador de clic
   * (banderaDentroDeClic_, activada en la fase de captura ANTES de que
   * corra el onclick del boton, y desactivada en cuanto ese turno de
   * evento termina) -- las cargas automaticas de fondo vuelven a ser
   * silenciosas, como antes de este cambio.
   *
   * Segundo hallazgo (revision propia antes de publicar): con un
   * contador binario, si dos llamadas se solapan (dos clics rapidos, o
   * un clic mientras algo de fondo seguia en vuelo) la que termina
   * PRIMERO ocultaba la capa aunque la otra siguiera pendiente.
   * contadorLlamadasEnCurso_ lo evita -- solo se oculta cuando llega a
   * cero.
   */
  (function () {
    if (typeof window.google === "undefined" || !google.script || !google.script.run) return;
    if (window.__capaCargandoGlobalInstalada_) return;
    window.__capaCargandoGlobalInstalada_ = true;

    var banderaDentroDeClic_ = false;
    document.addEventListener("click", function () {
      banderaDentroDeClic_ = true;
      setTimeout(function () { banderaDentroDeClic_ = false; }, 0);
    }, true);

    var contadorLlamadasEnCurso_ = 0;
    function actualizarCapa_() {
      var capa = document.getElementById("capaCargandoGlobal_");
      if (!capa) return;
      if (contadorLlamadasEnCurso_ > 0) capa.classList.remove("campo-oculto");
      else capa.classList.add("campo-oculto");
    }
    function marcarInicioLlamada_() {
      contadorLlamadasEnCurso_++;
      actualizarCapa_();
    }
    function marcarFinLlamada_() {
      contadorLlamadasEnCurso_ = Math.max(0, contadorLlamadasEnCurso_ - 1);
      actualizarCapa_();
    }

    var runOriginal_ = google.script.run;

    /*
     * seMarcoInicio se decide UNA sola vez por cadena, en el momento en
     * que se lee "google.script.run" (sincronico con el clic, si lo
     * hay) -- y esa MISMA decision se reutiliza tanto para contar el
     * inicio (al llamar al metodo dinamico) como el fin (en los
     * handlers), en vez de volver a mirar la bandera en cada paso, que
     * podria haber cambiado de valor entre medias.
     */
    function envolverRunner_(runner, seMarcoInicio) {
      return new Proxy(runner, {
        get: function (objetivo, propiedad) {
          var original = objetivo[propiedad];
          if (typeof original !== "function") return original;

          if (propiedad === "withSuccessHandler" || propiedad === "withFailureHandler") {
            return function (callback) {
              var combinado = function () {
                if (seMarcoInicio) marcarFinLlamada_();
                if (typeof callback === "function") callback.apply(this, arguments);
              };
              return envolverRunner_(original.call(objetivo, combinado), seMarcoInicio);
            };
          }

          return function () {
            if (seMarcoInicio) marcarInicioLlamada_();
            return original.apply(objetivo, arguments);
          };
        }
      });
    }

    Object.defineProperty(google.script, "run", {
      configurable: true,
      get: function () {
        var seMarcoInicio_ = banderaDentroDeClic_;
        var runnerConDefectos_ = runOriginal_
          .withSuccessHandler(function () { if (seMarcoInicio_) marcarFinLlamada_(); })
          .withFailureHandler(function () { if (seMarcoInicio_) marcarFinLlamada_(); });
        return envolverRunner_(runnerConDefectos_, seMarcoInicio_);
      }
    });
  })();
</script>
