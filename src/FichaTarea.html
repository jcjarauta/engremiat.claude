<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Ficha de tarea</title>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      body { font-size: 14px; }
      .cabecera-ficha { margin-bottom: 14px; }
      .cabecera-ficha h2 { margin: 0 0 4px 0; font-size: 18px; }
      .cabecera-ficha .detalle { color: var(--color-texto-secundario); font-size: 13px; }
      .cabecera-ficha .acciones { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      section.bloque { margin-bottom: 16px; }
      section.bloque h3 { font-size: 14px; margin: 0 0 6px 0; display: flex; align-items: center; justify-content: space-between; }
      .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--color-borde); }
      .fila:last-child { border-bottom: none; }
      .fila .info { font-size: 13px; }
      .fila .info .detalle-secundario { color: var(--color-texto-secundario); }
      .miniatura-documento { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 6px; }
      .btn-mini { font-size: 13px; padding: 5px 9px; }
      .badge { font-size: 12px; padding: 2px 9px; }
      .badge-completado { background: #e6f4ea; color: var(--color-exito); }
      .badge-bloqueado { background: var(--color-peligro-fondo); color: var(--color-peligro); }
      .badge-neutro { background: var(--color-fondo-suave); color: var(--color-texto); }
      .vacio-bloque { color: var(--color-texto-secundario); font-style: italic; font-size: 13px; padding: 4px; }
      .resumen-avance { display: flex; gap: 14px; flex-wrap: wrap; background: var(--color-fondo-suave); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
      .resumen-avance .dato { display: flex; flex-direction: column; }
      .resumen-avance .dato .valor { font-size: 16px; font-weight: bold; }
      .resumen-avance .dato .etiqueta { color: var(--color-texto-secundario); font-size: 11px; }
      #estadoCarga { padding: 12px 4px; }
    </style>
  </head>
  <body>
    <div id="estadoCarga" class="vacio">Cargando...</div>
    <div id="contenido" style="display:none;">
      <div class="cabecera-ficha">
        <h2 id="nombreTarea"></h2>
        <div class="detalle" id="detalleTarea"></div>
        <div class="acciones">
          <button id="btnEditarDatos" class="boton btn-mini">Editar datos</button>
          <button id="btnVerFichaProceso" class="boton btn-mini">Ver ficha de proceso</button>
          <button id="btnVerPanel" class="boton btn-mini" style="display:none;">Ver panel de campaña</button>
          <button id="btnExportarCsv" class="boton btn-mini">Exportar CSV</button>
        </div>
      </div>

      <div class="resumen-avance" id="resumenAvance"></div>

      <section class="bloque">
        <h3>Responsables <button id="btnNuevoResponsable" class="boton btn-mini">+ Responsable</button></h3>
        <div class="lista" id="listaResponsables"></div>
      </section>
      <section class="bloque">
        <h3>Recursos <button id="btnNuevoRecurso" class="boton btn-mini">+ Recurso</button></h3>
        <div class="lista" id="listaRecursos"></div>
      </section>
      <section class="bloque">
        <h3>Materiales <button id="btnNuevoMaterial" class="boton btn-mini">+ Material</button></h3>
        <div class="lista" id="listaMateriales"></div>
      </section>
      <section class="bloque">
        <h3>Ejecución <button id="btnNuevaEjecucion" class="boton btn-mini">+ Registrar</button></h3>
        <div class="lista" id="listaEjecuciones"></div>
      </section>
      <section class="bloque">
        <h3>Incidencias <button id="btnNuevaIncidencia" class="boton btn-mini">+ Incidencia</button></h3>
        <div class="lista" id="listaIncidencias"></div>
      </section>
      <section class="bloque">
        <h3>Documentos <button id="btnNuevoDocumento" class="boton btn-mini">+ Documento</button></h3>
        <div class="lista" id="listaDocumentos"></div>
      </section>
    </div>

    <script>
      var ID_REGISTRO = <?!= JSON.stringify(idRegistro) ?>;

      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function claseBadgeEstado_(estado) {
        var texto = String(estado || "").toLowerCase();
        if (texto.indexOf("inactiv") !== -1 || texto.indexOf("no dispon") !== -1 || texto.indexOf("bloque") !== -1 || texto.indexOf("cancel") !== -1 || texto.indexOf("rechaz") !== -1) return "badge-bloqueado";
        if (texto.indexOf("activ") !== -1) return "badge-completado";
        if (texto.indexOf("complet") !== -1 || texto.indexOf("aprob") !== -1 || texto.indexOf("termin") !== -1) return "badge-completado";
        return "badge-neutro";
      }

      function renderBadge_(estado) {
        if (!estado) return "";
        return ' <span class="badge ' + claseBadgeEstado_(estado) + '">' + escapeHtml(estado) + '</span>';
      }

      function editar(entidad, id) {
        google.script.run.withFailureHandler(mostrarError).abrirEdicionConRetornoAFicha(entidad, id, 'TAREA', ID_REGISTRO);
      }

      function mostrarError(error) {
        document.getElementById("estadoCarga").textContent = "Error: " + (error && error.message ? error.message : error);
        document.getElementById("estadoCarga").style.display = "block";
        document.getElementById("contenido").style.display = "none";
      }

      function filaHtml_(infoHtml, entidadEditar, idEditar) {
        return '<div class="fila"><span class="info">' + infoHtml + '</span>' +
          '<button class="boton btn-mini" onclick="editar(\'' + entidadEditar + '\',\'' + idEditar + '\')">Editar</button></div>';
      }

      function extraerIdDrive_(url) {
        if (!url) return null;
        var m = String(url).match(/\/d\/([a-zA-Z0-9_-]{10,})/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
        return m ? m[1] : null;
      }

      function filaDocumentoHtml_(d) {
        var idDrive = d.tipo === 'Imagen' ? extraerIdDrive_(d.url) : null;
        var miniatura = idDrive ? '<img class="miniatura-documento" src="https://drive.google.com/thumbnail?id=' + idDrive + '&sz=w96" alt="">' : '';
        var info = miniatura + escapeHtml(d.titulo) + (d.tipo ? ' <span class="detalle-secundario">— ' + escapeHtml(d.tipo) + '</span>' : '') + renderBadge_(d.estado);
        return filaHtml_(info, 'DOCUMENTO', d.id);
      }

      function render(datos) {
        document.getElementById("estadoCarga").style.display = "none";
        document.getElementById("contenido").style.display = "block";

        var t = datos.tarea;
        document.getElementById("nombreTarea").innerHTML = escapeHtml(t.NOMBRE) + renderBadge_(t.ESTADO);
        document.getElementById("detalleTarea").textContent =
          t.ID +
          (datos.procesoNombre ? " · " + datos.procesoNombre : "") +
          (datos.productoNombre ? " · " + datos.productoNombre : "") +
          (datos.proyectoNombre ? " · " + datos.proyectoNombre : "");

        document.getElementById("resumenAvance").innerHTML =
          '<div class="dato"><span class="valor">' + (t.PORCENTAJE_AVANCE === "" || t.PORCENTAJE_AVANCE === undefined || t.PORCENTAJE_AVANCE === null ? '—' : t.PORCENTAJE_AVANCE + '%') + '</span><span class="etiqueta">avance</span></div>' +
          '<div class="dato"><span class="valor">' + (datos.diasDesviacionFin === null ? '—' : datos.diasDesviacionFin) + '</span><span class="etiqueta">desviación (días)</span></div>' +
          '<div class="dato"><span class="valor">' + (datos.diasRiesgo === null ? 'No' : 'Sí') + '</span><span class="etiqueta">en riesgo (plazo vencido, sin terminar)</span></div>';

        document.getElementById("listaResponsables").innerHTML = datos.responsables.length
          ? datos.responsables.map(function (r) {
              return filaHtml_(
                escapeHtml(r.personaNombre) +
                (r.rol ? ' <span class="detalle-secundario">— ' + escapeHtml(r.rol) + '</span>' : '') +
                (r.porcentajeDedicacion ? ' <span class="detalle-secundario">(' + escapeHtml(r.porcentajeDedicacion) + '%)</span>' : '') +
                renderBadge_(r.estado),
                'TAREA_RESPONSABLE', r.relacionId
              );
            }).join("")
          : '<div class="vacio-bloque">Sin responsables asignados.</div>';

        document.getElementById("listaRecursos").innerHTML = datos.recursos.length
          ? datos.recursos.map(function (r) {
              return filaHtml_(
                escapeHtml(r.recursoNombre) + (r.tipoUso ? ' <span class="detalle-secundario">— ' + escapeHtml(r.tipoUso) + '</span>' : '') + renderBadge_(r.estado),
                'TAREA_RECURSO', r.relacionId
              );
            }).join("")
          : '<div class="vacio-bloque">Sin recursos asignados.</div>';

        document.getElementById("listaMateriales").innerHTML = datos.materiales.length
          ? datos.materiales.map(function (m) {
              return filaHtml_(
                escapeHtml(m.materialNombre) +
                (m.cantidadPrevista ? ' <span class="detalle-secundario">(' + escapeHtml(m.cantidadPrevista) + (m.unidad ? ' ' + escapeHtml(m.unidad) : '') + ')</span>' : '') +
                renderBadge_(m.estado),
                'TAREA_MATERIAL', m.relacionId
              );
            }).join("")
          : '<div class="vacio-bloque">Sin materiales asociados.</div>';

        document.getElementById("listaEjecuciones").innerHTML = datos.ejecuciones.length
          ? datos.ejecuciones.map(function (e) {
              return filaHtml_(
                escapeHtml(e.responsableNombre || e.id) + (e.resultado ? ' <span class="detalle-secundario">— ' + escapeHtml(e.resultado) + '</span>' : '') + renderBadge_(e.estado),
                'EJECUCION_TAREA', e.id
              );
            }).join("")
          : '<div class="vacio-bloque">Sin ejecuciones registradas.</div>';

        document.getElementById("listaIncidencias").innerHTML = datos.incidencias.length
          ? datos.incidencias.map(function (i) {
              return filaHtml_(escapeHtml(i.titulo) + renderBadge_(i.estado), 'INCIDENCIA', i.id);
            }).join("")
          : '<div class="vacio-bloque">Sin incidencias registradas.</div>';

        document.getElementById("listaDocumentos").innerHTML = datos.documentos.length
          ? datos.documentos.map(filaDocumentoHtml_).join("")
          : '<div class="vacio-bloque">Sin documentos adjuntos.</div>';

        document.getElementById("btnEditarDatos").addEventListener("click", function () { editar("TAREA", t.ID); });
        document.getElementById("btnVerFichaProceso").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFichaProceso(datos.procesoId);
        });
        if (datos.campanaId) {
          var btnPanel = document.getElementById("btnVerPanel");
          btnPanel.style.display = "";
          btnPanel.addEventListener("click", function () {
            google.script.run.withFailureHandler(mostrarError).abrirPanelCampanaEnCampana(datos.campanaId);
          });
        }
        document.getElementById("btnExportarCsv").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarFichaTareaCSV(t.ID);
        });
        document.getElementById("btnNuevoResponsable").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaResponsableParaTarea(t.ID);
        });
        document.getElementById("btnNuevoRecurso").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaRecursoParaTarea(t.ID);
        });
        document.getElementById("btnNuevoMaterial").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearTareaMaterialParaTarea(t.ID);
        });
        document.getElementById("btnNuevaEjecucion").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearEjecucionTareaParaTarea(t.ID);
        });
        document.getElementById("btnNuevaIncidencia").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearIncidenciaParaTarea(datos.campanaId, datos.proyectoId, datos.productoId, datos.procesoId, t.ID);
        });
        document.getElementById("btnNuevoDocumento").addEventListener("click", function () {
          google.script.run.withFailureHandler(mostrarError).abrirFormularioCrearDocumentoParaTarea(t.ID);
        });
      }

      google.script.run.withSuccessHandler(render).withFailureHandler(mostrarError).obtenerFichaTarea(ID_REGISTRO);
    </script>
  </body>
</html>
