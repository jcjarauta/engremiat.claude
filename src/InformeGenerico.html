<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Estilos') ?>
    <style>
      select, button { width: 100%; margin-top: 4px; padding: 5px; box-sizing: border-box; }
      button { margin-top: 12px; cursor: pointer; }
      .seccion { margin-top: 16px; border-top: 1px solid var(--color-borde); padding-top: 10px; }
      .item { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
      .item.alerta { color: var(--color-peligro); }
      #resultado { display: none; }
    </style>
  </head>
  <body>
    <h3>Informes</h3>

    <label for="tipo">Tipo de informe</label>
    <select id="tipo">
      <option value="CAMPANA">Informe de campaña</option>
      <option value="PROYECTO">Informe de proyecto</option>
      <option value="MEMORIA">Memoria de producción</option>
      <option value="DESVIACION">Desviación de planificación</option>
      <option value="CALIDAD_PLANIFICACION">Calidad de planificación</option>
      <option value="JUSTIFICACION_ECONOMICA">Justificación económica</option>
      <option value="EVIDENCIA_SOCIAL">Evidencia de impacto (Por qué)</option>
    </select>

    <div id="contenedor-nivel" style="display:none;">
      <label for="nivel-economico">Nivel</label>
      <select id="nivel-economico">
        <option value="Campaña">Campaña</option>
        <option value="Proyecto">Proyecto</option>
        <option value="Producto">Producto</option>
      </select>
    </div>

    <div id="contenedor-registro">
      <label for="registro">Registro</label>
      <select id="registro"></select>
    </div>

    <button id="btn-generar">Generar informe</button>
    <button id="btn-exportar-csv" disabled>Exportar CSV</button>
    <button id="btn-exportar-pdf" disabled>Exportar PDF</button>

    <div id="estado-carga"></div>

    <div id="resultado">
      <div class="seccion">
        <h4>Resumen por estado</h4>
        <div id="resumen"></div>
      </div>
      <div class="seccion">
        <h4>Tareas retrasadas</h4>
        <div id="tareas-retrasadas"></div>
      </div>
      <div class="seccion">
        <h4>Decisiones pendientes</h4>
        <div id="decisiones-pendientes"></div>
      </div>
      <div class="seccion">
        <h4>Incidencias abiertas</h4>
        <div id="incidencias-abiertas"></div>
      </div>
      <div class="seccion" id="seccion-desviacion">
        <h4>Desviación de planificación (real vs. plan)</h4>
        <div id="desviacion-planificacion"></div>
      </div>
      <div class="seccion" id="seccion-calidad" style="display:none;">
        <h4>Calidad de planificación</h4>
        <div id="calidad-planificacion"></div>
      </div>
      <div class="seccion" id="seccion-justificacion" style="display:none;">
        <h4>Justificación económica</h4>
        <div id="justificacion-economica"></div>
      </div>
      <div class="seccion" id="seccion-evidencia" style="display:none;">
        <h4>Evidencia de impacto</h4>
        <div id="evidencia-social"></div>
      </div>
    </div>

    <script>
      function escapeHtml(texto) {
        if (texto === null || texto === undefined) return '';
        return String(texto)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderLista(idContenedor, lista, plantillaFn) {
        var contenedor = document.getElementById(idContenedor);
        if (!lista || lista.length === 0) {
          contenedor.innerHTML = '<div class="vacio">Ninguna.</div>';
          return;
        }
        contenedor.innerHTML = lista.map(plantillaFn).join('');
      }

      function renderResumenObjeto(conteo) {
        var claves = Object.keys(conteo || {});
        if (claves.length === 0) return '<div class="vacio">Sin registros.</div>';
        return claves.map(function (estado) {
          return '<div class="resumen-linea"><span>' + escapeHtml(estado) + '</span>' +
            '<span class="badge">' + conteo[estado] + '</span></div>';
        }).join('');
      }

      /*
       * Justificación económica (Fase 3, ver conversación): a diferencia
       * de los demás tipos (un solo registro), aquí hace falta elegir
       * primero el NIVEL (Campaña/Proyecto/Producto) y luego el registro
       * dependiente de ese nivel -- obtenerOpcionesRegistroPorNivel
       * (CosteService.js) resuelve cualquiera de los 3 con el mismo
       * mapa ENTIDAD_DOCUMENTO_A_MVP ya usado en el resto del sistema.
       */
      function cargarOpcionesRegistroPorNivel_() {
        var nivel = document.getElementById('nivel-economico').value;
        var select = document.getElementById('registro');
        select.innerHTML = '<option>Cargando...</option>';
        google.script.run
          .withSuccessHandler(function (opciones) {
            select.innerHTML = opciones.map(function (op) {
              return '<option value="' + escapeHtml(op.id) + '">' + escapeHtml(op.etiqueta) + '</option>';
            }).join('');
          })
          .withFailureHandler(mostrarError)
          .obtenerOpcionesRegistroPorNivel(nivel);
      }

      function cargarOpcionesRegistro() {
        var tipo = document.getElementById('tipo').value;
        var contenedorNivel = document.getElementById('contenedor-nivel');
        var contenedorRegistro = document.getElementById('contenedor-registro');
        var select = document.getElementById('registro');

        if (tipo === 'MEMORIA' || tipo === 'DESVIACION' || tipo === 'CALIDAD_PLANIFICACION') {
          contenedorNivel.style.display = 'none';
          contenedorRegistro.style.display = 'none';
          return;
        }

        if (tipo === 'JUSTIFICACION_ECONOMICA' || tipo === 'EVIDENCIA_SOCIAL') {
          contenedorNivel.style.display = 'block';
          contenedorRegistro.style.display = 'block';
          cargarOpcionesRegistroPorNivel_();
          return;
        }

        contenedorNivel.style.display = 'none';
        contenedorRegistro.style.display = 'block';
        select.innerHTML = '<option>Cargando...</option>';
        google.script.run
          .withSuccessHandler(function (opciones) {
            select.innerHTML = opciones.map(function (op) {
              return '<option value="' + escapeHtml(op.id) + '">' + escapeHtml(op.etiqueta) + '</option>';
            }).join('');
          })
          .withFailureHandler(mostrarError)
          .obtenerOpcionesInforme(tipo);
      }

      var UMBRAL_ALERTA_DESVIACION_DIAS = 2;

      function renderDesviacionAgregada_(lista) {
        if (!lista || lista.length === 0) return '<div class="vacio">Sin datos.</div>';
        return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Grupo</th><th>Casos</th><th>Media (días)</th><th>Máxima (días)</th><th>Con retraso</th></tr>' +
          lista.map(function (g) {
            var alerta = g.diasDesviacionMedia > UMBRAL_ALERTA_DESVIACION_DIAS;
            var estiloFila = alerta ? ' style="background:#fdecea;color:#b00020;"' : '';
            return '<tr' + estiloFila + '><td>' + escapeHtml(g.grupo) + '</td><td style="text-align:center;">' + g.casos + '</td>' +
              '<td style="text-align:center;">' + g.diasDesviacionMedia + (alerta ? ' ⚠' : '') + '</td>' +
              '<td style="text-align:center;">' + g.diasDesviacionMaxima + '</td>' +
              '<td style="text-align:center;">' + g.casosConRetraso + '</td></tr>';
          }).join('') + '</table>';
      }

      function renderDesviacion(bloque) {
        var contenedor = document.getElementById('desviacion-planificacion');
        if (!bloque) { contenedor.innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
        var bloqueCampana = bloque.procesosPorCampana
          ? '<p style="margin-bottom:2px;margin-top:8px;"><strong>Procesos por campaña</strong></p>' +
            renderDesviacionAgregada_(bloque.procesosPorCampana)
          : '';
        contenedor.innerHTML =
          '<div class="resumen-linea"><span>Procesos medidos</span><span class="badge">' + bloque.procesosMedidos + '</span></div>' +
          '<div class="resumen-linea"><span>Tareas medidas</span><span class="badge">' + bloque.tareasMedidas + '</span></div>' +
          bloqueCampana +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Procesos por fase de producción</strong></p>' +
          renderDesviacionAgregada_(bloque.procesosPorFase) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Procesos por responsable</strong></p>' +
          renderDesviacionAgregada_(bloque.procesosPorResponsable) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Tareas por responsable</strong></p>' +
          renderDesviacionAgregada_(bloque.tareasPorResponsable);
      }

      /*
       * N3.4 (ver conversacion -- "Informe de calidad de planificación",
       * cierra el bloque N3): añade lo que faltaba en Desviación -- %
       * a tiempo, desviación por recurso y utilización del horario
       * declarado por responsable. Reutiliza renderDesviacionAgregada_
       * para las tablas de grupo, mismo lenguaje visual que el resto.
       */
      function renderUtilizacionHorario_(lista) {
        if (!lista || lista.length === 0) return '<div class="vacio">Sin datos de horario cargado para calcular utilización.</div>';
        return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Responsable</th><th>Días planificados</th><th>Días fuera de horario</th><th>Utilización</th></tr>' +
          lista.map(function (r) {
            var bajo = r.porcentajeUtilizacion !== null && r.porcentajeUtilizacion < 70;
            var estiloFila = bajo ? ' style="background:#fdecea;color:#b00020;"' : '';
            return '<tr' + estiloFila + '><td>' + escapeHtml(r.responsable) + '</td>' +
              '<td style="text-align:center;">' + r.diasPlanificados + '</td>' +
              '<td style="text-align:center;">' + r.diasFueraDeHorario + '</td>' +
              '<td style="text-align:center;">' + (r.porcentajeUtilizacion === null ? '—' : r.porcentajeUtilizacion + '%' + (bajo ? ' ⚠' : '')) + '</td></tr>';
          }).join('') + '</table>';
      }

      function renderCalidadPlanificacion_(informe) {
        var contenedor = document.getElementById('calidad-planificacion');
        contenedor.innerHTML =
          '<div class="resumen-linea"><span>Procesos a tiempo</span><span class="badge">' + (informe.porcentajeProcesosATiempo === null ? '—' : informe.porcentajeProcesosATiempo + '%') + '</span></div>' +
          '<div class="resumen-linea"><span>Tareas a tiempo</span><span class="badge">' + (informe.porcentajeTareasATiempo === null ? '—' : informe.porcentajeTareasATiempo + '%') + '</span></div>' +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Procesos por recurso usado</strong></p>' +
          renderDesviacionAgregada_(informe.procesosPorRecurso) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Utilización del horario declarado por responsable</strong></p>' +
          renderUtilizacionHorario_(informe.utilizacionHorarioPorResponsable);
      }

      /*
       * Fase 3 (ver conversación): presupuesto vs coste real por
       * categoría + fuentes de financiación, para el nivel elegido.
       */
      function renderCategoriasCoste_(categorias) {
        return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Categoría</th><th>Previsto (€)</th><th>Real (€)</th><th>Desviación (€)</th></tr>' +
          categorias.map(function (c) {
            var sobrepasado = c.desviacion > 0;
            var estiloFila = sobrepasado ? ' style="background:#fdecea;color:#b00020;"' : '';
            return '<tr' + estiloFila + '><td>' + escapeHtml(c.categoria) + '</td>' +
              '<td style="text-align:center;">' + c.previsto + '</td>' +
              '<td style="text-align:center;">' + c.real + '</td>' +
              '<td style="text-align:center;">' + (c.desviacion > 0 ? '+' : '') + c.desviacion + (sobrepasado ? ' ⚠' : '') + '</td></tr>';
          }).join('') + '</table>';
      }

      function renderFuentesFinanciacion_(fuentes) {
        if (!fuentes || fuentes.length === 0) return '<div class="vacio">Sin fuentes de financiación registradas.</div>';
        return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Nombre</th><th>Tipo</th><th>Importe (€)</th><th>Estado</th></tr>' +
          fuentes.map(function (f) {
            return '<tr><td>' + escapeHtml(f.nombre) + '</td><td>' + escapeHtml(f.tipo) + '</td>' +
              '<td style="text-align:center;">' + f.importe + '</td><td>' + escapeHtml(f.estado) + '</td></tr>';
          }).join('') + '</table>';
      }

      /*
       * Fase 4 (ver conversación): impacto social (personas voluntarias/
       * atendidas -- reutiliza los ROL ya existentes, sin dato nuevo) y
       * comparativa entre campañas (siempre todas, independiente del
       * nivel elegido en el selector de arriba).
       */
      function renderComparativaCampanas_(campanas) {
        if (!campanas || campanas.length === 0) return '<div class="vacio">Sin campañas activas.</div>';
        return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Campaña</th><th>Previsto (€)</th><th>Real (€)</th><th>Financiación</th><th>Voluntariado</th><th>Atendidas</th></tr>' +
          campanas.map(function (c) {
            return '<tr><td>' + escapeHtml(c.campanaNombre) + '</td>' +
              '<td style="text-align:center;">' + c.totalPrevisto + '</td>' +
              '<td style="text-align:center;">' + c.totalReal + '</td>' +
              '<td style="text-align:center;">' + (c.coberturaFinanciacion === null ? '—' : c.coberturaFinanciacion + '%') + '</td>' +
              '<td style="text-align:center;">' + c.personasVoluntariado + '</td>' +
              '<td style="text-align:center;">' + c.personasAtendidas + '</td></tr>';
          }).join('') + '</table>';
      }

      function renderJustificacionEconomica_(informe) {
        var contenedor = document.getElementById('justificacion-economica');
        var avisos = (informe.materialesSinPrecioReferencia || []).length > 0
          ? '<div class="item alerta">Materiales sin precio de referencia (no incluidos en el coste): ' +
            informe.materialesSinPrecioReferencia.map(function (m) { return escapeHtml(m.materialNombre); }).join(', ') + '</div>'
          : '';
        var impacto = informe.impactoSocial || { personasVoluntariado: 0, diasVoluntariado: 0, personasAtendidas: 0, diasPersonasAtendidas: 0 };

        contenedor.innerHTML =
          '<h4 style="margin-top:0;">' + escapeHtml(informe.entidadTipo) + ': ' + escapeHtml(informe.entidadNombre) + '</h4>' +
          '<div class="resumen-linea"><span>Total previsto</span><span class="badge">' + informe.totalPrevisto + ' €</span></div>' +
          '<div class="resumen-linea"><span>Total real</span><span class="badge">' + informe.totalReal + ' €</span></div>' +
          '<div class="resumen-linea"><span>Desviación</span><span class="badge">' + (informe.desviacionTotal > 0 ? '+' : '') + informe.desviacionTotal + ' €</span></div>' +
          '<div class="resumen-linea"><span>Financiación cubierta</span><span class="badge">' + (informe.coberturaFinanciacion === null ? '—' : informe.coberturaFinanciacion + '%') + '</span></div>' +
          avisos +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Por categoría</strong></p>' +
          renderCategoriasCoste_(informe.categorias) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Fuentes de financiación (total: ' + informe.totalFinanciacion + ' €)</strong></p>' +
          renderFuentesFinanciacion_(informe.fuentesFinanciacion) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Impacto social</strong></p>' +
          '<div class="resumen-linea"><span>Personas voluntarias</span><span class="badge">' + impacto.personasVoluntariado + ' (' + impacto.diasVoluntariado + ' días)</span></div>' +
          '<div class="resumen-linea"><span>Personas atendidas</span><span class="badge">' + impacto.personasAtendidas + ' (' + impacto.diasPersonasAtendidas + ' días)</span></div>' +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Comparativa entre campañas</strong></p>' +
          renderComparativaCampanas_(informe.comparativaCampanas);
      }

      /*
       * N6 (ver conversación -- eje "Por qué"): a diferencia de
       * justificación económica, aquí no hay comparativa entre
       * campañas ni desglose por categoría económica -- son 3 bloques
       * independientes: impacto social (mismo dato ya usado en el
       * informe económico, aquí como pieza propia), reutilización de
       * producto/proceso (proxy determinista vía MODO_USO, no
       * inventario de materiales físicos) y etiquetas de impacto
       * cualitativas (N6.1) agrupadas por categoría.
       */
      function renderEtiquetasImpacto_(etiquetas, porCategoria) {
        var resumenCategorias = Object.keys(porCategoria || {}).map(function (cat) {
          return '<div class="resumen-linea"><span>' + escapeHtml(cat) + '</span><span class="badge">' + porCategoria[cat] + '</span></div>';
        }).join('');
        if (!etiquetas || etiquetas.length === 0) {
          return resumenCategorias + '<div class="vacio">Sin etiquetas de impacto registradas todavía.</div>';
        }
        var lista = '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<tr><th style="text-align:left;">Categoría</th><th style="text-align:left;">Registro</th><th style="text-align:left;">Descripción</th></tr>' +
          etiquetas.map(function (e) {
            return '<tr><td>' + escapeHtml(e.categoria) + '</td><td>' + escapeHtml(e.entidadTipo) + ': ' + escapeHtml(e.entidadNombre) + '</td>' +
              '<td>' + escapeHtml(e.descripcion) + '</td></tr>';
          }).join('') + '</table>';
        return resumenCategorias + lista;
      }

      function renderReutilizacion_(reutilizacion) {
        var r = reutilizacion || { relacionesReutilizadas: [], procesosReutilizados: [], totalReutilizaciones: 0 };
        if (r.totalReutilizaciones === 0) return '<div class="vacio">Ninguna reutilización registrada (vía campo "Modo de uso").</div>';
        var filas = r.relacionesReutilizadas.map(function (rel) {
          return '<div class="item">Producto "' + escapeHtml(rel.productoNombre) + '" en proyecto "' + escapeHtml(rel.proyectoNombre) + '" — ' + escapeHtml(rel.modoUso) + '</div>';
        }).join('') + r.procesosReutilizados.map(function (p) {
          return '<div class="item">Proceso "' + escapeHtml(p.nombre) + '" (producto "' + escapeHtml(p.productoNombre) + '") — ' + escapeHtml(p.modoUso) + '</div>';
        }).join('');
        return filas;
      }

      function renderEvidenciaSocial_(informe) {
        var contenedor = document.getElementById('evidencia-social');
        var impacto = informe.impactoSocial || { personasVoluntariado: 0, diasVoluntariado: 0, personasAtendidas: 0, diasPersonasAtendidas: 0 };

        contenedor.innerHTML =
          '<h4 style="margin-top:0;">' + escapeHtml(informe.entidadTipo) + ': ' + escapeHtml(informe.entidadNombre) + '</h4>' +
          '<p style="margin-bottom:2px;"><strong>Impacto social (personas)</strong></p>' +
          '<div class="resumen-linea"><span>Personas voluntarias</span><span class="badge">' + impacto.personasVoluntariado + ' (' + impacto.diasVoluntariado + ' días)</span></div>' +
          '<div class="resumen-linea"><span>Personas atendidas</span><span class="badge">' + impacto.personasAtendidas + ' (' + impacto.diasPersonasAtendidas + ' días)</span></div>' +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Reutilización de producto/proceso</strong> <span style="font-weight:normal;color:var(--color-texto-secundario);">(proxy vía "Modo de uso", no inventario de materiales)</span></p>' +
          renderReutilizacion_(informe.reutilizacion) +
          '<p style="margin-bottom:2px;margin-top:8px;"><strong>Etiquetas de impacto</strong></p>' +
          renderEtiquetasImpacto_(informe.etiquetasImpacto, informe.etiquetasPorCategoria);
      }

      function renderInforme(informe) {
        if (!informe) {
          mostrarError({ message: 'El servidor no devolvio datos de informe (respuesta vacia). Prueba de nuevo; si persiste, puede deberse a una extension del navegador interfiriendo con la conexion.' });
          return;
        }

        document.getElementById('estado-carga').textContent = '';
        document.getElementById('resultado').style.display = 'block';

        var esInformeSinJerarquia = informe.tipo === 'DESVIACION' || informe.tipo === 'CALIDAD_PLANIFICACION' || informe.tipo === 'JUSTIFICACION_ECONOMICA' || informe.tipo === 'EVIDENCIA_SOCIAL';
        ['resumen', 'tareas-retrasadas', 'decisiones-pendientes', 'incidencias-abiertas'].forEach(function (id) {
          document.getElementById(id).closest('.seccion').style.display = esInformeSinJerarquia ? 'none' : '';
        });
        document.getElementById('seccion-desviacion').style.display = (informe.tipo === 'JUSTIFICACION_ECONOMICA' || informe.tipo === 'EVIDENCIA_SOCIAL') ? 'none' : '';
        if (informe.tipo !== 'JUSTIFICACION_ECONOMICA' && informe.tipo !== 'EVIDENCIA_SOCIAL') renderDesviacion(esInformeSinJerarquia ? informe : informe.desviacionPlanificacion);

        document.getElementById('seccion-calidad').style.display = informe.tipo === 'CALIDAD_PLANIFICACION' ? '' : 'none';
        if (informe.tipo === 'CALIDAD_PLANIFICACION') renderCalidadPlanificacion_(informe);

        document.getElementById('seccion-justificacion').style.display = informe.tipo === 'JUSTIFICACION_ECONOMICA' ? '' : 'none';
        if (informe.tipo === 'JUSTIFICACION_ECONOMICA') renderJustificacionEconomica_(informe);

        document.getElementById('seccion-evidencia').style.display = informe.tipo === 'EVIDENCIA_SOCIAL' ? '' : 'none';
        if (informe.tipo === 'EVIDENCIA_SOCIAL') renderEvidenciaSocial_(informe);

        if (esInformeSinJerarquia) return;

        var conteoTareas = informe.tipo === 'MEMORIA'
          ? (informe.resumenGlobal ? informe.resumenGlobal.TAREA : {})
          : informe.tareasPorEstado;
        var resumen = informe.tipo === 'MEMORIA' ? informe.resumenGlobal : {
          PROYECTOS: informe.proyectosPorEstado || null,
          TAREAS: conteoTareas
        };

        if (informe.tipo === 'MEMORIA') {
          document.getElementById('resumen').innerHTML = renderResumenObjeto(informe.resumenGlobal.TAREA) +
            '<div class="resumen-linea"><strong>Campañas</strong><span class="badge">' + informe.campanas.length + '</span></div>';
        } else {
          document.getElementById('resumen').innerHTML = renderResumenObjeto(conteoTareas);
        }

        renderLista('tareas-retrasadas', informe.tareasRetrasadas, function (tarea) {
          return '<div class="item alerta">' + escapeHtml(tarea.NOMBRE) + ' — vencía ' + escapeHtml(tarea.FECHA_FIN_PLAN) + '</div>';
        });

        renderLista('decisiones-pendientes', informe.decisionesPendientes, function (decision) {
          var vencida = decision.VENCIDA ? ' (VENCIDA)' : '';
          return '<div class="item' + (decision.VENCIDA ? ' alerta' : '') + '">' +
            escapeHtml(decision.TITULO) + ' — ' + escapeHtml(decision.ESTADO) + vencida + '</div>';
        });

        renderLista('incidencias-abiertas', informe.incidenciasAbiertas, function (incidencia) {
          return '<div class="item alerta">' + escapeHtml(incidencia.TITULO) + ' — ' + escapeHtml(incidencia.ESTADO) +
            ' (' + escapeHtml(incidencia.PRIORIDAD) + ')</div>';
        });
      }

      function mostrarError(error) {
        document.getElementById('estado-carga').textContent = 'Error: ' + (error && error.message ? error.message : error);
      }

      var tipoActual = null;
      var filtroActual = null;

      function generarInformeActual() {
        var tipo = document.getElementById('tipo').value;
        var registro = document.getElementById('registro').value;
        tipoActual = tipo;
        if (tipo === 'MEMORIA' || tipo === 'DESVIACION' || tipo === 'CALIDAD_PLANIFICACION') {
          filtroActual = null;
        } else if (tipo === 'JUSTIFICACION_ECONOMICA' || tipo === 'EVIDENCIA_SOCIAL') {
          filtroActual = { entidadTipo: document.getElementById('nivel-economico').value, entidadId: registro };
        } else {
          filtroActual = registro;
        }
        document.getElementById('btn-exportar-csv').disabled = true;
        document.getElementById('btn-exportar-pdf').disabled = true;
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('estado-carga').textContent = 'Generando informe...';
        google.script.run
          .withSuccessHandler(function (informe) { renderInforme(informe); document.getElementById('btn-exportar-csv').disabled = false; document.getElementById('btn-exportar-pdf').disabled = false; })
          .withFailureHandler(mostrarError)
          .generarInforme(tipo, filtroActual);
      }

      document.getElementById('btn-exportar-csv').addEventListener('click', function () {
        if (!tipoActual) return;
        google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarCSV(tipoActual, filtroActual);
      });
      document.getElementById('btn-exportar-pdf').addEventListener('click', function () {
        if (!tipoActual) return;
        google.script.run.withFailureHandler(mostrarError).abrirDialogoExportarPDF(tipoActual, filtroActual);
      });
      document.getElementById('tipo').addEventListener('change', cargarOpcionesRegistro);
      document.getElementById('nivel-economico').addEventListener('change', cargarOpcionesRegistroPorNivel_);
      document.getElementById('btn-generar').addEventListener('click', generarInformeActual);

      cargarOpcionesRegistro();
    </script>
  </body>
</html>
