# Agente de Portainer para la Pi -- se conecta el servidor de Portainer
# del VPS (engremiat-portainer) a este agente por el puerto 9001, via
# Tailscale (100.125.52.52), nunca por la IP LAN abierta que usa el resto
# de la Pi. Desplegar con: docker compose -f docker-compose.pi.yml up -d
# en /home/nodo-admin/ (o donde el operador prefiera) -- no toca el
# docker-compose.yml existente de n8n+baserow.

services:
  portainer-agent:
    image: portainer/agent:latest
    container_name: engremiat-portainer-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "100.125.52.52:9001:9001"   # solo Tailscale, nunca 0.0.0.0
