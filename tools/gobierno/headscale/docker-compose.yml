# Headscale -- servidor de coordinacion propio de Tailscale, autoalojado.
# Etapa 1 del plan (ver conversacion): aditivo, reversible -- se levanta y se verifica,
# pero ningun nodo real (VPS/Pi/PC) se migra a el todavia. Migrar nodos reales es la
# Etapa 2, deliberadamente separada por el riesgo real de cortar conectividad viva
# (backups, webhooks de encendido remoto, etc.) -- requiere autorizacion explicita aparte.
# Mismo criterio de minimo privilegio que el resto del VPS: atado solo a Tailscale.

services:
  headscale:
    image: headscale/headscale:0.29.3
    container_name: engremiat-headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    ports:
      - "100.107.171.88:8081:8081"
      - "100.107.171.88:50443:50443"
      - "100.107.171.88:9092:9092"

  # Headplane -- UI real de Headscale, Etapa C0 de
  # PROPUESTA_ECOSISTEMA_CONECTADO_ENGREMIAT.md. Anadido, no sustituye
  # nada -- se conecta a headscale por el nombre de servicio Docker
  # (misma red de este compose), nunca reinicia headscale por su cuenta.
  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: engremiat-headplane
    restart: unless-stopped
    depends_on:
      - headscale
    volumes:
      - ./headplane-config.yaml:/etc/headplane/config.yaml:ro
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - headplane-data:/var/lib/headplane
    ports:
      - "100.107.171.88:3002:3000"   # solo Tailscale

volumes:
  headscale-data:
  headscale-run:
  headplane-data:
