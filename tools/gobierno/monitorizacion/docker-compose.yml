# Stack de monitorizacion real del recurso (GASTO_API) -- Prometheus + Grafana.
# Mismo criterio de minimo privilegio que el resto de servicios del VPS
# (ver INFRAESTRUCTURA.md): nada atado a 0.0.0.0, solo a la IP de Tailscale.
# Desplegar junto al resto del stack ya existente (n8n, Baserow), no lo sustituye.
#
# Antes de "docker compose up -d":
#   1. export BASEROW_TOKEN=<token real, el mismo que ya usan los scripts de tools/gobierno>
#   2. Sustituir TAILSCALE_IP en este fichero por la IP real de Tailscale del VPS
#      (100.107.171.88 a fecha de esta version -- ver 01_Mundo/VPS y Tailscale.md).
#   3. Autorizacion explicita antes de levantarlo en real, mismo gate humano de siempre.

services:
  exportador-gasto:
    image: node:22-alpine
    container_name: engremiat-exportador-gasto
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../exportador_prometheus_gasto.mjs:/app/exportador_prometheus_gasto.mjs:ro
    environment:
      - BASEROW_URL=http://100.107.171.88
      - BASEROW_TOKEN=${BASEROW_TOKEN}
      - PUERTO=9310
      - BIND=0.0.0.0   # dentro del contenedor; el puerto publicado abajo es el que se ata a Tailscale
    command: node exportador_prometheus_gasto.mjs
    ports:
      - "100.107.171.88:9310:9310"   # solo Tailscale, nunca 0.0.0.0 en el host

  prometheus:
    image: prom/prometheus:latest
    container_name: engremiat-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "100.107.171.88:9090:9090"
    depends_on:
      - exportador-gasto

  grafana:
    image: grafana/grafana-oss:latest
    container_name: engremiat-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://100.107.171.88:3001
    ports:
      - "100.107.171.88:3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
