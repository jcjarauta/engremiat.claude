<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engremiat -- herramientas</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: var(--color-base-fondo); color: var(--color-base-texto); font-family: system-ui, sans-serif; }
  body { padding: 24px 28px 60px; max-width: 820px; }
  a.volver { color: #6fb3f2; text-decoration: none; font-size: 12px; }
  h1 { font-size: 18px; margin: 6px 0 4px; }
  p.hint { color: var(--color-base-texto-suave); font-size: 12px; line-height: 1.6; margin: 0 0 4px; }
  .menu-real { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 20px; }
  .menu-real .item { display: block; padding: 14px 16px; border: 1px solid var(--color-base-borde-suave); border-radius: 10px; text-decoration: none; color: inherit; background: var(--color-base-superficie, transparent); }
  .menu-real .item:hover { border-color: var(--color-acento, #3d7dd6); }
  .menu-real h2 { font-size: 13px; margin: 0 0 4px; }
  .menu-real p { font-size: 11.5px; color: var(--color-base-texto-suave); margin: 0; line-height: 1.5; }
  .vacio-real { padding: 10px 0; color: var(--color-base-texto-tenue); font-size: 12px; }
</style>
</head>
<body>
<a class="volver" href="home.html">← Home</a>
<h1>HERRAMIENTAS</h1>
<p class="hint">Índice real de herramientas de este Proyecto -- cada tarjeta es una página real (un Producto con su propio archivo) colgada de aquí en el Sheet.</p>
<div id="menuReal" class="menu-real"><p class="vacio-real">Cargando...</p></div>
<script src="generador_paginas.js"></script>
<script>
// §8.153: HERRAMIENTAS (PRO-0007) se hace propio ID -- pagina estatica, no hay forma de
// saber "quien soy" salvo fijarlo aqui. Antes esta pagina alojaba directamente una unica
// herramienta (CATALOGOS) como si fuera ella misma -- confusion real detectada por el
// operador ("estamos mezclando 'formulario de contacto' con 'catalogos'"). Ahora es solo
// el indice: cada Producto real que cuelgue de PRO-0007 con su propio "(archivo.html)" es
// una herramienta real distinta, listada aqui como tarjeta -- mismo patron que home.html
// (listarPaginasDeEntradaReales) pero acotado a este Proyecto en vez de al arbol entero.
const ID_PROPIO = 'PRO-0007';
const URL_MEMORIA = 'http://100.107.171.88:9330';

function escapeHtmlLocal(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function cargarIndiceHerramientas() {
  const cont = document.getElementById('menuReal');
  try {
    const j = await (await fetch(URL_MEMORIA + '/api/jerarquia_campanas')).json();
    const hallazgo = buscarNodoEnArbol(j, ID_PROPIO);
    if (!hallazgo) { cont.innerHTML = '<p class="vacio-real">No se encontró ' + ID_PROPIO + ' real en el árbol.</p>'; return; }
    const entradas = [];
    const recorrer = (n) => {
      const m = RE_PAGINA_REAL.exec(n.nombre || '');
      if (m) { entradas.push({ archivo: m[1], nombre: n.nombre.replace(/\s*\([\w.-]+\.html\)\s*$/, '') }); return; }
      (n.hijos || []).forEach(recorrer);
    };
    (hallazgo.nodo.hijos || []).forEach(recorrer);
    if (!entradas.length) { cont.innerHTML = '<p class="vacio-real">(sin herramientas reales todavía bajo este Proyecto)</p>'; return; }
    cont.innerHTML = entradas.map((e) =>
      '<a class="item" href="' + escapeHtmlLocal(e.archivo) + '"><h2>' + escapeHtmlLocal(e.nombre) + '</h2><p>' + escapeHtmlLocal(e.archivo) + '</p></a>'
    ).join('');
  } catch (e) {
    cont.innerHTML = '<p class="vacio-real">Error real cargando el índice: ' + escapeHtmlLocal(e.message) + '</p>';
  }
}
cargarIndiceHerramientas();
</script>
</body>
</html>
