# Visor real del grafo de codigo (Graphify, 1585 nodos/4665 relaciones
# reales, ver PROPUESTA_BASTIDOR_GESTOR_PROYECTOS_ENGREMIAT.md §8.16).
# graph.html es estatico y autocontenido (carga vis-network desde unpkg.com,
# unica dependencia externa) -- ningun backend, ninguna credencial, solo
# lectura. Mismo criterio de minimo privilegio que el resto del VPS: atado
# solo a Tailscale, nunca 0.0.0.0. Nace localmente por un choque real de
# puerto 3000 con el Open WebUI ya desplegado en Docker local -- se saca
# del portatil/Docker local para que no dependa de que esa maquina este
# encendida.

services:
  graphify-visor:
    image: node:22-alpine
    container_name: engremiat-graphify-visor
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./index.html:/app/index.html:ro
      - ./nodejs.html:/app/nodejs.html:ro
      - ./grafo_node.json:/app/grafo_node.json:ro
      - ./n8n.html:/app/n8n.html:ro
      - ./grafo_n8n.json:/app/grafo_n8n.json:ro
      - ./sheet-real.html:/app/sheet-real.html:ro
      - ./grafo_historial.json:/app/grafo_historial.json:ro
      - ./grafo_jerarquia.json:/app/grafo_jerarquia.json:ro
      - ./grafo_paquete_cliente.json:/app/grafo_paquete_cliente.json:ro
      - ./grafo_telar_estados.json:/app/grafo_telar_estados.json:ro
      - ./grafo_wikilinks.json:/app/grafo_wikilinks.json:ro
      - ./censo_entidades.json:/app/censo_entidades.json:ro
      - ./entidades.html:/app/entidades.html:ro
      - ./indice.html:/app/indice.html:ro
      - ./resumen_universo.html:/app/resumen_universo.html:ro
      - ./holon.html:/app/holon.html:ro
      - ./grafo_holon.json:/app/grafo_holon.json:ro
      - ./grafo_maestro.html:/app/grafo_maestro.html:ro
      - ./anatomia.html:/app/anatomia.html:ro
      - ./anatomia_entidades.json:/app/anatomia_entidades.json:ro
      - ./atlas_familias.json:/app/atlas_familias.json:ro
      - ./ciclos_reales.json:/app/ciclos_reales.json:ro
      - ./mesa_montaje.html:/app/mesa_montaje.html:ro
      - ./boceto_layout_6_zonas.html:/app/boceto_layout_6_zonas.html:ro
      - ./panel_operativo.html:/app/panel_operativo.html:ro
      - ./arbol_campanas.html:/app/arbol_campanas.html:ro
      - ./home.html:/app/home.html:ro
      - ./vista_sistema.html:/app/vista_sistema.html:ro
      - ./grafo_visor.json:/app/grafo_visor.json:ro
      - ./grafos.html:/app/grafos.html:ro
      - ./taller.html:/app/taller.html:ro
      - ./plantilla_grafo_espacio.html:/app/plantilla_grafo_espacio.html:ro
      - ./plantilla_extractor.mjs:/app/plantilla_extractor.mjs:ro
      - ./vista_recursos.html:/app/vista_recursos.html:ro
      - ./vista_modulos.html:/app/vista_modulos.html:ro
      - ./vista_reglas.html:/app/vista_reglas.html:ro
      - ./grafo_recurso.json:/app/grafo_recurso.json:ro
      - ./grafo_modulo.json:/app/grafo_modulo.json:ro
      - ./grafo_regla.json:/app/grafo_regla.json:ro
      - ./fichas_grafos.json:/app/fichas_grafos.json:ro
      - ./candidatos_a_promover.json:/app/candidatos_a_promover.json:ro
      - ./tecnico.html:/app/tecnico.html:ro
      - ./fichas_prompt.json:/app/fichas_prompt.json:ro
      - ./crear_ficha_prompt.mjs:/app/crear_ficha_prompt.mjs:ro
      - ./biblioteca.html:/app/biblioteca.html:ro
      - ./evaluaciones_deepseek.json:/app/evaluaciones_deepseek.json:ro
      - ./respuestas_worker_local.json:/app/respuestas_worker_local.json:ro
      - ./design-tokens.json:/app/design-tokens.json:ro
      - ./tokens.css:/app/tokens.css:ro
    command: npx --yes serve /app -l 9320
    ports:
      - "100.107.171.88:9320:9320"

  # Fase 4 del Bastidor -- memoria compartida real de la mesa de montaje
  # (§8.52). Unico servicio de este visor con ESCRITURA -- las diez vistas
  # anteriores son solo lectura via npx serve. Persiste en un fichero JSON
  # real en ./datos_memoria (montado rw, fuera del sync de codigo).
  # §8.64: ademas de las credenciales JWT de Sheets, ahora tambien lee
  # Baserow (GASTO_API, PLANTILLA_MISION) -- mismo token real .env que ya
  # usa tools/gobierno/spike_concilio_coop, reutilizado, nunca duplicado.
  memoria-montaje:
    image: node:22-alpine
    container_name: engremiat-memoria-montaje
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - PUERTO=9330
      - DATOS_DIR=/app/datos
      - ENGREMIAT_SHEETS_CREDENTIALS_PATH=/app/.sheets_credenciales.json
      - BASEROW_URL=http://100.107.171.88
    volumes:
      - ./servidor_memoria.mjs:/app/servidor_memoria.mjs:ro
      - ./datos_memoria:/app/datos
      - ./.sheets_credenciales.json:/app/.sheets_credenciales.json:ro
      # §8.94: MISMO fichero real que graphify-visor sirve en :ro -- aqui en rw para que
      # POST /api/promover_grafo pueda escribirlo. Un solo fichero en el host, dos
      # contenedores viendolo (uno sirve, el otro escribe), sin duplicar estado.
      - ./fichas_grafos.json:/app/fichas_grafos.json
      - ./candidatos_a_promover.json:/app/candidatos_a_promover.json
    command: node /app/servidor_memoria.mjs
    ports:
      - "100.107.171.88:9330:9330"
